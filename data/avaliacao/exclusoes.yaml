# A RÉGUA DE FALSO NEGATIVO DO FILTRO DO INCEPTION (D-061)
#
# POR QUE ELA EXISTE, E POR QUE VEM ANTES DA CORREÇÃO
# -----------------------------------------------------
# `briefing.elegibilidade()` é o Diferencial declarado do projeto: um sistema que RECUSA
# recomendar o Inception para uma consultoria de IA, e explica por quê, demonstra regra de
# negócio. Em 25/08 a régua dos agentes mostrou que ele exclui por MENÇÃO, não por identidade —
# a Axenya (prospect de prioridade máxima) é recusada por "Integramos consultoria, dados e
# operação clínica", e a Freedom AI porque um PARCEIRO dela é "auditoria, consultoria e
# tributos".
#
# D-052, achado 3, decidiu NÃO consertar, e o motivo era assimetria de risco: um padrão de
# identidade introduz falso negativo SILENCIOSO. Falso positivo aparece no briefing; falso
# negativo não aparece em lugar nenhum. E a base tinha UMA fixture (Deal) exercitando o lado
# positivo — isso é anedota, não régua.
#
# PARES MÍNIMOS: MESMO TERMO, SUJEITO DIFERENTE
# -----------------------------------------------
# Cada `rotulo` tem casos dos DOIS lados. É a mesma lógica da linha trivial em
# `avaliar_agentes.py`: sem os dois lados, "zero falso positivo" é alcançável por um filtro que
# não exclui nada, e "zero falso negativo" por um que exclui tudo. Um número só esconde
# exatamente a assimetria que motivou o arquivo.
#
# `origem` é obrigatória e distingue o que veio de documento real do que foi escrito para o
# teste. Um caso sintético é legítimo — é assim que se cobre `revenda`, que nenhuma fixture
# exercita — mas passar sintético por real seria a mesma desonestidade que D-021 barrou nas
# fixtures do seed.

casos:

  # ── consultoria ────────────────────────────────────────────────────────────
  # O rótulo que o filtro erra hoje, e o único com material real dos dois lados.

  - rotulo: consultoria
    exclui: true
    frase: "A Deal é uma consultoria de IA para empresas brasileiras e latino-americanas, com mais de 600 especialistas atuando em mais de 120 cidades."
    origem: data/seed/deal.yaml — site
    nota: identidade declarada com o verbo de ligação — "é uma consultoria"

  - rotulo: consultoria
    exclui: true
    frase: "Somos uma consultoria e serviços de tecnologia com 21 anos"
    origem: data/seed/deal.yaml — vaga
    nota: identidade em primeira pessoa — "somos uma consultoria"

  - rotulo: consultoria
    exclui: true
    frase: "Como nossa consultoria de IA para empresas gera resultados"
    origem: data/seed/deal.yaml — site
    nota: >-
      identidade por POSSESSIVO — "nossa consultoria". É o caso que um padrão ancorado em
      "somos|é uma" perde, e por isso ele está aqui: é a armadilha do desenho recomendado.

  - rotulo: consultoria
    exclui: false
    frase: "Integramos consultoria, dados e operação clínica em uma única plataforma para prevenir antes que a doença vire custo."
    origem: data/seed/axenya.yaml — site
    nota: >-
      USO, não identidade. A Axenya usa consultoria como insumo; não é uma consultoria. É o
      falso positivo que recusa o prospect de prioridade máxima do projeto.

  - rotulo: consultoria
    exclui: false
    frase: "Além disso, a startup tem uma parceria com a Grant Thornton, uma das maiores empresas globais de auditoria, consultoria e tributos, para validação e inovação."
    origem: data/seed/freedom-ai.yaml — noticia
    nota: >-
      o sujeito é um PARCEIRO. A frase descreve a Grant Thornton, não a Freedom AI. Nenhuma
      fronteira de palavra separa isto — o termo é o certo, a empresa é outra.

  - rotulo: consultoria
    exclui: false
    frase: "Contratamos uma consultoria externa para auditar nosso pipeline de dados antes da rodada."
    origem: sintético
    nota: a empresa é CLIENTE de consultoria. Terceiro sujeito possível, sem caso real na base.

  # ── revenda ────────────────────────────────────────────────────────────────
  # Nenhuma fixture exercita este rótulo. Os dois lados são sintéticos, e isso está declarado.

  - rotulo: revenda
    exclui: true
    frase: "Somos revendedores autorizados de licenças de software para o mercado corporativo."
    origem: sintético
    nota: identidade — a empresa revende

  - rotulo: revenda
    exclui: false
    frase: "Nossos clientes revendem os relatórios gerados pela plataforma para as próprias carteiras."
    origem: sintético
    nota: quem revende é o CLIENTE. Mesmo defeito de sujeito da Freedom AI, em outro rótulo.

  # O TERCEIRO PAR DE `consultoria`, e ele é REAL (03/09, D-092). A Automni — deep tech de robôs
  # móveis — saía NÃO ELEGÍVEL porque o site dela fala da PARCEIRA "Davinci - Consulting & Tech".
  # D-085 previu exatamente este caso e a lista tinha "parceria com"; a frase real diz
  # "parceria ENTRE". O escopo de frase estava certo; faltava a variante.
  - rotulo: consultoria
    exclui: false
    frase: "Neste episódio, exploramos a inovação e automação logística no Brasil, destacando a parceria entre a Davinci - Consulting & Tech e a Automni."
    origem: >-
      data/seed/automni.yaml — frase LITERAL do site coletado em 03/09
    nota: >-
      o termo está no NOME de uma parceira. Se este caso voltar a excluir, a variante saiu da
      lista de marcadores de terceiro.

  # ── cripto ─────────────────────────────────────────────────────────────────
  # O par que documenta D-048: "token" saiu da lista porque é ambíguo entre cripto e
  # inferência de LLM, e "custo por token" derrubava qualquer startup de infraestrutura.

  - rotulo: cripto
    exclui: true
    frase: "A plataforma faz tokenização de ativos imobiliários registrada em blockchain."
    origem: sintético
    nota: identidade cripto por dois termos independentes

  # O SEGUNDO PAR DE `cripto`, e ele é REAL, não sintético (03/09, D-090). A base ganhou uma
  # agtech que usa blockchain para rastrear boi, e o filtro a recusou. `blockchain` é o mesmo
  # erro de forma que D-048 corrigiu em "token": um termo de TECNOLOGIA fazendo o trabalho de um
  # termo de IDENTIDADE. O veto de terceiro de D-085 não alcança este caso — ele responde "de
  # quem a frase fala?", e aqui a frase fala mesmo da própria empresa; a pergunta errada é a
  # outra: "ser isto define a empresa?". Rastrear commodity com blockchain não é ser cripto.
  - rotulo: cripto
    exclui: false
    frase: "A tecnologia da Ecotrace integra blockchain, IA, visão computacional, IoT e geointeligência para rastrear commodities."
    origem: >-
      data/seed/ecotrace.yaml — frase literal do documento coletado em 03/09
    nota: >-
      blockchain como TECNOLOGIA de rastreabilidade, não como identidade cripto. Se este caso
      voltar a excluir, o termo genérico voltou para a lista. Par com o caso da Liqi, que é
      cripto de verdade e tem de continuar excluída por `tokenização de ativos`.

  - rotulo: cripto
    exclui: true
    frase: "Infraestrutura para sua empresa oferecer criptomoedas, stablecoins e tokens de ativos na sua própria plataforma."
    origem: >-
      data/seed/liqi.yaml — frase LITERAL do site coletado em 03/09
    nota: >-
      identidade cripto SEM depender de "blockchain". É a rede que garante que remover o termo
      genérico não abre a porta para a empresa que o filtro existe para barrar.
      ESTE CASO NASCEU DE UM ERRO MEU, e o erro vale mais que o caso: a primeira versão era
      PARÁFRASE minha, escrita já contendo "tokenização de ativos". Ela passou 8/8 enquanto a
      Liqi REAL saía ELEGÍVEL no grafo — uma rede que eu mesmo tricotei em volta da resposta.
      É o motivo de `origem` ser campo obrigatório neste arquivo.

  - rotulo: cripto
    exclui: true
    frase: "entrou na onda das stablecoins e colocou no mercado a sua própria moeda, a BRLD."
    origem: >-
      data/seed/liqi.yaml — frase LITERAL da notícia coletada em 03/09
    nota: >-
      `stablecoin` entrou na lista em 03/09. Emitir stablecoin é identidade cripto sem qualquer
      ambiguidade — diferente de `blockchain`, que é tecnologia, e de `token`, que D-048 tirou.

  - rotulo: cripto
    exclui: false
    frase: "Reduzimos o custo por token de inferência em 40% depois de migrar o serving."
    origem: >-
      derivado de tests/test_grafo.py — o caso real que D-048 pagou
    nota: >-
      "token" em contexto de LLM. Este caso é a rede de D-048: se ele voltar a excluir, o termo
      ambíguo voltou para a lista.

  # ── capital aberto ─────────────────────────────────────────────────────────
  # O PAR REAL DE `capital aberto` (03/09, D-094). A lista era B3-CÊNTRICA: tinha
  # "listada na b3" e "ipo concluído", e a Zenvia — listada na NASDAQ desde 2021 — saía
  # ELEGÍVEL. Metade das brasileiras que abrem capital lista fora do Brasil (Nubank, VTEX,
  # PagSeguro, StoneCo, XP), então a lacuna não era exótica: era o caso mais comum.
  # Terceira vez na mesma sessão em que o CONCEITO estava certo e o VOCABULÁRIO era estreito.
  - rotulo: capital aberto
    exclui: true
    frase: "Listada na Nasdaq, a companhia registrou um crescimento de 126% no Ebitda no período, atingindo R$ 33,7 milhões."
    origem: >-
      data/seed/zenvia.yaml — frase LITERAL da notícia coletada em 03/09, e ela ocorre num
      trecho de evidência (o que `elegibilidade()` de fato lê — ver P-23)
    nota: >-
      capital aberto FORA da B3. Se este caso voltar a passar, a lista voltou a ser B3-cêntrica.

  - rotulo: capital aberto
    exclui: false
    frase: "Nossos clientes incluem companhias listadas na Nasdaq e na B3, além de multinacionais."
    origem: sintético
    nota: >-
      o par obrigatório: quem está listada é o CLIENTE. Alargar a lista de termos sem este caso
      seria comprar falso positivo — o veto de terceiro de D-085 tem de segurar aqui.

  # O CASO QUE EU MESMO CRIEI AO ALARGAR A LISTA (03/09, D-094), e ele é o par do da Liqi.
  # Ao pôr `stablecoin` na lista de cripto, a **Iniciador** — infraestrutura de Open Finance e
  # Pix — passou a ser recusada por uma frase que fala do MERCADO de stablecoins como contexto
  # competitivo, não dela. É uma terceira forma de sujeito, ao lado das duas que D-085 nomeou:
  # não é "outra empresa" nem "somos consumidores" — é "o termo nomeia um MERCADO".
  - rotulo: cripto
    exclui: false
    frase: "A corrida para conectar modelos de inteligência artificial aos meios de pagamento, hoje disputada por gigantes de cartões e pelo mercado de stablecoins, ganhou uma frente brasileira."
    origem: >-
      data/seed/iniciador.yaml — frase LITERAL da notícia coletada em 03/09
    nota: >-
      o termo nomeia o MERCADO, não a empresa. Par obrigatório do caso da Liqi, que diz
      "Liqi lança stablecoin" e "colocou no mercado a sua própria moeda" — ali o sujeito é ela.

  # ── cloud provider ─────────────────────────────────────────────────────────

  - rotulo: cloud provider
    exclui: true
    frase: "Operamos datacenter próprio em três regiões e vendemos capacidade como provedor de nuvem."
    origem: sintético
    nota: identidade — a empresa É o provedor

  - rotulo: cloud provider
    exclui: false
    frase: "Rodamos nossa inferência no datacenter próprio de um parceiro de infraestrutura."
    origem: sintético
    nota: o datacenter é de terceiro. A empresa é inquilina, não provedora.

  # ── capital aberto ─────────────────────────────────────────────────────────

  - rotulo: capital aberto
    exclui: true
    frase: "A companhia é listada na B3 desde 2021 sob o código ACME3."
    origem: sintético
    nota: identidade — a própria empresa é listada

  - rotulo: capital aberto
    exclui: false
    frase: "Entre os clientes estão seis empresas listadas na B3 e duas estatais."
    origem: sintético
    nota: quem tem capital aberto é o CLIENTE.
