# A RÉGUA DA `justificativa_tecnica` — P-10 (D-086)
#
# POR QUE ELA EXISTE, E POR QUE VEM ANTES DO SELETOR
# ----------------------------------------------------
# A tabela de pendências dizia, literalmente: *"a saída que o usuário lê é a única sem
# instrumento"*. `justificativa_tecnica` é um dos 7 campos obrigatórios do TAPI e o primeiro que o
# gerente lê — e nada quebrava quando ela vinha errada. Rodando o grafo em 02/09, ela saiu como
# case da **Writer**, como CTA (*"Join our ecosystem…"*) e como menu (*"Learn More / - Documentation
# / - FAQs"*). Anedota não é medição, e corrigir sem régua é ajustar ao último exemplo visto.
#
# ESTE ARQUIVO FOI ROTULADO **ANTES** DE O SELETOR EXISTIR, e é isso que o torna um teste em vez de
# um espelho. A amostra é `random.sample(175, 30)` com `seed=20260902`, sobre a estratégia de
# produção (`estrutural-v1`) — não é escolha de chunk a dedo.
#
# O QUE SE MEDE, E CONTRA QUAL LINHA TRIVIAL
# -------------------------------------------
# Hoje `justificativa_tecnica = citacao.trecho`: o chunk INTEIRO, mediana de 803 caracteres, do
# qual o briefing imprime os 150 primeiros. Então a linha trivial deste critério é
# **"os 150 primeiros caracteres do chunk"** — e ela não é fraca: metade dos chunks começa por uma
# frase boa. Sem ela na tabela, qualquer número do seletor pareceria vitória (D-051).
#
# AS CINCO CATEGORIAS, FIXADAS ANTES DE ROTULAR
#   serve                — afirma um fato verificável SOBRE A TECNOLOGIA: o que faz, como, com
#                          que números, componentes ou requisitos
#   case_de_terceiro     — o sujeito é OUTRA empresa (Writer, Iguazio, CrowdStrike, bunq…).
#                          É o defeito nomeado em D-082
#   navegacao            — rótulo de link, índice, listagem de vídeo, "Learn More About X"
#   cta                  — convite a agir: join, contact, apply, activate, purchase, download
#   marketing_generico   — prosa institucional sem fato verificável
#   nao_serve            — fato, mas não sobre adoção (governança de repo, ferramenta legada)
#
# `ancoras` é a lista de trechos que um span CORRETO precisa conter — mais de um quando o chunk tem
# mais de uma passagem boa, no mesmo idioma de `elegivel: [true, false]` do gabarito das fixtures:
# aceitar as duas é mais honesto que eleger uma por gosto. `ancoras: null` significa **o chunk
# inteiro não serve** — e esses casos saem do denominador, porque punir o seletor por não achar o
# que não existe mede a amostra, não o seletor.
#
# `nota_prefixo` registra o que a linha trivial entrega hoje. É documentação, NÃO é pontuada — o
# harness recalcula a linha trivial do texto, para que o número não dependa do meu rótulo.

amostra:
  fonte: chunks_nvidia · estrategia estrutural-v1
  n_corpus: 175
  n: 30
  seed: 20260902
  orcamento_span: 320   # caracteres — 2-3 frases é justificativa; 842 é despejo de documento

casos:

