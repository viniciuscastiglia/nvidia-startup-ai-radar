  - termo: "avaliaç"
    origem: 'contexto/02-rubrica-ai-native.md:148 — "avaliação"'
    nota: >-
      AUSENTE DA PRODUÇÃO. É também o termo de maior risco de falso positivo em português
      ("avaliação de crédito", "avaliação de imóvel"), e é por isso que ele é medido em vez de
      promovido: o risco é real e a medição é quem decide.
  - termo: "guardrail"
