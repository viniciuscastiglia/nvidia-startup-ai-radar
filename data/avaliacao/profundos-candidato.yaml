# `PROFUNDOS` ALTERNATIVO — a hipótese 2 de D-060, sob protocolo anti-contaminação (D-106)
#
# O QUE ESTA LISTA TESTA
# -----------------------
# D-060 mediu que a rubrica em degraus empata com o trivial e com uma linha de controle de um
# caractere, e explicou por quê: **sete das oito fixtures têm profundidade ZERO**. Daí saíram
# duas hipóteses, e só duas:
#
#   1. os documentos não contêm o sinal  -> trabalho de CURADORIA.
#      **REFUTADA em 03/09** (D-095): 29 das 30 têm zero dos 13 marcadores, e 1 de 7 vagas reais
#      da Zenvia — uma empresa da Nasdaq — tem 2, abaixo do limiar. Se nem ali há vocabulário de
#      inferência, a empresa consome API. Que é a tese do TAPI.
#   2. a lista `PROFUNDOS` não cobre como uma empresa que não é de infra descreve a própria
#      stack -> trabalho de RUBRICA. **É esta lista.**
#
# O PROTOCOLO, E ELE É A DECISÃO
# -------------------------------
# A tentativa de 04/09 escreveu uma lista alternativa CONHECENDO o gabarito, e é imprestável —
# é o erro que D-091 custou uma sessão inteira ("rede tricotada em volta da resposta não é
# rede"). Esta lista foi derivada de dois documentos escritos em 22/08, **antes de qualquer
# medição deste projeto**, e commitada ANTES de rodar qualquer coisa. O commit é o carimbo.
#
# `origem` é obrigatória por termo, com documento e trecho literal. Um termo sem origem é um
# termo que eu inventei olhando o resultado, e não há como distinguir depois.
#
# OS DOIS ACHADOS DA DERIVAÇÃO, ANTES DE MEDIR
# ---------------------------------------------
# Ler `contexto/02` §4 linha 148 com a lista de produção do lado responde sozinho:
# a rubrica nomeia CINCO formas de otimização técnica própria — *"self-hosting, quantização,
# avaliação, guardrails, MLOps real"* — e a produção cobre TRÊS. **`avaliação` e `guardrails`
# nunca tiveram marcador**, e são exatamente as duas que uma healthtech ou uma legaltech usaria
# para descrever a própria stack, porque não exigem falar de GPU.
#
# O segundo: dos 13 de produção, oito são NOME DE PRODUTO (`cuda`, `gpu`, `tensorrt`, `triton`,
# `vllm`) ou vocabulário de infraestrutura (`throughput`, `on-premise`, `self-hosted`). A lista
# mede quem fala como fornecedor de infra — que é a Maritaca, a única que ela acerta.

candidato:

