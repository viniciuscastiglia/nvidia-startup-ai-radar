# Gabarito de avaliação do RAG NVIDIA — passo 9 do pipeline do TAPI. Ver D-030.
#
# POR QUE ELE É DESTA SESSÃO E NÃO DA ÚLTIMA
# A sessão 02 decide chunking e dimensão. Sem régua, decide por argumento e descobre por
# medição depois. Escrever as perguntas durante a leitura das 16 páginas custa quase nada;
# relê-las na sessão 04 custaria a sessão inteira.
#
# A ÂNCORA É O DOCUMENTO, NÃO O CHUNK (D-030)
# `recall@k` = "algum dos k primeiros chunks veio de `url_esperada`". Assim a métrica
# SOBREVIVE a mudança de chunking — que é exatamente o que permite comparar estratégias.
# Um gabarito preso a id de chunk teria que ser reescrito a cada mudança de banda, o que na
# prática significa nunca mudar a banda.
# `frase_ancora` habilita a variante ESTRITA: além do documento certo, o chunk contém a frase.
#
# PROCEDÊNCIA — como cada pergunta foi validada (23/08/2026)
# Toda `frase_ancora` foi verificada por consulta SQL contra `chunks_nvidia`: ela ocorre no
# corpus e ocorre em UMA só tecnologia. A verificação é `scripts/avaliar_rag.py --validar`.
#
# O que a verificação já derrubou: "1.201 tokens/s", "paged KV cache" e "Isaac GR00T" estão
# em `contexto/03` mas NÃO estão nas páginas vivas — o contexto foi escrito de uma versão
# anterior. Perguntas ancoradas neles seriam impossíveis de acertar, e o erro pareceria do
# recuperador. Verificar que a resposta EXISTE na fonte é diferente de verificar que o
# recuperador a encontra; a segunda coisa é o que se está medindo e nunca pode entrar aqui.
#
# tipo: geral | lexical | crosslingual | atribuicao | sem_resposta
#
# AS PERGUNTAS SEM RESPOSTA SÃO CINCO, E DE REGIMES DIFERENTES DE PROPÓSITO (D-039)
# Até 24/08 havia UMA (q20), e toda conclusão sobre abstenção — D-033 e a refutação do reranker
# em D-035 — repousava nela. Uma afirmação sobre SOBREPOSIÇÃO DE DISTRIBUIÇÕES com n=1 não é
# medição: de um lado não há distribuição, há um ponto.
#
# Cinco variações de "preço" mediriam só o pior caso. O campo `regime` separa dois:
#   topicamente_perfeita — a base fala do assunto com autoridade e só não tem o fato pedido.
#                          É o caso difícil, e é onde a fronteira está.
#   topicamente_ausente  — o assunto não está na base. É o caso fácil, e ele existe para provar
#                          que a fronteira EXISTE: um sistema que só abstém aqui aprendeu "não sei
#                          falar disso", não "a base não tem a resposta".
#
# `termos_ausentes` é a PROVA EXECUTÁVEL da ausência, o espelho de `frase_ancora`: se qualquer um
# deles ocorrer no corpus, a pergunta não é sem_resposta e `--validar` falha. A verificação usa
# FRONTEIRA DE PALAVRA e não substring — `ILIKE '%SLA%'` casa dentro de "tran(sla)tion", e foi
# esse erro que quase deixou uma pergunta errada entrar aqui.

