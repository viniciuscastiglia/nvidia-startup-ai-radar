- id: q23
  pergunta: O TensorRT-LLM é mais rápido que o vLLM? Em quantos por cento?
  idioma: pt
  tipo: sem_resposta
  regime: topicamente_perfeita
  tecnologia_esperada: null
  url_esperada: null
  frase_ancora: null
  termos_ausentes: [outperforms, faster than vLLM, versus vLLM, benchmark against]
  justificativa_ausencia: >-
    As duas tecnologias ocorrem no corpus, e o chunk 38 da página do NIM cita as duas JUNTAS
    ("TensorRT-LLM, vLLM ou SGLang"). Mas nenhuma fonte faz a comparação nem publica número:
    `outperforms`, `faster than vLLM`, `versus vLLM` e `benchmark against` estão todos ausentes.
  nota_curadoria: >-
    O CASO MAIS PERIGOSO DO GABARITO. `vllm` e `sglang` têm idf 5,2 e ocorrem juntos em um único
    chunk do corpus inteiro — o mesmo chunk que a q19 usa como resposta certa. Então a
    recuperação vai devolver, com altíssima confiança, um trecho que fala dos dois e não os
    compara. É a receita exata da alucinação com citação de aparência legítima: fonte real,
    trecho real, número inventado.

