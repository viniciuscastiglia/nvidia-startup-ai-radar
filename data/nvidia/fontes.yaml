# ─────────────────────────────────────────────────────────────────────────────
# DUAS URLs DE contexto/03 §5 QUE FICARAM DE FORA, e por quê
#
# - build.nvidia.com ("API Catalog") — rende 28 caracteres: é uma SPA renderizada inteiramente
#   por JavaScript, e o TAPI põe crawling e execução de JS fora de escopo. Não é uma das 16
#   tecnologias nomeadas pelo TAPI, e o que ela representa (porta de entrada de baixo atrito
#   para experimentar a stack) já está descrito na página do NIM. Perda: nenhuma.
#
# - docs.nvidia.com/.../triton-inference-server/user-guide — 2.753 chars e 2 headings,
#   reprovada no piso. É a SEGUNDA fonte do Triton, que já entra pela página do
#   developer.nvidia.com. Perda: profundidade técnica sobre Triton, que é real. Se a sessão 04
#   mostrar recall fraco nas perguntas de Triton, esta é a primeira fonte a re-curar.
# ─────────────────────────────────────────────────────────────────────────────
