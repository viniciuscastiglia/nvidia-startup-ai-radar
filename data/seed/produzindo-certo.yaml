  conteudo_texto: 'no seu e-mail

    Produzindo Certo abre rodada de captação em busca de aporte de R$ 10 milhões

    Agtech, que faz ponte entre produtores sustentáveis e grandes empresas, inicia road show para atrair
    investidores estrangeiros de olho na pauta ESG

    Aline Locks, CEO da Produzindo Certo

    Grandes corporações brasileiras e globais estão cada vez mais atentas à origem das matérias primas
    que utilizam em suas linhas de produção. Na outra ponta, os produtores rurais procuram cada vez mais
    formas de preservar e até ajudar o meio ambiente, mantendo ou até ganhando produtividade.

    A Produzindo Certo é uma agtech que tenta ligar estes dois interesses. A empresa, que tem origem em
    uma ONG, tem como clientes grandes corporações que querem ter como fornecedores produtores rurais
    com responsabilidade socioambiental.

    Nesta terça-feira, 6 de junho,, a fundadora e CEO da empresa, Aline Locks, embarca para a Europa com
    o objetivo de apresentar a empresa para os investidores de lá. “O objetivo é conseguir R$ 10 milhões
    em aportes, que pretendemos investir em tecnologia e na operação”, diz Locks.

    A empresa aproveitará a oportunidade de ser uma das participantes do road show Brazilian Agritech
    Briefing – que começa esta semana na Europa, com eventos em Londres, Berlim e Haia – para abrir uma
    rodada de captação, a primeira feita pela Produzindo Certo.

    A companhia teve origem na ONG Aliança da Terra. Em 2020, os fundadores da organização entenderam
    que, para ampliar seu alcance e causar maior impacto na transformação da produção rural em uma atividade
    mais responsável, precisavam ampliar também sua atuação e a relação com outras empresas.

    "Percebemos que era preciso ter um olha econômico para a sustentabilidade no agronegócio, com soluções
    que parassem em pé", diz Aline. Então, transformaram um dos projetos da ONG em uma empresa a parte
    – a Aliança da Terra permanece ativa, mas com foco em ações de prevenção e combate a incêndios florestais,
    além de projetos de preservação ambiental.

    Desde 2020 com o nome Produzindo Certo, a empresa tem investido no aprimoramento de um sistema de
    avaliação sobre a sustentabilidade socioambiental das propriedades rurais, para as quais oferece assistência
    técnica para detectar os riscos e melhorar a gestão dos produtores.

    Na outra ponta, a empresa fornece a grandes empresas a base de dados com estas propriedades. Ali,
    essas companhias podem ter uma visão clara do status socioambiental de sua cadeia de fornecedores,
    garantindo que os produtos adquiridos são originados em propriedades que adotam boas práticas.

    Podem, também, desenvolver programas para levar assistência técnica a essas propriedades, incentivando-as
    a aprimorar seu desempenho e, assim, qualificar-se a conquistar melhores mercados e, eventualmente,
    melhores preços e outros benefícios vinculados à produção responsável.

    Atualmente, a Produzindo Certo tem quase 7 mil propriedades com cadastro ativo na sua plataforma,
    com área monitorada superior a 7 milhões de hectares. Segundo a companhia, são mais de 3 milhões de
    hectares de vegetação nativa preservada.

    Estas terras não estão só no Brasil. A CEO conta que a Produzindo Certo monitora terras em vários
    países da América Latina. "Estamos iniciando agora na Argentina, inclusive".

    Nos últimos meses a empresa tem feito investimentos na área tecnológica. Reforçou o time de TI e implantou
    um novo sistema digital para Plataforma Produzindo Certo, com um dashboard que permite acompanhamento
    mais claro da evolução dos produtores nos critérios analisados pela empresa.

    Aline explica que a plataforma tem protocolos que somam 88 itens avaliados em cada fazenda, para se
    chegar à avaliação final, em que o produtor recebe um escore que varia de zero a 100.

    "A avaliação vai além dos dados colhidos automaticamente em fontes públicas. Fazemos questão de manter
    técnicos de campo que visitam as propriedades, entrevistam o dono, os funcionários", conta a CEO.

    Na ponta das empresas, a lista de clientes passa por gigantes como ADM, Bayer, Philip Morris, Comigo,
    entre outras. Aline destaca, por exemplo, a parceria com a Unilever. "Eles só compram soja de produtores
    que estão cadastrados na nossa plataforma", diz Locks.

    Segundo ela, a Produzindo Certo tem hoje entre 30 e 40 grandes corporações na carteira, que vão de
    cooperativas agrícolas até bancos.

    Com sua experiência atuando neste segmento, Locks ressalta que o agronegócio brasileiro é um dos mais
    sustentáveis do mundo. "O produtor não quer ter problemas, não quer sofrer com embargos", afirma.

    A CEO da Produzindo Certo afirma que a legislação brasileira é uma das mais robustas do mundo, quando
    se trata de proteção ambiental. "Quando fizemos as avaliações na Argentina, vimos que grande parte
    das exigências para certificação são lei no Brasil".

    Para ela, é necessário maior segurança jurídica. "As leis ambientais mudam muito, são muito complexas.
    Acredito que no Brasil, a prioridade deve ser a restauração de terras, são dezenas de milhares de
    hectares disponíveis", afirma.

    Além da rodada de captação, outro movimento que está em estudo pela empresa para captar recursos é
    uma operação no mercado financeiro. A Produzindo Certo já participou da montagem do primeiro CRA Verde
    realizado de forma coletiva por produtores rurais, com captação de R$ 63 milhões.'
