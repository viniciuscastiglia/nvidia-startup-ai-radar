  titulo: Zenvia Customer Cloud faz integrações e se torna data first
  url_fonte: https://www.mobiletime.com.br/noticias/30/09/2025/zenvia-data-first-ia/
  data_publicacao: null
  conteudo_texto: 'Zenvia Customer Cloud ganha integração com CRM e ERP e se torna data first

    Isabel Butcher | 30/09/25 19:58

    integrou o CRM, ERP e a Customer Data Platform (CDP) à sua plataforma de nuvem e solução core, a Zenvia
    Customer Cloud. Com isso, a empresa fornecedora de soluções de atendimento e relacionamento com o
    cliente sai do modelo de message first e entra numa abordagem data first. A proposta é que as empresas
    encontrem valor gerado antes mesmo de enviar a primeira mensagem.

    Vale lembrar que a Zenvia Customer Cloud

    foi lançada há menos de um ano

    e possui mais de 5,7 mil clientes ativos conectados a ela. A solução teve receita entre R$ 180 e R$
    200 milhões em 2024, o que representou quase 21% da receita total da empresa no período, de R$ 959,7
    milhões.

    Em conversa com Mobile Time, Roberto Aran, diretor de portfólio da Zenvia, explicou que antes, os
    clientes geravam valor depois do envio das mensagens, mas agora, a geração de valor vem a partir do
    momento em que os dados são integrados à plataforma.

    “Em um cenário data first, de integração à base de um CRM ou ERP, passo a trazer os dados dos clientes
    dos meus clientes para dentro da CDP e capturo dados de pedidos em aberto e que já foram feitos e
    passo a trazer dados de produtos e notas fiscais”, exemplifica Aran.

    Ao ter acesso aos dados antes do disparo de mensagens, a plataforma em nuvem da Zenvia oferece:

    Melhor Segmentação: É possível realizar uma segmentação mais precisa da base e entender o comportamento
    de compra do cliente.

    Análise Comportamental: A plataforma consegue entender se o cliente possui pedidos abertos ou não.

    Análise RFV: A base sincronizada permite rodar a análise de Recência, Frequência e Valor (RFV) no
    “momento zero”. Essa análise agrupa os clientes, identificando se são fiéis ou se estão em risco de
    churn.

    “Antes de enviar uma mensagem, consigo fazer segmentação da base, entender o comportamento do cliente,
    se tem pedidos abertos ou não. Começo a fazer a geração de valor antes mesmo do disparo da mensagem
    para o engajamento. Já tenho os dados para trazer uma melhor performance, seja num cenário de conversão,
    de marketing, seja num cenário de nutrição, de pós-venda”, detalha o executivo.

    IA na plataforma da Zenvia

    A plataforma ganha também uma série de camadas de algoritmos matemático e inteligência artificial,
    seja ela generativa ou determinística.

    A análise da base (como a classificação por RFV) é feita por algoritmos autônomos que utilizam inteligência
    e métodos tradicionais de análise estatística. A IA é aplicada em diversos momentos da jornada de
    experiência do cliente, como:

    Criação de Campanha: Para geração de insights sobre o que disparar (IA generativa);

    Disparo de Campanha: Previsão do melhor horário para disparo em determinado canal (ex: WhatsApp, SMS,
    e-mail) para ter mais impacto (IA determinística);

    Atendimento (Bots): Configuração de bots com IA generativa para comunicação humanizada, primeiro nível
    de atendimento e qualificação de leads;

    Classificação de Clientes: Uso de algoritmos de RFV para classificar clusters baseados no histórico
    e comportamento (algoritmos específicos/treinados);

    Suporte Pós-Venda: Uso de copiloto que auxilia o atendente a responder e-mails, sugere a melhor resposta
    e realiza análise de sentimento (IA generativa).

    Para os mais de 5,7 mil clientes da plataforma a integração de dados não implica custos adicionais
    ou modificação nos planos de software. Os clientes já têm acesso a uma interface que auxilia na configuração
    da integração.'
- tipo: noticia
  titulo: Na Zenvia, Ebitda acelera 120% no segundo trimestre (e prejuízo fica controlado)
  url_fonte: https://neofeed.com.br/negocios/na-zenvia-ebtida-acelera-120-no-segundo-trimestre-e-prejuizo-fica-controlado/
  data_publicacao: null
  conteudo_texto: 'Na Zenvia, Ebitda acelera 120% no segundo trimestre (e prejuízo fica controlado)

    Empresa de tecnologia para experiência do consumidor listada na Nasdaq continua em busca de fazer
    caixa para trocar o prejuízo pelo lucro nos próximos meses

    , empresa brasileira de tecnologia especializada na experiência do consumidor, divulgou seu balanço
    financeiro do segundo trimestre. Listada na Nasdaq, a companhia registrou um crescimento de 126% no
    Ebitda no período, atingindo R$ 33,7 milhões.

    No semestre, o indicador totalizou R$ 56,8 milhões, alta de 150% na comparação anual, o que indica
    que a empresa está no caminho de atingir os R$ 120 milhões indicados em seu guidance de 2024.

    “Não existe mais dinheiro infinito para as empresas de tecnologia, então nós precisamos gerar caixa.
    Para isso, é necessário ter uma operação muito alinhada com a sobrevivência no longo prazo, que é
    o nosso foco no momento”, afirma

    , CFO da Zenvia, ao

    “Esse resultado é reflexo do nosso esforço na redução de despesas dentro da companhia”, complementa.

    Além de ter dinheiro em caixa, a companhia também está se esforçando para aumentar a receita, que
    cresceu 20% no trimestre na comparação ano a ano, chegando aos R$ 231,2 milhões. No semestre, o indicador
    atingiu R$ 443,8 milhões.

    Na visão do CFO, esse aumento é fruto do lançamento do novo formato de venda dos produtos, o Zenvia
    Customer Cloud, que une a experiência do cliente em apenas um local. Apesar de não ter sido divulgado,
    o software já está sendo contratado por consumidores que, em sua maioria, são novos na plataforma.

    Além disso, a empresa afirmou que implementou uma solução de chatbot à base de

    generativa, que conta com mais de 100 chats ativos, o que também ajuda nesses números.

    Apesar disso, o prejuízo líquido da companhia continua sendo uma questão. No segundo trimestre, o
    prejuízo foi de R$ 15,9 milhões, aumento de 5% em comparação ao mesmo período de 2023. Nos primeiros
    seis meses do ano, esse valor atingiu R$ 72,2 milhões, crescimento do 126%.

    “Nós temos despesas com juros, que são referentes ao endividamento, e isso acaba nos levando a ter
    prejuízo”, afirma Chor. “Porém, é importante lembrar que nós fizemos um reperfilamento da dívida em
    fevereiro e tivemos um aporte de R$ 50 milhões no mesmo período, o que nos deixa menos preocupados
    com a situação.”

    No primeiro semestre, os passivos da companhia cresceram para R$ 622 milhões. Para o CFO, a única
    forma de reverter essa situação é gerando caixa - que é o que a companhia tem feito. Em sua visão,
    o segundo semestre promete ser ainda mais forte, como costuma ser para a companhia.

    “Com as campanhas de Black Friday e Natal, que ocorrem no quarto trimestre, a gente espera ver esse
    números subirem ainda mais, para fechar o ano com os valores que prometemos para os investidores no
    início de 2024”, afirma o executivo.

    Listada na Nasdaq, a ação da Zenvia acumula alta de 33% no ano. O valor de mercado da companhia é
    de US$ 85,4 milhões.'
