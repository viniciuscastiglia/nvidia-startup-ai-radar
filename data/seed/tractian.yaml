  conteudo_texto: 'Quando fundaram a Tractian em 2019, Igor Marinelli, Gabriel Lameirinhas e Leonardo
    Vieira escutavam sempre a mesma coisa: ‘fazer hardware e software não vai dar certo’; ‘é melhor pegar
    o hardware da China.’

    Cinco anos depois, os fundadores estão provando que os céticos estavam errados.

    A Tractian acaba de levantar uma rodada de R$ 700 milhões que avaliou a empresa em R$ 4 bilhões (

    ) — uma das maiores captações de startups deste ano no Brasil.

    A Série C foi liderada pela Sapphire Ventures, uma gestora americana de VC cujo maior investidor é
    a SAP, e teve a participação da General Catalyst, Next47 e NGP Capital.

    A captação é a quarta da história da Tractian, que já havia levantado outros R$ 300 milhões até agora.

    O modelo de negócios da Tractian une a chamada ‘internet das coisas’ com modelos de IA.

    A startup desenvolveu sensores que são fornecidos em comodato para as indústrias e colocados nos maquinários.
    Esses sensores capturam dados como vibração, temperatura, pressão, vazão, corrente e tensão, que depois
    são analisados pelos modelos de IA da companhia, ajudando na manutenção preventiva dos equipamentos.

    Se um sensor da Tractian identificar, por exemplo, que uma das máquinas está com falta de lubrificação,
    o software da empresa vai pegar essa informação, cruzar com o

    do fabricante e chegar à causa daquele problema. Na sequência, vai sugerir a solução: a troca do componente
    ou o uso de um lubrificante específico, por exemplo.

    “Antes, se a indústria identificava um problema, ela tinha que ligar para a WEG, para a Siemens ou
    para outro fabricante da máquina para entender como resolver aquele problema,” Igor disse ao

    . “Com nosso sistema, ela já tem essa informação e consegue corrigir muito rápido.”

    A Tractian tem conquistado clientes na mesma velocidade que seus sensores capturam dados.

    A startup já atende mais de mil plantas industriais — incluindo gigantes como a Suzano, Dexco, M Dias
    Branco, Ingredion e Nissan Brasil. A startup espera faturar US$ 40 milhões este ano (R$ 230 milhões
    no câmbio de hoje), com uma margem bruta de 72%.

    Hoje 60% da receita vem do Brasil, e o restante dos Estados Unidos e do México. Igor está morando
    em Atlanta, de onde toca a operação americana, e Vieira, na Cidade do México.

    Apesar do forte crescimento até aqui, a oportunidade para a empresa ainda é gigantesca. Igor estima
    que existam 50 mil indústrias de médio e grande porte no Brasil — um número que sobe para 500 mil
    ao incluir os mercados americano e mexicano.

    A startup também tem conseguido crescer dentro da sua própria base de clientes, com a assinatura de
    mais licenças do software e/ou a implementação dos sensores num número maior de máquinas.

    A startup funciona num modelo de SaaS, cobrando uma assinatura que varia pelo número de licenças e
    sensores.

    net revenue retention

    — um indicador que mede o quanto a companhia consegue reter ou aumentar a receita da sua base de clientes
    — é de 150% na Tractian. Ou seja, todos os anos, a receita cresceria 50% mesmo que a startup não adicionasse
    nenhum novo cliente.

    Com a rodada, a Tractian quer investir mais em P&D, com a contratação de mais engenheiros e a construção
    de um novo laboratório de pesquisa, de 9 mil metros quadrados. Outro plano é olhar para M&As, principalmente
    no modelo de ‘acqui-hire’.

    Igor disse que a empresa já investe metade de sua margem bruta em P&D, algo incomum no Brasil.

    “A média no Brasil é investir de 10% a 15% da margem bruta em P&D, enquanto nos EUA, a média é de
    50%,” disse ele. “P&D é uma corrida pelo ouro, em que você tem que estar sempre se aprofundando. Temos
    que ter a cabeça da Tesla, da Palantir… O produto está bom? Então vamos dobrar o esforço e deixar
    100x melhor.”

    A semente da Tractian nasceu nos corredores da USP, onde Marinelli e Lameirinhas estudaram engenharia
    da computação.

    Os dois se conheceram no primeiro dia de aula, e poucos meses depois já estavam dividindo um apartamento
    com a ideia de criar algum negócio juntos.

    “No começo, tentamos fazer as coisas na engenharia reversa. Pensávamos em uma solução e íamos atrás
    de como chegar nela. Ela até funcionava, mas não tinha mercado porque não tínhamos identificado um
    problema,” lembra Igor. “Só deu certo quando decidimos achar o problema antes e depois ir atrás da
    solução.”

    A Tractian começou numa garagem no bairro do Ipiranga depois que Igor voltou de Berkeley, onde foi
    estudar por um breve período. (Ele acabou não se formando na faculdade).

    Segundo ele, a escolha pelo setor industrial veio da família. O pai de Igor trabalhou 25 anos na parte
    de manutenção de equipamentos da International Paper, enquanto o pai de Gabriel trabalhou por décadas
    numa cimenteira.

    Igor lembra que para criar a Tractian eles foram visitar 88 fábricas diferentes para entender as dores
    do setor.

    “Passamos um ano inteiro fazendo só essas visitas e conversando com gestores de processos, de manutenção,
    de

    ,” disse ele. “Em todas essas conversas, a dor que mais se repetiu foi na manutenção dos equipamentos
    industriais, que era muito desassistida.”

    A ambição global veio desde o começo. Igor disse que logo que criaram a Tractian eles decidiram registrar
    o domínio da empresa em todos os países possíveis, comprando mais de 40 domínios num único dia.

    “O desafio da indústria é igual em todo o lugar do mundo, só muda o idioma e a moeda,” disse ele.
    “Além disso, sempre tivemos essa cabeça de que não dá para ser uma empresa gigante se você ficar só
    no Brasil.”'
