  conteudo_texto: 'Tractian capta R$ 120M com BNDES para projeto de robótica

    Financiamento bancará P&D de assistentes robóticos que unem robótica, sensores e IA; projeto prevê
    421 contratações e 20 patentes até 2028

    Leandro Miguel Souza



    Sensor da Tractian | Foto: divulgação


    A Tractian captou R$ 120,1 milhões do BNDES para desenvolver robôs de inspeção e manutenção preditiva.

    Os recursos do programa BNDES Mais Inovação visam combinar robótica avançada, sensoriamento e IA.

    O projeto prevê a criação de um novo produto, depósito de 20 patentes e contratação de 421 funcionários
    até 2028.

    O financiamento acelera a pesquisa em robótica e IA para proteção de ativos industriais, com engenharia
    brasileira.

    Paradas não planejadas de máquinas custam bilhões, e a manutenção preditiva busca reduzir esses custos.

    Este é o primeiro financiamento público da Tractian, que antes se financiava com capital de risco.

    anunciou esta semana uma nova captação para tocar sua pesquisa e desenvolvimento. Contudo, em vez
    de equity, os recursos desta vez vieram de um financiamento do

    : R$ 120,1 milhões para desenvolver uma nova geração de assistentes robóticos voltados à inspeção
    e à manutenção preditiva de equipamentos nas fábricas.

    e o banco de fomento destacaram em comunicado, os recursos, provenientes do programa BNDES Mais Inovação,
    servirão para desenvolver uma solução que combina robótica avançada, sensoriamento de alta precisão
    e IA para antecipar falhas em instalações industriais. O plano de investimentos cobre desde a equipe
    própria de pesquisa até a compra de componentes e equipamentos.

    O projeto tem execução prevista até junho de 2028 e deve resultar em um novo produto de inspeção industrial
    e no depósito de 20 patentes de invenção. A companhia prevê contratar 421 novos funcionários já na
    fase de implantação, 150 deles em pesquisa e desenvolvimento, mantendo os postos após a conclusão
    dos investimentos.

    “O financiamento acelera uma linha de pesquisa que estamos construindo há anos: usar robótica, sensoriamento
    e IA para elevar o nível de proteção dos ativos mais críticos da indústria”, afirmou Gabriel Lima,
    COO e cofundador da

    . “As 150 vagas de P&D e as 20 patentes previstas do projeto são o resultado técnico de uma decisão
    estratégica: fazer essa tecnologia com engenharia brasileira, e no Brasil.”

    E o problema que a empresa mira não é pequeno. Paradas não planejadas de máquinas custam às 500 maiores
    companhias do mundo o equivalente a 11% da receita anual (algo como US$ 1,4 trilhão, segundo estimativas
    do setor), e é justamente essa conta que a manutenção preditiva promete reduzir, ao apontar a falha
    antes que ela derrube a linha de produção.

    Do lado do banco, o discurso é de reforço à inovação em solo nacional. “O financiamento aprovado pelo
    BNDES vai contribuir com a realização de atividades de pesquisa, desenvolvimento e inovação no Brasil.
    O projeto reúne diferentes tecnologias aplicadas à inspeção e à manutenção industrial e prevê a contratação
    de profissionais qualificados para sua execução”, disse o presidente do

    , Aloizio Mercadante.

    Este é o primeiro financiamento por fomento público da

    . Fundada em 2019 por Gabriel Lima e Igor Marinelli, a empresa vinha se financiando quase exclusivamente
    com capital de risco, mas não fecha uma rodada de equity desde o fim de 2024.

    Foi em dezembro daquele ano que a companhia levantou sua Série C, de R$ 700 milhões (cerca de US$
    120 milhões), liderada pela americana

    e com participação de

    . A rodada avaliou a

    em R$ 4 bilhões (quatro vezes o valuation da captação anterior) e a colocou entre as startups mais
    capitalizadas do país.

    Antes dela, em agosto de 2023, a empresa havia feito

    um aporte de crescimento de US$ 45 milhões, também com a

    . Ao todo, soma cerca de R$ 1,05 bilhão captados em quatro rodadas desde a fundação.

    Nesse intervalo sem novos aportes de participação, a companhia mudou de porte: hoje se apresenta como
    uma espécie de “copiloto industrial”, atende mais de mil plantas de multinacionais como

    e diz responder por cerca de 5% do PIB industrial global.'
