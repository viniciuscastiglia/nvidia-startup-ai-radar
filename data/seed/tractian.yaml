  conteudo_texto: 'Tractian levanta R$ 230 milhões avaliada em R$ 1 bilhão

    Série B chega após crescimento acelerado e contou com venda de participação do Citrino para a monashees
    por R$ 50 mi



    Fundadores da Tractian

    Os números do venture capital latino em agosto já têm a grande rodada para dar aquele alívio. A

    , fabricante de sensores e sistemas de manutenção industrial, fechou uma série B de respeito, que
    colocou R$ 230 milhões no caixa da companhia. No aporte, ela foi avaliada em R$ 1 bilhão, mais de
    3 vezes os R$ 320 milhões da série A feita em maio/22.

    A rodada foi liderada pelo fundo americano

    , que investe na

    , uma companhia de equipamentos de IoT industrial. “Eles chegaram atrasados para a nossa série A e
    continuamos conversando. Quando falamos que íamos abrir uma nova captação eles disseram que não era
    para seguir. Que iam fazer sozinhos porque fazia muito sentido pra eles”, conta Igor Marinelli, cofundador
    da

    O grosso do aporte veio da

    , mas investidores que já estavam no captable como

    (que liderou a série A),

    , que opera os CVCs da

    , e que tinha entrado na companhia em 2021 vendeu sua participação em uma operação secundária com
    a

    por R$ 50 milhões. “A ideia agora é trazer investidores institucionais que nos ajudem a preparar o
    terreno para um IPO em 10 anos”, conta Igor.

    De acordo com ele, a maior parte dos recursos da rodada será usada em pesquisa e desenvolvimento para
    lançamento de novas ofertas e produtos. Hoje a

    tem 300 funcionários, sendo 200 engenheiros.

    Bons negócios têm dinheiro disponível

    Quantas vezes você não ouviu essa frase nos últimos 18 meses? É difícil saber exatamente o que esse
    chavão enigmático quer dizer, mas a

    dá um exemplo interessante.

    A companhia bateu todas as metas de vendas propostas em sua série A e tem expectativas de crescer
    300% em 2023. A base de clientes mais que dobrou, saindo de 200 para 500 nomes, com mil plantas espalhadas
    pelo Brasil e também no México. Na lista estão nomes como

    No México, a operação já representa 25% da receita, e cresce em um ritmo mais acelerado do que o negócio
    no Brasil. Replicando o modelo adotado por aqui, ela comprou uma parte da publicação

    , que produz conteúdo para profissionais da área de manutenção. No Brasil ela

    tinha investido na

    Revista da Manutenção

    Clube do Técnico

    logo após sua rodada seed.

    Em um próximo passo de expansão, o plano é ampliar os negócios nos EUA, onde ela já está presente
    com uma equipe de 20 pessoas na cidade de Atlanta. Aqui vale uma informação curioso. Segundo Igor,
    a busca tem disso por profissionais que tenham servido as Forças Armadas. Isso porque, segundo ele,
    essas pessoas têm mais comprometimento com uma missão dada, o que ajuda a

    a vencer o desafio cultural de fazer negócios nos EUA. “Já temos clientes americanos e uma vez vencida
    a barreira cultural, a gente voa que nem no México”, avalia. Segundo Igor, o plano para 2023 é crescer
    mais 250%.

    A companhia tem hoje 10 setores como alvo. Um deles são grandes operações que parecem indústrias,
    como grandes varejos e aeroportos.

    De band-aid a Salesforce industrial

    A Tractian nasceu com a proposta de redução de custos de manutenção para a indústria com sensores,
    ou “band-aids inteligentes” que preveem problemas nas máquinas. A tecnologia foi desenvolvida pela
    própria companhia, que já conseguiu registro de patente nos EUA.

    Mas ao longo do último ano, principalmente, ganhou força uma outra abordagem: a geração de receita.
    “Se a empresa tem 90% de disponibilidade, significa que a manutenção não deixa os ativos disponíveis
    para produzir nos outros 10%. Se você eleva essa disponibilidade em 2% ou 3%, é dinheiro entrando
    na hora”, explica Igor. Ele conta que há casos de clientes que aumentaram a receita em US$ 26 milhões
    no ano por conta da maior disponibilidade das máquinas para produção.

    Essa percepção veio do investimento da companhia para criar um sistema operacional da manutenção,
    o TracOS, que acaba de receber uma certificação de integração com o todo poderoso sistema de gestão
    da

    . “Só monitorar não é suficiente, Tem que oferecer uma malha de ação. Onde está o técnico, as peças
    no almoxarifado”, diz Igor. Hoje, o sistema tem uma taxa de instalação de R$ 100 mil, o que garante
    uma receita interessante para a companhia e a coloca no caminho para ser uma espécie de “Salesforce
    industrial”.'
