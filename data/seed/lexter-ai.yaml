  conteudo_texto: 'Rodada de investimento

    Lexter.AI levanta R$ 16M para impulsionar IA na análise jurídica

    Startup de IA para analisar documentos jurídicos levantou rodada com Alexia Ventures, Grão VC, Canary
    e Endeavor Scale-Up

    Leandro Miguel Souza



    Sócios da Lexter.ai: Guilherme Delai, Pedro Jahara, Pedro Calderón, Lucas Kawazoi, Daniela Labella
    e Jean Peguim (Foto: Divulgação)

    A onda de aportes em startups de inteligência artificial continua. Desta vez, a lawtech

    levantou R$ 16 milhões (US$ 3 milhões) em uma rodada seed liderada pela

    , com a participação dos já investidores

    também entrou no negócio.

    A empresa desenvolveu uma plataforma de análise de documentos jurídicos utilizando modelos de inteligência
    artificial, combinando algoritmos próprios com plataforma avançadas como o GPT-4, da

    Segundo a empresa, por meio de sua tecnologia – especialmente o Assistense Lexter, lançado no ano
    passado – cerca de 180 escritórios otimizam trabalhos como ler, analisar e redigir contratos, petições
    e outros documentos. Na lista de clientes estão grandes nomes do setor jurídico, como

    Com a nova rodada, o plano da

    é expandir sua presença e aprimorar a plataforma indo além dos grandes escritórios que já atende e
    desenvolvendo uma solução para ganhar escala e conquistar pequenas firmas de advocacia. A startup
    também quer investir em educação, com uma vertical de cursos de treinamentos.

    “Outras ferramentas de inteligência artificial generativa trazem informações que parecem coerentes,
    mas são incorretas, o que é um risco gigante para os advogados. Nossa solução é a resposta para esse
    problema: com conhecimento jurídico atualizado das leis brasileiras, faz pesquisa de fundamentação
    jurídica sem inventar e pode ser usado como fonte”, afirmou Pedro Jahara (de pé, ao centro na foto),
    CEO e cofundador da

    ., em nota.

    É a terceira rodada da lawtech. Em 2022, ela levantou um pré-seed de US$ 500 mil com a

    (que voltaram na nova rodada). Ela também passou por uma das turmas de aceleração da

    , quando captou US$ 1 milhão em um pré-seed. A empresa também passou pelo programa de aceleração

    , do escritório

    , especializado em lawtechs.

    Aliás, falando em

    , é o segundo aporte do fundo em startup de IA em menos de uma semana.

    Ela liderou uma rodada de R$ 12 milhões na

    , que desenvolveu uma plataforma de criação de conteúdo integrando diferentes modelos de linguagem
    em uma interface única.

    Segundo Bianca Martinelli, sócia da

    , o crescimento de startups como a

    mostra como os escritórios de advocacia ainda tem uma grande demanda por inovação, já que a adoção
    de tecnologia é historicamente abaixo da média em relação a outros setores.

    “Acreditamos firmemente que AI e LLMs (Large Language Models) têm potencial para mudar a forma como
    os advogados trabalham. Não os substituindo, mas empoderando-os e permitindo a eles gastar tempo com
    o que realmente importa, com atividades estratégicas que gerem valor aos seus clientes”, finaliza
    Bianca, em comunicado.'
