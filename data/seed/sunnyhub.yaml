    1.

    O que são as assinaturas da SunnyHUB?

    As assinaturas da SunnyHUB são ofertas que seguem o modelo de energia como serviço (Energy as a Service
    – EaaS), no qual o cliente passa a se beneficiar da produção no local de energia limpa, sem comprar
    equipamentos. A SunnyHUB projeta, instala e opera o sistema, enquanto o cliente paga uma mensalidade
    previsível pelo uso da energia. Esse formato permite acesso à energia solar e armazenamento de energia
    para público residencial ou para pequenos negócios, com economia na conta de luz, redução de exposição
    a reajustes tarifários e sem preocupações com manutenção, limpeza ou substituição de equipamentos.

    2.

    As assinaturas da SunnyHUB exigem instalação?

    Sim. A SunnyHUB instala os equipamentos no próprio imóvel do cliente, garantindo geração local de
    energia solar e a possibilidade de armazenar essa energia com baterias. Toda a instalação é feita
    por equipes especializadas, seguindo normas técnicas e regulatórias. O cliente passa a produzir a
    própria energia, reduzindo a dependência da rede elétrica e ganhando mais controle e previsibilidade
    no consumo e custos.

    3.

    Qual a diferença entre assinatura de energia e compra de equipamentos?

    A diferença vai muito além de quem "é dono" do sistema. Na compra, o cliente adquire todos os ativos
