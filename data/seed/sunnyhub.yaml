perfil_alvo_nota: |-
  CASO non-AI, e o eixo 1 não tinha nenhum. Cleantech que instala painel solar e bateria por
  mensalidade fixa: o valor entregue é equipamento, instalação, manutenção e um desconto na
  conta de luz. Não há IA no caminho crítico da entrega — os três documentos não contêm um
  único termo do vocabulário técnico de contexto/02 §5, nem de autopilot, nem de copilot, nem
  de dado proprietário. É a fixture que exercita a regra 1 de contexto/03 §4 ponta a ponta:
  non-AI está FORA DO FUNIL e não deve receber recomendação nenhuma. Hoje essa regra só é
  testada em unidade sobre `derivar_quadrante`; nunca sobre uma empresa de verdade.
