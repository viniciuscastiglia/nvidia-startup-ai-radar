  conteudo_texto: 'Rodada de investimento

    Rodada de investimento

    Com a agtech Ecotrace, GS1 Ventures faz seu primeiro aporte

    Startups de rastreamento de produtos agro usará aporte para ampliar operação na Europa, Oriente Médio
    e mercado halal

    Leandro Miguel Souza



    Flavio Redi, fundador e CEO da Ecotrace, e João Carlos de Oliveira, presidente da GS1 Brasil | Foto:
    divulgação


    A Ecotrace, agtech brasileira de rastreabilidade, recebeu um aporte da GS1 Ventures, CVC da GS1 Brasil.

    O valor do investimento está na faixa de R$ 5 a R$ 10 milhões, destinado à expansão internacional
    e novos segmentos.

    A GS1 Ventures adquiriu entre 14% e 16% de participação na Ecotrace, garantindo uma cadeira no conselho.

    A tecnologia da Ecotrace integra blockchain, IA, visão computacional, IoT e geointeligência para rastrear
    commodities.

    A agtech projeta crescimento de 20% a 30% em 2026 e faturamento de R$ 60 milhões até 2028.

    A empresa também atua no mercado halal com a subsidiária Ecohalal, emitindo mais de 46 mil certificados
    em 2024.

    A escolha do agronegócio pela GS1 Ventures reflete o crescimento tecnológico do setor e a expertise
    em rastreabilidade.

    , agtech brasileira especializada em rastreabilidade de commodities do agronegócio, acabou de fechar
    uma nova rodada, e o cheque partiu da estreante

    , CVC criado no fim de 2024 pela

    Associação Brasileira de Automação (GS1 Brasil)

    O primeiro cheque assinado pela

    não teve o valor divulgado, mas, segundo destacam o presidente da

    , João Carlos de Oliveira, e o fundador e CEO da

    , Flávio Redi, ele está dentro da faixa de R$ 5 a R$ 10 milhões que a

    havia comunicado ao mercado em março, quando abriu a nova captação para bancar a abertura de escritórios
    na Europa e no Oriente Médio, a um valuation de aproximadamente R$ 60 milhões.

    “A participação da associação na

    ficou entre 14% e 16%, dentro do modelo padrão definido pelo fundo para as próximas apostas”, disse
    João Carlos, em conversa com o Startups. Além disso, com o deal, a

    ganha uma cadeira no conselho da agtech.

    A tecnologia da agtech integra blockchain, IA, visão computacional, IoT e geointeligência, cobrindo
    desde a verificação da origem, se a área fornecedora está regular ambientalmente e cumpre a legislação
    trabalhista, até o QR Code final na embalagem.

    Entre os clientes estão nomes de peso do agro, como

    . A projeção da companhia é crescer entre 20% e 30% em 2026 e chegar a R$ 60 milhões de faturamento
    até 2028.

    Use of proceeds

    Conforme explica Flávio Redi, os recursos levantados contemplam um plano em três frentes. A primeira
    é a já mencionada expansão internacional, com foco na Europa e no Oriente Médio, regiões que absorvem
    parte relevante das commodities brasileiras rastreadas pela plataforma. A segunda é o avanço em novos
    segmentos: além de bovinos, aves, couro e algodão, a

    anunciou sua primeira operação em grãos, com uma parceria para rastrear o feijão da

    “Embora tenhamos uma forte atuação nas cadeias de bovinos e aves, a plataforma da

    foi desenvolvida para ser escalável e atender diferentes cadeias produtivas do agronegócio. Essa flexibilidade
    faz com que a plataforma possa ser adaptada a diferentes segmentos do agro, acompanhando as necessidades
    específicas de cada cadeia produtiva”, pontua o CEO.

    A terceira frente de expansão está no mercado halal, atendido pela subsidiária

    , criada em 2024 com aporte próprio de R$ 6 milhões. Para dar uma ideia da escala, Flávio destacou
    que a empresa emitiu mais de 46 mil certificados halal ao longo do ano, cada um equivalente a um embarque
    de exportação. Só no rebanho bovino, foram 3,75 milhões de toneladas de carne e mais de 123 milhões
    de caixas rastreadas.

    Segundo o CEO, o mercado halal global, avaliado em US$ 2,9 trilhões pela consultoria

    , é a próxima grande fronteira. “Mais do que atender a uma exigência religiosa, a rastreabilidade
    halal tornou-se um diferencial competitivo. Os importadores querem saber a origem dos produtos e se
    existe uma cadeia íntegra e auditável”, frisa o executivo.

    Fundada em 2018 e com R$ 11,2 milhões captados em cinco rodadas anteriores, com investidores como

    e o fundo

    , entre outros, a

    chega a este momento em posição diferenciada, segundo destaca Flávio. “A companhia está com breakeven
    operacional, resultado de uma estratégia focada no crescimento sustentável, no aumento da recorrência
    de receitas e na disciplina na gestão dos custos. Hoje, o foco deixa de ser financiar a sobrevivência
    da operação e passa a acelerar oportunidades estratégicas.”

    Por que o agro?

    Do lado da

    , uma associação historicamente conhecida por sua proximidade com setores como indústria e varejo,
    a escolha de uma agtech para ser a primeira investida é inesperada. Mas, segundo o presidente da entidade,
    foi um negócio circunstancial que, no fim, é representativo de como a associação está ativa em outras
    verticais.

    “O agro é um dos segmentos-base da nossa tese, e a gente fica muito contente com esse aporte, pois
    o agro é um dos setores que mais está crescendo, inclusive diminuindo a diferença no uso de tecnologia
    em relação a setores como indústria e varejo”, explica o executivo.

    Ao mesmo tempo, o executivo destaca que a

    trouxe algo específico que reforçou a tese: a possibilidade de a

    agregar conhecimento próprio de rastreabilidade e padronização ao negócio. “Independentemente do valor
    financeiro, o fator que nos levou a fecharmos com a

    é que nós podemos, por meio do nosso conhecimento em rastreabilidade, sustentabilidade e padrões,
    agregar valor ao negócio deles”, disse.

    Criado no fim de 2024

    , o fundo é gerido em parceria com a aceleradora gaúcha

    . Na época, o ticket médio previsto pelo fundo ficou entre R$ 5 e R$ 10 milhões, com participação
    entre 10% e 20% no capital.

    Para fechar a conversa com o Startups, João Carlos adiantou que o pipeline do fundo promete movimento
    nos próximos meses. Duas novas investidas — uma da indústria e uma do varejo — estão em fase final
    de aprovação pelo comitê e devem ser oficializadas até o fim de 2026. “Antes do final do ano, a gente
    vai conversar de novo sobre uma segunda ou talvez até uma terceira rodada”, finaliza.'
