  conteudo_texto: 'Depois da pecuária, startup EcoTrace tem nova captação para expandir na agricultura

    Investida da KPTL, empresa atua com rastreabilidade via blockchain e vai buscar R$ 5 milhões para
    atender outras cadeias produtivas em 2024

    Flavio Redi, CEO da EcoTrace

    Conhecida por ter desenvolvido um sistema de rastreabilidade na pecuária, a Ecotrace, agora tem foco
    na expansão para outras cadeias agrícolas.

    Segundo a startup, 40% de toda a carne bovina brasileira que é exportada, atualmente, passa pela sua
    plataforma.

    O sistema de rastreabilidade da EcoTrace, é baseado na tecnologia blockchain. Além de bovinos, com
    trabalho específico para o mercado halal, a empresa já atua nos segmentos de aves e algodão.

    Em entrevista ao AgFeed, o CEO e fundador da empresa, Flávio Redi, disse que a ideia é buscar uma
    nova rodada de financiamento em janeiro de 2024, “para ir além".

    Até agora, a empresa já captou, entre investidores-anjo e a KPTL, R$ 8,25 milhões em aportes. A KPTL,
    de Renato Ramalho, investiu R$ 6 milhões e colocou a startup no seu fundo Criatec 3, gerido pela empresa
    e criado pelo BNDES.

    A partir de janeiro do ano que vem, a EcoTrace deve começar a nova rodada de captação, em busca de
    R$ 5 milhões para expandir as áreas de atuação.

    Segundo a EcoTrace, do início de 2019 até julho de 2023, foram rastreadas 12,4 milhões  de cabeças
    de gado, 88 milhões de aves e 45 milhões de fardos de algodão.

    Com o aporte, que deve servir para expandir a própria equipe, que atualmente conta com 40 funcionários,
    a empresa deve buscar ganhar mercados como café, cacau, óleo de palma e laranja. Segundo Redi, os
    suínos estão no final da lista.

    “Nosso desafio para crescer aqui é a mão de obra, se tivéssemos mais pessoal já estaríamos nessas
    culturas. O crescimento da empresa é financiado por rodadas de investimento”, comenta o CEO.

    A empresa tem crescido cerca de 70% ao ano, e o faturamento de 2023 deve chegar próximo aos R$ 10
    milhões, segundo o executivo.

    Dentre os atuais clientes da empresa estão gigantes como a JBS, Seara, Minerva, Frigol, Sampco, Swift,
    FrigoSul e Rio Maria. No algodão, o principal cliente é a Lojas Renner.

    Flavio Redi fundou o negócio em 2018, sendo essa, sua segunda empreitada no mundo do empreendedorismo.
    Antes, tinha fundado a startup Gestão Agropecuária em 2007, onde ficou até 2021, quando deixou o negócio.

    Ele explicou que a primeira startup estava focada mais da porteira para dentro, atendendo produtores
    com um software para gerenciamento de gado de corte. “Saí da empresa com a ideia de montar um projeto
    que pudesse se expandir globalmente, e a pauta que vi como latente é a da rastreabilidade”, diz.

    A FriGol foi a primeira empresa a apostar na segunda empreitada de Redi e, junto com a startup, está
    lançando um QR Code nos produtos finais que mostram até o bioma de origem do gado.

    Agora, quem comprar uma carne do frigorífico no supermercado terá acesso a um link com toda a história
    do produto. “Conseguimos segregar o produto em biomas como Cerrado, Mata Atlântica e Amazônia. A Frigol
    é um dos parceiros nossos que está sempre na vanguarda e de olho nas novidades que pensamos”, diz
    o CEO.

    A empresa também oferece uma solução complementar à rastreabilidade em si, que envolve uma classificação
    de carcaças bovinas e de frango por meio de algoritmos treinados via inteligência artificial, automatizando
    uma tarefa que era feita pelo olho humano, para câmeras.

    A ideia da EcoTrace, segundo o CEO, é ser uma espécie de “guardião dos dados da cadeia”, centralizando
    as informações desde a fazenda, por onde o animal passa, até a carne chegar na gôndola. “Criamos tomadas
    e plugamos todos esses elos da cadeia”, explica.

    A empresa também trabalha com a iniciativa de rastrear o histórico desde o nascimento dos animais,
    algo que é cada vez mais uma exigência dos países compradores e nem tão presente nas fazendas.

    Ao mesmo que busca a expansão das culturas, a empresa tem atuado para aumentar a presença geográfica,
    e já conta com clientes nos Estados Unidos. “A ideia de se tornar global passa, primeiro, por trabalhar
    com o que sai daqui do Brasil e vai para fora, garantindo para o importador que tudo está de acordo
    com os acordos comerciais”, explica.

    Além da América do Norte, a empresa está negociando com players da Bélgica e do Reino Unido. Recentemente,
    a companhia também anunciou que investirá R$ 4 milhões no desenvolvimento de uma plataforma exclusiva
    para o segmento halal, protocolo de abate de aves e bovinos voltado para o mercado islâmico.

    A ideia da empresa é atender cerca de 50% das exportações halal de frango e 80% da exportação de carne
    bovina do Brasil já em 2024. “O Halal faz a certificação religiosa e nós entramos para complementar
    com essa ‘garantia de origem”, explicou.

    Outro setor que a EcoTrace está de olho é nas empresas de couro, e já atua junto com a Rio Maria e
    a Durlicouros.

    A União Europeia aprovou uma lei que garante que, até 2025, todo couro comprado pelo bloco terá de
    apresentar alguma comprovação de origem. “Já temos um primeiro projeto rodando em cima do couro, e
    devemos entregar até fevereiro um módulo de couro com rastreabilidade. A indústria da moda e a automobilística
    estão pressionando os fornecedores de couro”, completa o CEO.

