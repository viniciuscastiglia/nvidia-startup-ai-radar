perfil_alvo_nota: |-
  CASO AI-NATIVE COM STACK MADURA — o quadrante `ja-otimizada`, que até hoje existia só no papel:
  nenhuma das três startups da base o produzia, e portanto metade da matriz de dois eixos de
  contexto/02 §4 nunca tinha sido exercitada por uma empresa real.

  O post de engenharia é o documento mais denso da base inteira: quantização QAT para 4 e 8 bits
  no serving, precisão mista por componente do bloco transformer, MoE com desbalanceamento de
  experts, separação de prefill e decode em grupos de GPU distintos, MFU de 40% em B200, e conta
  de GPU-hora com custo em neocloud. Some-se a disciplina declarada de avaliação — "não fazemos
  mudanças no modelo se não conseguimos medir a capacidade" — e o que se tem é o oposto do
  wrapper: uma empresa que desce à camada 4 do bolo de cinco camadas da NVIDIA.

  É a fixture que dá o contraste do vídeo: DOIS AI-native, prioridades opostas. A Doutor-AI é
  sweet-spot e a Maritaca é `ja-otimizada` — provavelmente já é membro do Inception ou já usa
  NVIDIA, e a prioridade da recomendação cai por isso, não apesar disso.
