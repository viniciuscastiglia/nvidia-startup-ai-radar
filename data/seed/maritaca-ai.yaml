  conteudo_texto: 'Quantização para servir

    Concluído o treinamento, o modelo ainda precisa ser preparado para produção. Para servir os usuários
    com latência e custo aceitáveis, ele precisa caber no hardware de inferência e rodar de forma econômica.
    Por isso, depois de treinado,

    os pesos: a partir da precisão usada no treino, que pode ser BF16 ou FP8 com

    (QAT), reduzimos para 8 ou até 4 bits no serving.

    A regra é simples: quanto mais agressiva a redução de precisão, mais trabalho de treino é necessário
    para preservar qualidade. Reduzir para 8 bits ainda costuma ser viável com calibração baseada em estatísticas
    das ativações, e a degradação tende a ser pequena. Já reduzir para 4 bits é outro patamar: cada peso
    passa a ter apenas 16 valores possíveis, e isso normalmente não é suficiente para representar bem
    a distribuição de pesos da rede sem comprometer capacidades importantes do modelo. Por isso, em 4
    bits, as técnicas modernas combinam calibração com

    , em que o próprio treino simula o efeito da quantização para que o modelo aprenda pesos que toleram
    a perda de precisão. Quantizar deixa, então, de ser um passo pós-treino barato e passa a ser mais
    um estágio de treino. Concretamente, no regime de 4 bits:

    Os dados usados importam.

    Diferentes pipelines combinam QAT durante o treino, calibração pós-treino com um conjunto menor, ou
    ambos. Há ainda formatos como o NVFP4 da NVIDIA, em que o pré-treino acontece direto em 4 bits e dispensa
    uma fase de calibração separada. Em todos esses caminhos, os dados (treino ou calibração) precisam
    refletir as distribuições reais de uso do modelo, incluindo idiomas, domínios, formatos de prompt
    e comprimentos típicos, já que amostragem aleatória de texto não basta.

    Misturam-se precisões em diferentes partes da rede.

    Camadas mais sensíveis à perda numérica (atenção, embeddings, normalizações) tendem a ficar em precisão
    maior (8 bits ou na precisão original). Partes mais redundantes, em particular os experts em modelos
    MoE (onde o roteamento já dilui o impacto de qualquer expert individual), toleram precisão menor.
    As combinações específicas variam por equipe e workflow, mas o princípio comum é alocar precisão proporcional
    à sensibilidade de cada componente.

    A validação usa a bateria completa de benchmarks.

    Quantização pode parecer inócua em métricas agregadas e ainda assim degradar capacidades específicas
    como chamada de função, raciocínio matemático e contexto longo. A única forma de pegar isso é rodar
    a avaliação inteira, o que nos leva de volta ao Passo 2 do ciclo.

    Figura 10: precisão mista por componente do bloco transformer. Embeddings, normalizações e o router
    do MoE ficam em precisão maior (BF16), porque são as partes mais sensíveis a erro numérico. Atenção
    e cabeça de saída descem para 8 bits com calibração. Os experts do MoE, que concentram a maior parte
    dos parâmetros do modelo, descem para 4 bits — a redundância intrínseca do roteamento dilui o impacto
    da redução, e quantizar só eles já corta a maior parte da memória de inferência.

    Arquitetura: denso vs Mixture of Experts

    Outra escolha relevante na hora de treinar é a

    arquitetura do modelo

    . Nas últimas gerações, a opção dominante na fronteira tem sido

    Mixture of Experts (MoE)

    , caminho que também seguimos na Maritaca.

    (todo parâmetro é ativado a cada token) ainda dominam em algumas frentes, especialmente em

    tarefas de raciocínio puro

    , onde a capacidade total do modelo importa mais do que sua eficiência por token. Densos também atingem
    MFU (Model Flops Utilization) de 50–60% em treino, um indicador de eficiência computacional.

    Modelos MoE esparsos

    , por outro lado'
