    1. O que é a Maritaca AI?

    A empresa Maritaca AI, que desenvolve inteligências artificiais, foi fundada em 2022 pelo pesquisador
    Rodrigo Nogueira. A criação do software envolveu uma união do especialista com diversos pesquisadores
    da Universidade Estadual de Campinas (Unicamp) para criar o MariTalk, um

    de IA 100% brasileiro. Uma das tarefas desenvolvidas para atingir esse objetivo foi o treinamento
    da ferramenta em português, já que seu foco é atender demandas de usuários brasileiros, afinal, seu
    banco de dados está diretamente ligado ao contexto cultural do país.

    Os pesquisadores descobriram que, quando o conhecimento dado a uma IA é mais direcionado e ela é treinada
    em seu idioma nativo, as respostas melhoram. Por isso, ofereceram dados que pudessem ampliar a capacidade
    da inteligência artificial responder de maneira satisfatória sobre temas ligadosao Brasil, incluindo
    as leis brasileiras, sistema de saúde e o sistema de educação. Vale ressaltar que a empresa recebeu
    o valor de US$ 1 milhão do

    para investir no treinamento da Maritalk.

    Saiba mais sobre a Maritaca AI — Foto: Reprodução/Thaisi Carvalho

    2. Qual o diferencial da Maritaca AI em relação ao ChatGPT?

    A Maritaca AI utiliza um modelo de linguagem desenvolvido pela própria empresa, chamado Sabiá. O diferencial
    dele é a abordagem focada nas nuances da cultura brasileira. Ou seja, ele consegue "alfabetizar" o
    chatbot de inteligência artificial levando em conta contextos comuns no Brasil, gírias da língua portuguesa
    e a diversidade existente nas diferentes regiões brasileiras.

    Como o ChatGPT foi treinado em inglês, ele responde e compreende melhor as interações em inglês. Porém,
    embora o chatbot de

    também seja capaz de responder em português, ele não foi treinado neste idioma e pode apresentar limitações
    para compreender determinadas consultas ligadas ao contexto da cultura brasileira. Neste sentido,
    a Maritaca AI se destaca como uma inteligência artificial capaz de entender detalhes como as leis
    brasileiras, a história e a geografia do país, e até mesmo provas como Enem, OAB,

    e Enade.

