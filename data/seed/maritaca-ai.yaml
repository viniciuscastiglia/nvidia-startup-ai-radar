    Pensou e consultou bases de dados oficiais

    Rápido e econômico

    Sabiá 4 Thinking

    Raciocínio para tarefas complexas

    Para profissionais de todo o Brasil

    Feito para advogados, economistas, jornalistas, professores, gestores públicos e quem empreende, do
    agro ao mercado imobiliário.

    Respostas com dados oficiais do Brasil

    Consulta dezenas de bases brasileiras (população, empresas, saúde, economia, segurança e mais) e responde
    na hora com números e fontes reais.

    Pode rodar inteiramente em território nacional, para casos que exigem soberania e residência de dados.

    Até 100 arquivos de uma vez

    Analise até 100 arquivos de uma só vez, de contratos e planilhas a laudos. A maioria das ferramentas
    para em 10 a 20.

    Como eu faço para usar os modelos Sabiá?

    ou baixe o app para Android ou iOS. Para uso via API, consulte a documentação em

    O que os modelos são capazes de fazer?

    Os modelos da família Sabiá são especializados em português e em contextos brasileiros.

    Entre as principais capacidades estão: análise e resumo de documentos extensos (PDFs, contratos, legislação),
    compreensão profunda de temas jurídicos, educacionais e institucionais brasileiros, chamada de funções
    (function calling) para integração com sistemas, busca na web, e geração de texto em português com
    alta fluência.

    Para detalhes de desempenho em benchmarks, consulte a página de modelos na documentação.

    Consigo fazer finetuning nos meus dados a partir dos modelos da Maritaca?

    Não oferecemos fine-tuning no momento. Para casos de uso que exigem customização, recomendamos o uso
    de RAG (Retrieval-Augmented Generation) com nossos modelos, que costuma atender a maioria dos cenários.
    Consulte nosso guia de RAG na documentação.

    Como os modelos são treinados e qual a arquitetura?

    Os modelos são baseados na arquitetura Transformer. O número exato de parâmetros não é divulgado publicamente.
    Os modelos da família Sabiá 4 foram treinados a partir de um modelo base generalista, com aprendizado
    contínuo em quatro etapas: (1) pré-treino contínuo em um grande corpus em português e em um corpus
    jurídico brasileiro, (2) extensão de contexto longo para 128 mil tokens, (3) ajuste fino supervisionado
    em dados de chat, código, tarefas jurídicas, seguimento de instruções e chamada de funções, e (4)
    alinhamento de preferências. Os dados de pré-treino passam por um pipeline de filtragem de qualidade,
    pontuação de relevância e reescrita de documentos. Além de dados públicos, os modelos também foram
    treinados com dados comerciais proprietários.

    Meus dados são usados para treinamento? Qual é a política de retenção de dados?

    API:

    o conteúdo dos prompts e das respostas é descartado imediatamente após gerada a saída e nunca é usado
    para treinamento. Mantemos registros técnicos (IP, data e hora, contagem de tokens) pelo prazo exigido
    e autorizado em lei: o Marco Civil da Internet obriga a guarda dos registros de acesso por no mínimo
    seis meses, e a LGPD permite mantê-los pelo tempo necessário para cobrança, prevenção a fraudes, segurança
    e defesa em eventuais processos; mantemos esses registros por até dezoito meses. Logs de erro podem
    conter fragmentos da requisição e são descartados em até trinta dias. Veja detalhes na página de

    Tratamento de Dados

    Chatbot Web e Mobile Apps:

    Os dados das conversas são armazenados para permitir que os usuários possam acessá-los posteriormente.
    Entretanto, esses dados não são utilizados para fins de trein'
