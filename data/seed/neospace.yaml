  conteudo_texto: 'Citada pela Nvidia, brasileira Neospace quer transformar dados de empresas em cérebro
    corporativo

    A startup nasceu de ex-sócios da Zup, levantou infraestrutura rara de IA na América Latina e aposta
    num caminho menos lotado que o dos chatbots: criar modelos fundacionais para dados de grandes empresas

    Bruno Pierobon, Felipe Almeida e Gustavo Debs, fundadores da NeoSpace  (Reprodução)

    Editor de Inteligência Artificial e Tecnologia

    23 de março de 2026 às

    Priorizar nos meus resultados Google

    *SAN JOSE - Entre as centenas de logos que passaram pelo palco e pelos telões do GTC 2026, o principal
    evento anual da Nvidia, uma chamou atenção por vir de um mercado que costuma aparecer mais como consumidor
    do que como protagonista de tecnologia de base. A brasileira Neospace foi uma das empresas mencionadas
    pela gigante americana numa conferência dominada por hyperscalers, fabricantes de chips e startups
    de inteligência artificial do eixo Estados Unidos-Europa. Para uma companhia ainda jovem, a exposição
    funciona como selo técnico e também como resumo de ambição: a empresa quer sair do Brasil não como
    usuária da onda de IA, mas como construtora de uma peça central dela.

    A tese é menos vistosa do que a dos chatbots, mas potencialmente mais valiosa. Enquanto boa parte
    do mercado correu para adaptar grandes modelos de linguagem a tarefas corporativas, a Neospace decidiu
    atacar um problema diferente: a dificuldade das empresas de extrair valor dos próprios dados. Não
    se trata, na visão dos fundadores, de usar IA para responder perguntas com mais fluidez. Trata-se
    de criar o que eles chamam de "cérebro corporativo" — uma camada de inteligência capaz de cruzar dados
    estruturados e não estruturados, encontrar padrões e devolver decisões de negócio com mais precisão.

    A empresa nasceu em 2023, quando Felipe Almeida, Bruno Pierobon e Gustavo Debs começaram a desenhar
    o que fariam depois do ciclo da Zup, a empresa de transformação digital criada em Minas Gerais, no
    ano de 2011, e vendida ao Itaú, em 2020, por R$ 500 milhões. A Zup cresceu ajudando grandes companhias
    — bancos, teles, seguradoras — a refazer jornadas digitais, produtos e cultura tecnológica. Chegou
    a cerca de 3.500 funcionários antes da venda. O acordo com o Itaú previa um período de permanência
    dos fundadores, que durou até 2024. A saída abriu espaço para uma nova aposta, agora bem mais técnica
    e mais arriscada.

    "A gente queria criar tecnologia do zero. Não queria ser só um ''wrapper'', uma camada em cima do
    que já existia", disse Felipe Almeida em entrevista à EXAME. "E queria fazer uma empresa que já nascesse
    com potencial global".

    Essa decisão coloca a Neospace num grupo pequeno de startups que tentam construir infraestrutura própria
    de inteligência artificial em vez de apenas empacotar APIs de terceiros. O atalho mais comum do mercado
    tem sido pegar modelos já prontos — da OpenAI, Anthropic, Meta ou outros — e adaptá-los a tarefas
    específicas.

    O foco não está em linguagem, mas em dados. Em vez de replicar um GPT, a empresa diz estar desenvolvendo
    o que batizou de Data Foundational Model, uma IA que se origina para processar o tipo de informação
    que forma a espinha dorsal das grandes empresas: transações, tabelas, eventos, históricos de navegação,
    cadastros, documentos e relações entre essas bases.

    Para Almeida, o problema de muitas iniciativas de IA nas empresas é que elas tratam grandes modelos
    de linguagem como um canivete suíço. Funcionam bem para atendimento, busca, interface e comunicação
    final com o usuário. Mas não são a melhor ferramenta para pensar o negócio. "As LLMs são muito boas
    para a última milha, para conversar com o cliente. Mas não vão ser o cérebro da companhia", diz.

    A aposta da Neospace é que esse cérebro pode nascer de um modelo treinado para ler o dado cru da empresa,
    e não apenas médias, recortes ou amostras tratadas previamente, como costuma acontecer em sistemas
    tradicionais de machine learning. Numa operação bancária, por exemplo, isso significa olhar a vida
    inteira de um cliente em sequência: compra, horário, local, valor, parcela, navegação no app, empréstimo,
    seguro, pagamento, atraso. Ao cruzar esse fluxo com o de milhões de outros clientes, o model'
