  nota: |-
    `dores_esperadas: []` É O PONTO DESTA FIXTURE, não uma omissão. O que o Extractor procura é
    a dor DA STARTUP, que vira consulta à base NVIDIA. O material do RD Station descreve as
    dores do CLIENTE dele ("escale os resultados", "pare de perder oportunidades") e nenhuma
    dor própria de infraestrutura de IA. Um extrator que emitir qualquer dor aqui estará lendo
    o marketing do produto como se fosse a operação da empresa — que é o erro exato que a
    dívida nº 6 diagnosticou.

    `elegivel: null` — a RD Station foi adquirida pela Totvs, que é de capital aberto, o que
    provavelmente a torna inelegível. NENHUM dos três documentos coletados diz isso. Marcar
    `false` seria premiar o sistema por saber algo que a base não contém; marcar `true` seria
    afirmar elegibilidade que não se sustenta. "Não medido" é a única leitura honesta, e este
    campo existe justamente para casos assim.

    ARMADILHA CONHECIDA: o casador de substring acha `'resultado'` (sinal de AUTOPILOT) em
    "acelerar resultados em marketing" e `'ferramenta'` (COPILOT) uma vez só. Como o desempate
    de `extractor.node` é `len(ev_auto) >= len(ev_copi)`, o empate 1×1 resolve para AUTOPILOT —
    e a empresa mais copilot da base é classificada como quem vende o trabalho. Está anotado
    aqui de propósito: se a régua não acusar isso, ela não está medindo nada.
