perfil_alvo_nota: |-
  CASO AI-ENABLED CANÔNICO — o "agora com IA" sobre produto pré-existente que contexto/02 §4
  lista como sinal típico. Cada produto da home vem carimbado com o selo "Com Inteligência
  Artificial", o recurso principal se chama "Copiloto de IA", e a promessa é "aumentar a
  produtividade do seu time". É copilot em estado puro: vende a ferramenta, o profissional
  decide, e o preço é por plano/assento — os três marcadores da coluna esquerda da tabela da
  Sequoia. Sem ela, o eixo 1 do classificador nunca vê um caso que deva recusar.
