    , agtech que combina inteligência artificial (IA) e visão computacional para transformar dados de
    tratores, drones e satélites em relatórios agronômicos, acabou de fechar uma rodada pré-série A de
    R$ 10,2 milhões. O aporte foi liderado por uma gigante internacional do setor – a

    , controladora de marcas como a New Holland e Case.

    Com o aporte, que foi estruturado pela

    e também teve a participação da

    Rural Ventures, MMAgro e Agroven

    , o plano da agtech é escalar a sua solução, ganhando não apenas tração no mercado nacional, mas também
    aproveitando a chegada dos novos investidores para buscar oportunidades fora do país.

    “Com o montante captado, seguiremos avançando no desenvolvimento da nossa plataforma, na expansão
    do time comercial, bem como intensificaremos nosso processo de internacionalização”, ressalta Johann
    Coelho, fundador e CEO da

    , em comunicado.

    Fundada em 2018, a

    utiliza aplicações de IA e visão computacional para apoiar na gestão das safras, oferecendo inspeções
    direcionadas e monitoramento em larga escala. De acordo com o CEO, a IA pode ser aplicada em diversas
    frentes do agronegócio, desde a previsão de condições climáticas e análise de solo até o monitoramento
    do desenvolvimento das culturas e gestão de cadeias de suprimentos.

    “Um dos benefícios mais importantes dessa tecnologia para o agronegócio é a capacidade da IA em fornecer
    insights que podem ser aplicados para tomadas de decisões mais assertivas”, completa o CEO da

    . Segundo a agtech, clientes conseguiram reduzir em cerca de 80% o uso de defensivos e em 25% o número
    de manobras com maquinário em campo.

    Antes do aporte, a agtech já tinha uma parceria com a

    , entregando a camada de análise para processar os dados coletados pelas máquinas da companhia e gerando
    projeções de cenário.

    “Estamos entusiasmados em fazer parte do crescimento da

    e contribuir para a transformação digital no campo. Acreditamos no potencial dessa parceria para impulsionar
    a inovação no setor agrícola”, Gregory Riordan, Diretor de Tecnologias Digitais e Inovação da

    para a América Latina e Diretor da

    no Brasil.

    Com o investimento na startup brasileira, a multinacional traz para o seu lado uma empresa de um ramo
    que outras concorrentes de maquinário agrícola também estão de olho. Nos últimos anos, nomes como

    também fizeram seus investidores em startups de tecnologia para entregar soluções mais inteligentes.

    já atende mais de 400 clientes ativos em 11 países, processando mais de 5 milhões de hectares. A empresa
    visa ampliar sua área de atuação, mirando 10 milhões de hectares sob gestão. Antes desta rodada, a
    companhia já tinha levantado R$ 8 milhões em aportes – em duas rodadas distintas em 2018 e no ano
    passado.'
