    Encorpada após duas captações em 2024, BemAgro cresce 141% no primeiro trimestre

    Startup de agricultura digital recebeu cerca de R$ 15 milhões em investimentos no ano passado, trazendo
    empresas como CNHi, Atvos e Suzano para o quadro societário. Para este ano, quer aumentar a área monitorada
    em 3 milhões de hectares e ganhar mais mercado fora do Brasil

    Johann Coelho, CEO da BemAgro

    O ano de 2024 foi transformacional na BemAgro. Em um intervalo de seis meses, a startup de agricultura
    digital fundada por Johann Coelho captou R$ 15 milhões e encorpou seu quadro societário com grandes
    nomes do agro.

    Em fevereiro, numa

    rodada liderada pela CNHi

    e com participação da

    e a revenda goiana MM Agro, recebeu R$ 10,2 milhões. Em agosto, fechou uma

    extensão dessa mesma rodada

    e recebeu mais R$ 5 milhões em aportes de

    .

    Com o caixa recheado, a empresa cresceu 50% seu faturamento no ano passado em relação a 2023, revelou
    Coelho, que atua como CEO.

    “Desde o início da operação buscamos investidores para a BemAgro que pudessem agregar valor às operações,
    tanto financeiramente quanto na estratégia”, disse ao

    .

    E 2025 começou ainda mais aquecido. Considerando o primeiro trimestre deste ano, em comparação com
    o mesmo intervalo em 2024, a receita saltou 141%. A empresa prefere não abrir os números no detalhe.

    Coelho comentou algumas das mudanças no negócio desde a entrada dos novos sócios. Com base em Ribeirão
    Preto (SP), a agtech já era forte na cana, cultura forte no oeste paulista. A entrada da Suzano ajudou
    a empresa a diversificar em culturas e começar sua atuação no mercado de eucalipto.

    O CEO disse que o investimento da companhia de papel e celulose prevê o lançamento de cinco novos
    produtos para os próximos dois anos.

    A startup utiliza tecnologias de análise de imagens captadas por drones e satélites para produzir
    mapas e relatórios com informações para monitoramento e gestão das lavouras.

    Ao longo dos anos, a agtech incorporou modelos de inteligência artificial e visão computacional aos
    seus produtos e criou soluções de integração ao maquinário agrícola, permitindo a coleta de dados
    também em campo.

    Com isso, ampliou o leque de serviços, fornecendo atualmente mais de 20 diferentes relatórios agronômicos
    e mapas com informações como altimetria, população de plantas e matologia -, que auxiliam o planejamento
    o produtor em projetos de plantio e pulverização, com aplicações localizadas, até a colheita.

    “Estamos em vias de soltar, nos próximos 2 meses, dois novos produtos para o setor florestal. Ambas
    envolvem IA e visão computacional para gerar informações relevantes na tomada de decisão na hora da
    colheita e outra no pós-plantio”, disse Johann Coelho.

    A companhia encerrou 2024 com 6 milhões de hectares monitorados, sendo 60% de cana e o restante se
    dividindo entre grãos, fibras e culturas perenes, como a silvicultura.

    Com o avanço nas florestas, Coelho prevê que 2025 marque um equilíbrio de 50% para a cana e 50% para
    as outras categorias.

    A meta é encerrar dezembro com 8,5 milhões a 9 milhões de hectares monitorados pelo software da empresa.

    “Já estamos hoje na cana, soja, milho, algodão e entrando em reflorestamento. Isso soma 90% das áreas
    agricultáveis brasileiras. Quando olhamos para o setor de reflorestamento, vemos potencial, pois possui
    uma área similar à de cana, com players muito profissionalizados que conseguem inserir a tecnologia
    no fluxo de trabalho diário”, comentou o CEO da BemAgro.

    Além de crescer em área, Coelho contou que, desde o ano passado, a BemAgro partiu para um modelo de
    negócio Saas (software as a service), no qual vende uma assinatura de 12 meses para os clientes que
    queiram utilizar o programa. O valor depende da quantidade de análises que ele necessitar.

    “Temos crescido em ticket médio em função do lançamento de novos produtos. Sair de 6 milhões de hectares
    para 9 milhões não significa que a receita acompanha na mesma medida. Na mesma área posso fazer três
    ou quatro operações diferentes”, disse.

    Com isso, a ideia é crescer dentro dos hectares que já atende. “A mudança para Saas com assinatura
    de software aumentou a retenção e fidelização dos clientes. Esse modelo ainda diminui o impacto da
    sazonalidade”, acrescentou.

    Para além de lançamentos para o setor florestal, Coelho citou que a empresa acrescentou recentemente
    uma funcionalidade de identificação às plantas daninhas por espécie e tipo. “Seja mamona, folha larga,
    folha estreita ou gramínea, o software permite ao produtor identificar as infestações e saber qual
    produto deve utilizar”, disse.

    Na cana, a empresa desenvolveu um programa que identifica linhas de colheita da cana. O programa permite
    uma integração com máquinas colhedoras, facilitando o processo de colheita.

    O passaporte e o doutor

    Johann Coelho ainda revelou que a empresa deu seus primeiros passos oficiais fora do Brasil. “Dentro
    do nosso novo momento de escala, intensificamos a cooperação com a CNHi e abrimos novos mercados.
    Atualmente já estamos presentes na Colômbia, Argentina e Paraguai”, disse.

    Em junho deste ano, a BemAgro dará seus primeiros passos nos Estados Unidos, realizando provas de
    conceito na Dakota do Sul.

    Segundo o CEO, a ideia é verificar como o mercado americano absorve a tecnologia brasileira, e se
    for o caso, realizar alguns ajustes na rota. Por aqui no Brasil, a empresa ainda aposta em reforçar
    seu networking com um conhecido do setor.

    A empresa anunciou que Marcos Fava Neves, comnhecido como Doutro Agro, professor da USP de Ribeirão
    Preto e um dos fundadores da Harven Agribusiness School.

    Fava Neves foi professor de Johann Coelho na faculdade, quando o executivo cursava economia empresarial
    e controladoria, e atribuiu parte da criação da BemAgro ao agora conselheiro.

    “Fui exposto ao que era o agro e o papel do Brasil nesse mercado. Agora ele vêm somar sua experiência
    no conselho”, disse. Coelho estima que o professor ajudará a startup em seu planejamento estratégico
    tanto aqui quanto lá fora.

    “Estamos entusiasmados com a participação do professor Fava. Sua trajetória e presença em conselhos
    de grandes empresas vão trazer uma leitura estratégica valiosa para a nossa evolução e processo de
    governança”, acrescentou Luiz Ambar, presidente do conselho e sócio da empresa.

    Marcos Fava Neves,'
