    A FIXTURE COM MAIS DORES REAIS DA BASE, e é ela que mostra que "muitas dores" não é o mesmo
    que "todas as dores": cinco das oito estão literalmente nos documentos e no sentido certo —
    custo (R$ 180-200 por jornada caem para R$ 90-120; "30% dos custos desperdiçados"), latência
    (transcrição "em tempo real" da consulta; "otimiza o tempo de resposta"), escalabilidade
    ("escalar com velocidade", "10 milhões de eventos"), governança ("padrões de governança e
    segurança", "compliance") e privacidade ("já nasceu cumprindo a LGPD", "dados encriptados").

    `observabilidade` é PROIBIDA e o motivo é o mesmo da Axenya: "módulo de dashboards" e
    "monitoram adesão ao tratamento" são produto para o cliente, não instrumentação do sistema
    de IA. É o falso positivo mais teimoso da base porque aparece em duas empresas diferentes.

    `dependencia_fornecedor` é AMBÍGUA e o caso é delicado: a empresa provavelmente TEM essa dor
    (nada indica modelo próprio), mas nenhum documento a declara. É a regra 4 do Evidence
    Validator em forma de gabarito — ausência de sinal não é sinal negativo, e um extrator que
    a emitisse estaria acertando por inferência, não por evidência. Não conta a favor nem contra.
