  conteudo_texto: 'Rodada de investimento

    Visio.AI capta R$ 12M e entra no mercado com Subway e Bob''s

    Recursos obtidos na rodada seed serão usados para expandir e apoiar 1,2 mil estabelecimentos do varejo
    até 2025



    Sócios da Visio.AI. Foto: Divulgação

    recebeu R$ 12 milhões em uma rodada de investimentos seed para focar em expansão, com a meta de atender
    e apoiar 1,2 mil estabelecimentos até 2025. A rodada foi liderada pelo

    e contou com a participação de outros investidores, como

    Fundada em São Paulo, a

    usa inteligência artificial para aumentar a rentabilidade de operações de lojas e franquias. Atualmente,
    a empresa tem focado em franquias do setor de alimentação, como as redes

    Segundo a startup, os clientes da empresa têm percebido uma redução no prazo do retorno do investimento,
    saindo da média nacional de 36 meses para 25 meses. Este impacto vem da redução de até 20% do custo
    de mercadoria vendida e 40 horas de economia do tempo da equipe, já evidenciada em mais de 150 clientes
    em todo o país.

    “Nosso objetivo na

    é transformar o ambiente de trabalho no varejo, aumentando a rentabilidade e escalabilidade das operações”,
    afirma o CEO da startup, Matheus Flores. Além do executivo, a equipe da

    é formada pelo CTO Gustavo Tamanaka, pelo CPO David Stanquini e pelo CFO Gabriel Flores (CFO).

    “Nossa solução utiliza inteligência artificial para trazer maior precisão no que precisa ser feito
    na loja no dia a dia, e no fim o que vemos é um efeito muito positivo na formação de cultura dos times,
    com trabalhos mais dinâmicos, treinamentos mais personalizados e funcionários mais engajados”, explica
    Matheus.

    Daniel Heise, sócio do

    , destaca que o

    segmento de varejo

    está passando por um momento de inflexão que representa uma oportunidade para startups como a

    . “Até recentemente, a tecnologia de ponta, especialmente a inteligência artificial, estava confinada
    ao mundo digital. Agora, essa mesma tecnologia está revolucionando as operações físicas. Encontramos
    na

    um time com a visão e capacidade para liderar essa transformação”, diz.'
