- tipo: noticia
  titulo: 'PhoneTrack: startup de speech analytics monitora 4 milhões de chamadas/mês'
  url_fonte: https://www.mobiletime.com.br/noticias/29/09/2021/phonetrack-startup-de-speech-analytics-monitora-4-milhoes-de-chamadas-mes/
  data_publicacao: null
  conteudo_texto: 'PhoneTrack: startup de speech analytics monitora 4 milhões de chamadas/mês

    Fernando Paiva | 29/09/21 09:40

    A tecnologia de análise automatizada de fala, ou speech analytics, em inglês, está sendo cada vez
    mais utilizada no Brasil para monitorar a qualidade no atendimento telefônico. Ela permite analisar
    rapidamente um grande volume de chamadas telefônicas, ao contrário da análise feita exclusivamente
    por humanos, que costuma trabalhar com uma pequena amostra. Com a

    e o distanciamento social, a demanda por soluções de speech analytics se acelerou. A startup curitibana
    PhoneTrack, que desenvolveu sua própria tecnologia nessa área, viu dobrar nos últimos 12 meses o volume
    monitorado: por mês agora são 4 milhões de ligações, que somam cerca de 10 milhões de minutos. A expectativa
    é dobrar de novo dentro de um ano, diz Marcio Pacheco, CEO da PhoneTrack, em conversa com Mobile Time.

    “Começamos há seis anos, no fim de 2015, inicialmente para mensurar campanhas de marketing com ligações
    telefônicas. Monitoramos as ligações recebidas em 11 mil pontos de venda de 700 clientes em 600 cidades”,
    contabiliza Pacheco.

    A solução da PhoneTrack analisa automaticamente 180 variáveis a partir do áudio gravado de todas as
    ligações recebidas pelo cliente. Consegue verificar, por exemplo, se o atendente seguiu o script;
    a proporção de tempo de fala do atendente e do consumidor; a sobreposição da conversa (quando o atendente
    fala por cima do consumidor); e até análise de sentimento. Com base nesses dados, prepara relatórios
    e indica para as empresas o que pode ser feito para melhorar a produtividade.

    “Procuramos entender qual é o padrão de sucesso. E informamos depois para o atendente o que ele precisa
    fazer. Às vezes pode ser só mudar o tom de voz”, comenta.

    Segundo Pacheco, os erros mais comuns em pontos de venda são os seguintes: 1) de 20% a 30% das chamadas
    recebidas não são atendidas, o que é um desperdício enorme, haja vista que são leads provenientes
    de campanhas de marketing que divulgaram aquele número telefônico; 2) falta de preparo do vendedor,
    que não faz as perguntas certas; 3) falta de cultura de análise de dados; 4) falta de padronização
    no atendimento nas redes lojas.

    Call center e futuro

    Depois de seis anos concentrada na análise de fala em chamadas recebidas em pontos de venda, a PhoneTrack
    começa a levar sua solução para contact centers, onde está sendo experimentada em diferentes tipos
    de chamadas. O maior desafio no call center é manter o padrão do atendimento, como o tom de voz e
    o respeito ao script, aponta Pacheco. O alto turn over mensal nesse setor agrava o problema, acrescenta.

    “Hoje os call centers escutam 2% das ligações. Como a avaliação é feita por humanos, ela varia conforme
    o turno. As chamadas de manhã costumam ser mais bem avaliadas, enquanto as de tarde recebem notas
    piores”, comenta.

    Para o futuro, a PhoneTrack avalia se tornar uma ferramenta de anlytics omnichannel, trabalhando também
    com texto e em diferentes canais. Além disso, estuda a possibilidade de analisar áudios de WhatsApp
    e de alto-falantes inteligentes.'
