perfil_alvo: AI-enabled
coletado_em: '2026-08-25'
perfil_alvo_nota: |-
  CASO INELEGÍVEL AO INCEPTION, que contexto/03 §2 pede por escrito: "a base de startups deveria
  conter ao menos um caso inelegível para exercitar isso". A empresa se descreve como
  consultoria na primeira linha do próprio site — "A Deal é a consultoria de IA para empresas
  brasileiras e latino-americanas, com mais de 600 especialistas" — e a página de carreiras diz
  "consultoria e serviços de tecnologia com 21 anos de história". Os serviços são alocação de
  talentos, "Squad as a Service" e desenvolvimento mobile e web sob demanda.

  Não há juízo nenhum embutido no rótulo: classificar como consultoria uma empresa que se chama
  de consultoria é ler o documento. O que a fixture mede é se o sistema RECUSA e diz por quê —
  que é o Diferencial declarado do projeto e hoje não tem um caso real que o exercite.
gabarito:
  classe: AI-enabled
  maturidade_stack: baixa
  confianca: media
  elegivel: false
  motivo_exclusao: consultoria
  dores_esperadas: []
  dores_proibidas: [observabilidade, latencia, privacidade, avaliacao, dependencia_fornecedor]
  dores_ambiguas: [custo, escalabilidade, governanca]
  nota: |-
    O CAMPO QUE MAIS IMPORTA AQUI É `motivo_exclusao`, não `elegivel`. Recusar pelo motivo errado
    conta como erro nomeado na régua, e não como acerto — foi exatamente esse o defeito que D-048
    pagou, onde uma startup de infraestrutura de IA era recusada por "cripto" ao falar em custo
    por token. Excluir a Deal por qualquer rótulo que não seja `consultoria` é o mesmo defeito
    com outra roupa.

    `dores_esperadas: []` porque a empresa está fora do funil por elegibilidade, e porque o
    material descreve o que ela faz PARA clientes, não a dor de infraestrutura dela.

    NOTA DE PROCEDÊNCIA: "21 anos de história" na página de carreiras implica fundação por volta
    de 2005, o que também a excluiria por idade. `ano_fundacao` fica `null` mesmo assim, seguindo
    a disciplina das fixtures de 22/08 — só entra o que aparece literalmente, e "21 anos" não é
    um ano. A consequência é boa para a medição: a exclusão testada aqui é a de consultoria,
    isolada, e a de idade fica no teste unitário de `elegibilidade()`, também isolada. Se as duas
    disparassem juntos nesta fixture, uma delas poderia quebrar sem que ninguém notasse.
