  conteudo_texto: 'Ir para o conteúdo

    Carreiras na Deal

    Somos uma consultoria e serviços de tecnologia com 21 anos

    de história e mais de 600 pessoas curiosas, criativas e ágeis, que não se contentam com o convencional
    e o preestabelecido.

    Aqui as verdadeiras protagonistas da nossa TECNOLOGIA são as nossas pessoas.

    E todas podem propor, pensar, questionar, testar, aprofundar, criar e recriar.

    ACESSE NOSSAS VAGAS

    Criamos um ambiente de

    real.

    Cocrie o futuro

    Todos podem contribuir com o nosso futuro e tem livre acesso às lideranças.

    Qualquer Dealmaker, em qualquer lugar, está sempre pronto para te ajudar a chegar mais longe.

    Entender para atender

    Atuamos de forma consultiva e construtiva em cada cliente e entre todas as áreas da Deal.

    Seja você mesmo

    Vivemos em um ambiente seguro que nos permite ir além do esperado, dos códigos prontos e das fórmulas
    fechadas.

    Errar é parte do sucesso

    Errar faz do aprendizado e nos aproxima do caminho certo.

    As habilidades corporativas sustentam nossas relações e guiam nossa forma de ser e agir.

    Ter uma atitude propositiva que saiba identificar, entender e relacionar os desafios de negócio com
    as competências do grupo.​

    Propiciar um ambiente de confiança onde as empresas, áreas e pessoas possam contribuir com suas competências
    em direção ​a um objetivo.

    Oferecer a cultura de aprendizado contínuo alinhado com a estratégia do grupo, estimulando e reconhecendo
    o protagonismo de cada um.​

    Como é trabalhar na Deal, pelas nossas pessoas

    Entrei na Deal pelo F5 Refresh (programa de recolocação de pessoas 40+) e estou na área de pré-vendas,
    aprendendo a cada dia com a equipe que, por sinal, é top demais. Espero seguir na Deal por muito tempo,
    sempre aprendendo, contribuindo com o crescimento do negócio e retribuindo o carinho com o qual fui
    recebido. Acho muito importante a preocupação que a empresa tem com as pessoas, pois faz com que nos
    sintamos parte do todo. Agradeço pela oportunidade e por terem me escolhido em meio a tantas outras
    pessoas!

