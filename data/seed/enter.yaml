  conteudo_texto: 'Startups: Quem é a Enter, unicórnio brasileiro de IA do setor jurídico

    Legaltech brasileira triplica valuation em um ano, chega a US$ 1,2B e acelera expansão com novos investidores

    Gabriela Del Carmen

    Atualizado 4 meses atrás

    A Enter, startup que usa inteligência artificial para estruturar estratégias jurídicas em larga escala,
    entrou na terça-feira (5) para um grupo ainda restrito no mercado global de tecnologia. A companhia
    levantou R$ 500 milhões em uma rodada série B e atingiu valuation de US$ 1,2 bilhão – mais que o triplo
    da avaliação registrada há um ano. Com isso, torna-se o primeiro unicórnio de IA da América Latina
    e o primeiro do Brasil desde 2024.

    A rodada foi liderada pela Founders Fund, que já havia liderado a série A, de US$ 35 milhões. O novo
    aporte também marca a entrada da Kaszek e da Ribbit Capital. Investidores já presentes, como Sequoia
    Capital, OneVC e Atlantico, acompanharam.

    Segundo o CEO e cofundador Mateus Costa-Ribeiro, a composição do captable foi pensada como uma aliança
    estratégica com players relevantes de IA. Esses fundos têm no portfólio empresas como SpaceX, OpenAI,
    Anthropic, Facebook, Apple e Google.

    Comece agora!

    Mesmo gerando caixa, a empresa decidiu aproveitar o momento de desempenho para levantar a rodada.
    A estrutura, com baixa diluição, também pesou na decisão.

    Unicórnio em menos de três anos

    Fundada em setembro 2023, a Enter nasceu quando Mateus, então com 23 anos, deixou a carreira como
    advogado nos Estados Unidos e um MBA em Stanford para empreender ao lado de Michael Mac-Vicar, ex-CTO
    da Wildlife, e Henrique Vaz, formado por Harvard.

    O foco da startup é automatizar o contencioso empresarial, usando IA para analisar processos, organizar
    provas e sugerir caminhos jurídicos, que depois passam por revisão humana. A tecnologia opera sobre
    grandes volumes de dados e combina modelos de linguagem – como OpenAI, Anthropic e Google – com bases
    proprietárias.

    Continua depois da publicidade

    Leia também: Forbes lista 25 startups americanas com potencial para se tornarem novos unicórnios

    A empresa rapidamente atingiu geração de caixa, ainda no primeiro ano. Em 2025, alcançou receita recorrente
    anualizada (ARR) de R$ 50 milhões – número que, segundo a companhia, cresceu 13 vezes neste ano.

    Na operação, a Enter afirma já processar mais de 300 mil casos por ano e cerca de 20 bilhões de tokens
    por dia. O modelo de receita combina pagamento antecipado pelo uso da tecnologia com uma parcela variável
    atrelada ao desempenho: cerca de 30% depende do sucesso nas ações. Em muitos casos, os processos são
    resolvidos em poucos meses.

    A Enter se junta a um pequeno grupo de legaltechs bilionárias, como a norte-americana Harvey, avaliada
    em US$ 11 bilhões, e a sueca Legora, com valuation de US$ 5,6 bilhões.

    Continua depois da publicidade

    Parte dos recursos será usada para acelerar novas frentes, especialmente a área trabalhista, onde
    a empresa já começou a operar com cinco clientes.

    Hoje, a Enter atende cerca de 40 grandes empresas, incluindo Latam Airlines, Azul, Santander, Bradesco,
    Nubank, C6 Bank, Vivo, SulAmérica e Airbnb. A meta é dobrar essa base até o fim do ano.

    O capital será direcionado principalmente para contratação e infraestrutura. A startup planeja adicionar
    80 engenheiros, chegando a cerca de 200 funcionários – mais de 85% em áreas técnicas – além de investir
    em pesquisa e desenvolvimento.

    Continua depois da publicidade

    Parte desse avanço passa por um acordo com o Conselho Nacional de Justiça (CNJ) para construir uma
    base histórica de processos judiciais no país.

    No longo prazo, a estratégia inclui expansão para o mercado norte-americano e a construção de uma
    empresa global de IA aplicada ao sistema jurídico. Nesse horizonte, um IPO é considerado um caminho
    possível.

    A legaltech considera o status de unicórnio é um marco relevante, embora não defina o objetivo da
    empresa. A prioridade segue sendo crescimento e execução em escala.

    Continua depois da publicidade

