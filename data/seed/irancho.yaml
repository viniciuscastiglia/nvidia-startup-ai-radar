    Banco do Brasil injeta R$ 7,2 milhões na agtech iRancho

    Startup oferece uma tecnologia de gestão da pecuária para mais de 3,5 mil propriedades rurais no Brasil
    e no exterior

    Gabriela Del Carmen

    Leitura:

    Copiar Link?

    Banco do Brasil

    investiu R$ 7,2 milhões na agtech

    , que oferece uma tecnologia de gestão da pecuária. O aporte foi feito por meio do fundo de corporate
    venture capital

    , administrado pela

    .

    Fundada em 2016, a

    busca auxiliar os pecuaristas na gestão dos seus empreendimentos, apoiando o processo de tomada de
    decisões e contribuindo para a melhoria do controle de insumos e redução de custos. Utilizada por
    mais de 3,5 mil propriedades rurais no Brasil e no exterior, a plataforma permite coletar e integrar
    dados de rastreabilidade nimal e manejo do curral possibilitando um controle de gato mais eficaz e,
    com isso, um aumento na produtividade.

    o pecuarista faz o controle do gado, gerencia a fazenda e torna o seu negócio mais rentável. É tudo
    muito simples e intuitivo, sem deixar de lado a eficiência na pecuária de corte”, afirma Thiago Parente,
    CEO da

    , em nota. Com o aporte, o Banco visa reforçar sua presença no setor agropecuário do país, com a possibilidade
    de ofertar a seus clientes as soluções da agtech.

    Thiago Parente, CEO da iRancho (Foto: Divulgação)

    Segundo Luiz Gustavo Braz Lage, Vice-Presidente de Agronegócios do

    Banco do Brasil

    , a instituição financeira tem um compromisso contínuo em apoiar o setor agrícola e pecuário brasileiro.
    “O

    promove soluções na cadeia do agronegócio, contribuindo com a geração de valor e otimização do processo
    produtivo, com a adoção de práticas ESG, que possibilitem a transformação no campo por meio da tecnologia”,
    explica.

    , o investimento na

    contribui para que os produtores brasileiros se posicionem na primeira linha na competição por alimentos
    de origem sustentável num concorrido mercado global.

    “Olhamos a determinação dos empreendedores e a oportunidade de avançar, pela tecnologia, a produtividade,
    funcionalidade e equilíbrio socioambiental. Encontramos esse binômio na

    , já que seu sistema permite que pequenos e médios pecuaristas aprimorem seu padrão de manejo e demonstrem
    o cuidado com que desenvolvem e protegem o meio ambiente”, conclui Moisés Swirski, sócio da

    .

    Em pouco mais de um ano de operação, a

    vem num ritmo consistente de rodadas. O aporte na

    é o quarto do fundo, e o primeiro em uma startup não relacionada diretamente a serviços financeiros.

    Em abril desde ano,

    o fundo assinou um cheque de R$ 4 milhões para a

    , fintech de gerenciamento de despesas corporativas. Antes disso, em dezembro, a

    entrou em uma rodada liderada pela Salesforce Ventures,

    colocando R$ 10,5 milhões na

    , startup especializada em meios de pagamento.

    O primeiro investimento da BB Ventures foi anunciado em outubro do ano passado –

    um aporte de R$ 5 milhões no banco digital

    , startup que oferece contas bancárias para jovens de 10 a 18 anos.'
