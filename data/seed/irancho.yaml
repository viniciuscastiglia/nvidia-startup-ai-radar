  conteudo_texto: 'no seu e-mail

    Com iRancho, a "pecuária digital" de Thiago Parente agora aposta no gado rastreado

    Filho do ex-ministro Pedro Parente trabalhou em empresas de tecnologia e na JBS antes de fundar a
    startup, que tem potencial inicial de rastrear até 2,5 milhões de animais

    Thiago Parente, CEO da iRancho

    Quando se analisa o histórico profissional de Thiago Parente, é possível perceber que, desde o começo
    da carreira, o fundador e CEO da startup iRancho procurou unir tecnologia e pecuária.

    Formado em Administração, ele se especializou em mercado financeiro na Fundação Getúlio Vargas. Começou
    sua trajetória profissional em empresas brasileiras de tecnologia brasileiras, passando também por
    gigantes globais como IBM e Oracle.

    Em entrevista ao

    , Parente define a pecuária como uma paixão. Talvez por isso tenha tomado a decisão de fazer um mestrado
    em Agribusiness na Texas A&M University, nos Estados Unidos.

    Durante esse mestrado, iniciou sua passagem por outra gigante mundial, desta vez do mercado de proteína
    animal, a JBS, até maio de 2016. Seis meses depois de deixar a companhia, fundou a iRancho.

    “Quando falava que a rastreabilidade seria o futuro do mercado mundial de carnes, há 3 ou 4 anos,
    fui chamado até de louco. Agora, já se acredita que no prazo de 5 a 10 anos, não haverá mais espaço
    para carne não rastreada”, conta Parente.

    Thiago é filho de Pedro Parente, que foi ministro do Planejamento durante o governo Fernando Henrique
    Cardoso e CEO de gigantes do agro como Bunge e BRF, além de presidente da Petrobras.

    Mais duas pessoas com o sobrenome Parente fazem parte da diretoria da iRancho. Maria Elisa é diretora
    Jurídica, e Lia Pullen Parente, diretora Operacional, ou COO.

    O executivo afirma que a iRancho é uma empresa familiar, mas está longe dos moldes mais tradicionais.
    “Digo que não podemos ter no time pessoas que não possam ser demitidas. Eu mesmo, se não estiver mais
    contribuindo, saio”, diz Thiago Parente.

    Isso se deve também à estrutura societária formada pela iRancho desde que recebeu seu primeiro aporte
    de capital, em 2020. Naquele ano, foram R$ 1,5 milhão da Agroven e da BRAngels, redes de investidores-anjo.
    O primeiro produto da empresa foi um software de gestão de fazendas, que foi lançado em 2019.

    E agora, o jogo da iRancho volta a mudar com a entrada do programa de venture capital do Banco do
    Brasil na startup, com um aporte de R$ 7,2 milhões.

    “Esses recursos vão servir para investir principalmente em tecnologia, com foco muito forte no SafeBeef”,
    conta Parente.

    O SafeBeef é o lançamento mais recente da iRancho, um programa de rastreamento de gado que foi apresentado
    pela empresa na semana passada, durante o Expointer.

    No evento, a startup promoveu um churrasco e distribuiu um panfleto que contava o histórico dos animais.
    Eles tinham como origem a Fazenda União Brasil, em Buri, no interior de São Paulo.

    Segundo Parente, a ferramenta é gratuita para o pecuarista, e tem um potencial inicial de rastrear
    até 2,5 milhões de animais, desde o pasto até a venda ao consumidor final.

    “Hoje, temos cerca de 3,4 milhões de animais cadastrados na iRancho. Nós atendemos entre 3,5 mil e
    4 mil fazendas, automatizando os dados do rebanho. Com essa base de dados, resolvemos desenvolver
    a ferramenta para aumentar a rastreabilidade do gado brasileiro”, conta o CEO.

    Ele conta que os serviços de dados oferecidos pela iRancho têm um impacto imediato na produtividade
    da pecuária de corte. “Nós conseguimos diminuir o tempo médio de processamento das informações de
    um animal de 4 minutos para 12 segundos”, conta Parente.

    Atualmente, a iRancho tem um faturamento anual entre R$ 4 milhões e R$ 4,5 milhões. As receitas da
    startup vêm da assinatura mensal ou anual do software de gestão, que é paga pelo pecuarista.

    “Estamos inclusive conseguindo diminuir muito os cancelamentos. Hoje, nós estamos com um índice de
    churn abaixo da metade do nosso pior momento”, diz Parente.

    Com a entrada do Banco do Brasil e o lançamento do SafeBeef, Parente espera que a iRancho alcance
    o nível de breakeven, quando uma empresa atinge o equilíbrio entre receitas e despesas, no final de
    2024 ou no primeiro semestre de 2025.

    Além disso, com o SafeBeef, a startup tem uma fonte de receita adicional. “Nós seremos uma espécie
    de ‘brokers’ de informação para bancos, seguradoras, frigoríficos e até para o varejo”.

    Parente conta que a rastreabilidade ajuda bancos e seguradoras a terem dados mais exatos sobre os
    rebanhos dos pecuaristas, o que barateia crédito e prêmios de seguros.

    “E nós cobramos deles alguns centavos por cabeça de gado. Os animais entram como garantia nessas operações”,
    conta Parente.

    A iRancho já tem presença no exterior. Com a chegada do BB, a plataforma será inclusive traduzida
    para o espanhol, e posteriormente, para o inglês, conta o CEO.

    “Nós já atuamos nos Estados Unidos, Inglaterra, Portugal, México, Bolívia e Paraguai. Mas tudo pelo
    boca a boca. Não fizemos qualquer campanha de venda no exterior. O que acontece também é que os pecuaristas
    de outros países procuram muito pelas tecnologias desenvolvidas aqui”, afirma Parente.

    A iRancho também deve aumentar sua equipe com o aporte do BB. “Hoje, temos uma equipe de 38 colaboradores.
    Devemos chegar a 50 até o fim do ano, apostando muito na área de tecnolo'
