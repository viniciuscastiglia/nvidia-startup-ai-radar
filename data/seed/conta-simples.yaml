  conteudo_texto: 'Pular para o conteúdo

    Pular para o menu

    Conta Simples lança “banco agêntico” B2B para finanças corporativas

    Ferramenta permite que empresas criem agentes de IA para pagamentos, conciliações e gestão financeira
    sem depender de código ou times de TI

    Gabriela Del Carmen

    Copiar Link?

    Rodrigo Tognini, CEO e cofundador da Conta Simples (Foto: Divulgação)

    apresentou ontem (10) o conceito de finanças autônomas como a nova frente estratégica da companhia.
    Segundo o CEO, Rodrigo Tognini, a plataforma de despesas corporativas está evoluindo para uma infraestrutura
    financeira capaz de operar com agentes de IA de forma segura e alinhada às políticas de seus clientes.
    O movimento marca o primeiro passo da

    rumo ao banco agêntico B2B, modelo em que a tecnologia reduz a carga operacional do time financeiro
    para que ele concentre esforços em análise, estratégia e tomada de decisão.

    “Nunca acreditamos que o preço era a diferenciação necessária para o mercado para crescer”, disse
    Rodrigo em coletiva de imprensa realizada no

    Web Summit Rio 2026

    . Na visão do CEO, 80% a 85% dos produtos bancários disponíveis hoje competem pela mesma variável
    – taxa mais barata, cartão com mais limite -, o que transforma preço em piso, não em diferencial.

    No caso da

    , a proposta é

    do futuro com base nos avanços da inteligência artificial, oferecendo soluções para simplificar a
    gestão financeira das empresas e aumentar a eficiência.

    “Estamos olhando para empresas que gostam de inovar e querem estar na vanguarda da transformação tecnológica.
    Esses players terão uma vantagem competitiva relevante, enquanto aqueles que aderirem daqui a alguns
    anos tendem a ficar para trás”, afirmou.

    A visão da

    vem acompanhada do Seu Agente, ferramenta que permite que as empresas construam seus agentes de IA
    para operar pagamentos, conciliações e gestão financeira. “Qualquer gestor descreve em linguagem natural
    o que o agente deve fazer, quando agir e com quais limites. O agente executa, e cada ação fica registrada,
    auditável e reversível – sem código e sem TI”, explicou.

    Dois modos, uma base

    A estratégia de go-to-market prevê a convivência entre perfis distintos de clientes. Empresas menos
    familiarizadas com IA continuarão acessando a plataforma no “modo banco” — a experiência atual, sem
    alterações. Em paralelo, empresas que já experimentam automação podem ativar o “modo agente”.

    Como sinal de demanda, Tognini citou a integração da

    com o Model Context Protocol (MCP), que permite conectar assistentes de IA a sistemas externos e viabiliza,
    por exemplo, consultar transações financeiras diretamente de ferramentas como o Claude, da

    . A integração foi lançada há menos de um mês e, desde então, a fintech registrou mais de 900 inscritos,
    120 usuários ativos e clientes com mais de mil requisições semanais.

    O lançamento do Seu Agente está previsto para o quarto trimestre de 2026. Atualmente, cerca de 100
    empresas participam da fase de testes em uma lista de espera.

    O foco está em PMEs com 10 a 500 funcionários – segmento que, segundo Rodrigo, ainda perde tempo significativo
    com a descentralização de despesas e processos de reembolso. Hoje, a

    soma mais de 40 mil empresas na base e já ultrapassou R$ 70 bilhões transacionados desde o lançamento.'
