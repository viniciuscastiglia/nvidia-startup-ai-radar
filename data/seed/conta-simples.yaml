  conteudo_texto: 'Na primeira grande captação do ano na América Latina, a Conta Simples acaba de levantar
    R$ 200 milhões para escalar sua carteira de cartões de crédito, lançar novos produtos e expandir seu
    perfil de clientes com empresas maiores.

    A Série B vem dois anos depois da fintech — que oferece uma conta digital PJ com ferramentas de gestão
    de despesas — ter feito sua última rodada, quando levantou R$ 121 milhões.

    A rodada de hoje foi feita apenas com investidores que já estavam no

    da fintech: o líder foi a gestora americana Base10 Partners, que foi acompanhada pela Valor Capital,
    Jam Fund, Y Combinator, Big Bets, Broadhaven e DOMO.

    O CEO Rodrigo Tognini disse ao

    que a Conta Simples só gastou 30% dos recursos da rodada anterior, mas decidiu fazer uma nova captação
    para ter mais fôlego e acelerar ainda mais seu crescimento.

    “Fizemos uma boa alocação da rodada anterior e nossa ideia era fazer uma nova ao longo de 2024. Mas
    a Base10, que já era investidor nosso, olhou o mercado e achou que era o momento de fazer uma Série
    B,” disse ele.

    Rodrigo não abriu o

    , mas disse que ele foi 230% maior que o da Série A, cujo valuation também não havia sido revelado.

    A captação vem em meio a uma melhora operacional relevante da Conta Simples. A fintech multiplicou
    sua receita por 2,7x no ano passado, saindo de uma margem EBITDA negativa (- 60%) em janeiro para
    o

    em outubro.

    Segundo Rodrigo, a melhora na rentabilidade veio de um aumento do

    — com a diversificação das fontes de receita — e um controle dos custos, que cresceram num ritmo muito
    menor.

    Até recentemente, 98% da receita da Conta Simples vinha da taxa de

    dos cartões. Mas no ano passado, ela adicionou receitas de floating, de crédito, da assinatura de
    um software de gestão de publicidade (o Hackr Ads, que ela comprou em 2022), e de uma mensalidade
    de R$ 49,90 cobrada das empresas que gastam menos de R$ 1.000 por mês no cartão de crédito.

    “Além disso, mantivemos bons indicadores operacionais, como CAC e LTV,” disse o fundador. “Nossa receita
    por cliente cresceu 180% ano contra ano.”

    A Conta Simples não abre sua receita, mas o CEO disse que os 30 mil clientes ativos da fintech movimentaram
    R$ 17 bilhões no ano passado, considerando as transações com cartões, Pix, transferências e boletos.

    Só o TPV de cartões foi de R$ 5 bilhões, e a startup disse que tem quase R$ 400 milhões em depósitos
    de clientes em suas contas.

    Com a entrada dos recursos da rodada, Rodrigo disse que a Conta Simples deve sair novamente do

    para acelerar o crescimento.

    “Vamos nos permitir operar queimando um pouco do caixa, mas nada que não permita voltar rapidamente
    ao

    se quisermos,” disse.

    Uma das avenidas de crescimento será o lançamento de novos produtos de crédito. Além do cartão de
    crédito, a fintech fez um teste no primeiro semestre do ano passado com uma linha de crédito para
    capital de giro, mas acabou paralisando a originação para focar apenas nos cartões.

    Agora, no entanto, Rodrigo disse que a Conta Simples quer lançar um produto de crédito que vai ser
    uma espécie de ‘

    buy now, pay later do PIX

    ’.

    “Imagina uma empresa que tem um fornecedor para pagar num prazo de 30 dias mas quer pagar em 60. A
    gente vai operacionalizar o pagamento em 30, e cobrar da empresa em 60 dias cobrando um

    ,” disse o CEO.

    Para reduzir o risco, a ideia é rodar este produto dentro da plataforma de gestão de despesas da Conta
    Simples, o que vai lhe dar mais visibilidade sobre a situação do cliente.

    Outro plano com a rodada é expandir o perfil de clientes. Hoje, a maioria das 65 mil empresas cadastradas
    na

    têm de 10 a 50 funcionários.

    A ideia é criar novos canais de aquisição e investir em marketing para atrair companhias com 100 a
    1.000 funcionários. “Isso demanda um investimento grande em estrutura, marketing e canais,” disse
    o fundador.

    Por fim, a Conta Simples também pode usar os recursos em M&As, ainda que este seja um plano mais para
    o médio prazo.

    Segundo Rodrigo, a rodada dá tranquilidade de caixa para a startup pelos próximos 3 a 4 anos.

    “O que vai ser daqui em diante, se vamos para um IPO, se vai ter rodada ou se vamos para um movimento
    estratégico, não sabemos ainda,” disse o fundador.

    “Mas adicionamos uma ‘pista de vida’

    relevante para multiplicar por 4 ou 5 vezes nossa base nos próximos anos. E tendo um crescimento desses,
    com um

    saudável e um diferencial de produto, as oportunidades surgem.”

    O FM/Derraik e o WilmerHale assessoraram a Conta Simples na operação.'
