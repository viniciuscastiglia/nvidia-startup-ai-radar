  nota: |-
    `classe` AMBÍGUA porque a base pública não decide, e fingir que decide seria o erro. Quem lê
    "LLM própria, painel de auditoria e governança dos dados" tem base para AI-native; quem
    exige evidência de profundidade técnica e não encontra nenhuma tem base para AI-enabled. As
    duas leituras são defensáveis sobre ESTES documentos, então nenhuma vira acerto limpo. O que
    seria erro é confiança ALTA em qualquer uma das duas.

    `confianca` AMBÍGUA por um motivo que a regra 2 do Evidence Validator não enxerga: os três
    documentos são de dois tipos diferentes e dois estão dentro da janela de 24 meses, então a
    regra devolve `alta`. Mas os três derivam do MESMO anúncio de captação — duas matérias de
    imprensa sobre o mesmo release e um BrandVoice, que é conteúdo pago pela própria empresa.
    Dois tipos de documento não é corroboração independente quando as duas fontes reproduzem a
    mesma assessoria. A régua registra isso como divergência conhecida em vez de escondê-la;
    afiar a regra 2 para distinguir fonte independente de reprodução de release é trabalho
    posterior, e esta fixture é a evidência de que ele é necessário.

    `governanca` é a única dor esperada e ela é literal e no sentido certo: "painel de auditoria
    e governança dos dados", "roda dentro do firewall do cliente", "compliance". É também a dor
    que a NVIDIA endereça com NeMo Guardrails, o que torna esta a fixture onde uma recomendação
    específica seria defensável.

    ARMADILHA CONHECIDA, e ela é da mesma família do `"token"` de D-048: o casador de sinais
    técnicos acha `'rag'` dentro da palavra "co(rag)em" — "quais tiveram coragem de instalar
    seus primeiros agentes". Uma empresa ganha marcador de profundidade técnica por causa de
    coragem. Substring sem fronteira de palavra, no Extractor desta vez.
