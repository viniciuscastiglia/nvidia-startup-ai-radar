    Tamanho da fonte:

    Lucas Affonso, fundador e CEO da Freedom. Foto: divulgação.

    A Freedom.AI, startup brasileira especializada em agentes de inteligência artificial para grandes
    companhias, captou R$ 14,5 milhões em uma rodada liderada por Bertha Capital, Big Rider, Bossa Invest
    e investidores-anjo.

    Criada entre setembro de 2024 e janeiro de 2025, a empresa desenvolve multiagentes sob medida, capazes
    de assumir tarefas repetitivas, executar processos complexos e operar 24/7 em áreas críticas como
    vendas, finanças, RH e operações.

    Sua tecnologia roda dentro do firewall do cliente, com LLM própria, painel de auditoria e governança
    dos dados. A promessa é integrar facilmente os agentes aos sistemas existentes, como CRMs, ERPs, plataformas
    de suporte e financeiros.

    O fundador da Freedom.AI é Lucas Affonso, que liderou a expansão da We Can BR, empresa da sua família,
    de R$ 170 milhões a R$ 500 milhões em faturamento. Para criar a startup, Affonso encontrou apoio na
    aceleradora Big Rider, liderada por Jaime de Paula, fundador da Neoway.

    Diferente de uma gestora de investimentos tradicional focada em Bolsa de Valores, a Big Rider atua
    no ecossistema de tecnologia, focando especialmente em

    que utilizam IA e Big Data.

    Jaime de Paula é uma das figuras mais conhecidas do setor tecnológico brasileiro. Ele foi o fundador
    da Neoway, a maior empresa de Big Data Analytics da América Latina, que foi vendida para a B3 em 2021
    por cerca de R$ 1,8 bilhão.

    Atualmente, a Freedom.AI já opera com milhares de agentes de IA em produção, atendendo mais de 100
    clientes. Entre eles, estão nomes como Panvel, Vibra, Cartão de Todos, Comerc Energia, Unifique e
    Guepardo Investimentos.

    Além disso, a startup tem uma parceria com a Grant Thornton, uma das maiores empresas globais de auditoria,
    consultoria e tributos, para validação e implantação dos projetos.

    Com o novo aporte, a Freedom.AI pretende focar em escala, consolidação e crescimento de longo prazo.
    O plano é faturar R$ 500 milhões em até seis anos.

    Para isso, a ideia é acelerar três frentes principais: expansão comercial no Brasil, aquisições estratégicas
    e evolução da plataforma.

    “O capital vem para acelerar decisões que já estavam no nosso roadmap: crescer mais rápido, consolidar
    tecnologia e ampliar presença em grandes contas”, afirma Lucas Affonso, fundador e CEO da Freedom.AI.

    A empresa já iniciou o movimento de M&A com a aquisição da Nalk, startup investida pelo G4 Educação,
    e avalia novas oportunidades como forma de acelerar portfólio, tecnologia e base de clientes. Já a
    internacionalização deve ficar para uma fase posterior.

    “Primeiro, queremos provar escala no Brasil. Depois disso, a expansão acontece com muito mais eficiência”,
    afirma Affonso.

    A Bertha Capital foi fundada em 2017 e é uma gestora de fundos de investimento em capital de risco
    especializada em conectar grandes companhias a startups, tendo investido em empresas como CashU e
    Simple&Co.

    Em vez de gerir um fundo para uma única companhia, ela frequentemente estrutura fundos multi-cotistas,
    onde várias corporações de um mesmo setor (como agro ou indústria) investem juntas para diluir riscos
    e aumentar o aprendizado.

    Atualmente, a Bertha Capital gerencia mais de R$ 600 milhões distribuídos em cerca de 15 fundos. Por
    trás deles, estão nomes como Multilaser, Viasoft, FIEAM e Microsoft.

