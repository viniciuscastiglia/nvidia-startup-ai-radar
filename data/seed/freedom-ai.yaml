perfil_alvo_nota: |-
  CASO MIRAGE PMF — o wrapper disfarçado de AI-native, e a fixture mais importante do conjunto.
  A linguagem é de autopilot puro e vem da boca do fundador: "eu vendo mão de obra digital",
  "força de trabalho", agentes que "operam 24/7" em vendas, finanças, RH e operações. A prova
  oferecida é crescimento de receita — 900% ao ano, 3.650% ao mês —, que é exatamente o sinal
  que a Emergence Capital chama de ilusão de PMF: "revenue growth powered by human labor rather
  than AI leverage". O fundador descreve a própria empresa como "uma agência de agentes de
  inteligência artificial", e sua experiência anterior é uma operação de recrutamento.

  Ela alega "LLM própria" e "painel de auditoria", o que é sinal real de AI-native — mas nenhum
  dos três documentos traz uma linha que sustente: nenhum benchmark, nenhuma arquitetura, nenhum
  detalhe de treino ou de serving. É o contraste direto com a Maritaca AI, que alega o mesmo e
  publica quantização, MoE e contas de GPU-hora.
