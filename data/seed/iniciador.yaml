  conteudo_texto: 'Fintech brasileira leva Pix à era da inteligência artificial

    Investida da Valor Capital e Prosus, o Iniciador integra IA ao Pix e leva os pagamentos agênticos
    para as transações instantâneas

    Ler o resumo da matéria

    A corrida para conectar modelos de inteligência artificial aos meios de pagamento, hoje disputada
    por gigantes de cartões e pelo mercado de stablecoins, ganhou uma frente brasileira. O Iniciador,
    fintech de infraestrutura para Open Finance, afirma ter lançado a primeira solução de pagamentos agênticos
    do mundo baseada em um sistema de pagamentos instantâneos.

    A tecnologia usa o Pix como trilho de liquidação e o Open Finance para permitir que pagamentos sejam
    iniciados fora do aplicativo do banco, em jornadas como e-commerce, delivery ou assistentes de IA.
    Segundo Gustavo Bresler, CPO e cofundador do Iniciador, o diferencial brasileiro está na capilaridade
    do Pix. “O Pix é como se já tivesse tokenizado os depósitos do Brasil inteiro”, diz.

    Criada no fim de 2021, o Iniciador lidera o ranking de chamadas de APIs de iniciação de pagamentos
    no país e faturou R$ 10 milhões em 2025. Investida por Valor Capital e Prosus, a empresa atende nomes
    como Stone, PagBank, iFood, CloudWalk, Banco Genial, Wise e Caju. Agora, quer vender a bancos e plataformas
    a infraestrutura para que agentes de IA possam iniciar pagamentos via Pix.

    * Resumo gerado por inteligência artificial e revisado pelos jornalistas do NeoFeed

    Agentes que otimizam investimentos de acordo com os objetivos do usuário, trocam de fornecedor quando
    os preços de mercado mudam ou fazem as compras do mês com base no que falta na geladeira — tudo isso
    de forma automática. Essa realidade, que até pouco tempo parecia distante, está cada vez mais próxima
    com os avanços da

    .

    mar de oportunidades

    aberto por essa nova tecnologia tem provocado uma corrida para conectar modelos de IA aos meios de
    pagamento. A disputa por esse mercado envolve gigantes de cartões, como Visa e Mastercard, além do
    mercado de

    .

    É nesse contexto que o Iniciador, fintech brasileira de infraestrutura para Open Finance, afirma ter
    lançado a primeira

    solução de pagamentos agênticos

    do mundo baseada em um sistema de pagamentos instantâneos.

    “O dinheiro pode ir de qualquer conta para qualquer conta, em qualquer banco, e tanto o pagador quanto
    o recebedor são notificados desse processo”, afirma Gustavo Bresler, CPO e co-fundador do Iniciador.

    A solução se apoia em duas infraestruturas criadas nos últimos anos pelo Banco Central: o Pix e o
    Open Finance. O Pix funciona como o trilho de liquidação instantânea, enquanto o Open Finance permite
    que uma instituição autorizada inicie a transação a partir de outras interfaces, fora do aplicativo
    do banco.

    Com a licença de iniciador de transação de pagamento, o Iniciador consegue conectar diferentes instituições
    e permitir que uma transação seja iniciada em outras jornadas digitais — como de um e-commerce ou
    de um aplicativo de delivery.

    A partir dessa infraestrutura, a empresa já vinha desenvolvendo aplicações como Pix por aproximação
    e Pix Inteligente, que permite criar regras automáticas de movimentação entre contas do próprio usuário.

    Criada no fim de 2021, o Iniciador já lidera o ranking de chamadas de APIs ligadas à iniciação de
    pagamentos no país — indicador que mede as comunicações entre instituições no Open Finance.

    Nos últimos três meses, a companhia teve 283 milhões de registros, segundo dados do Banco Central,
    à frente do Google Pay Brasil, com 162,3 milhões, e do Nubank, com 112,3 milhões.

    Em 2025, a empresa faturou R$ 10 milhões, quatro vezes mais que no ano anterior. No ano passado, levantou
    US$ 6 milhões em sua primeira rodada de captação institucional, liderada pela Valor Capital, e, posteriormente,
    também recebeu

    da Prosus.

    A nova fronteira para seguir crescendo, agora, é a conexão dessa estrutura com agentes de IA.

    Segundo Bresler, já existem

    soluções baseadas em cartões de crédito

    , mas lojistas podem esperar semanas para receber ou pagar taxas de antecipação, e iniciativas de
    pagamentos agênticos com cripto e stablecoins ainda dependem da tokenização dos depósitos.

    “Outros modelos pelo mundo não têm essa conexão direta que o Pix já tem com todos os bancos do Brasil”,
    afirma. “O Pix é como se já tivesse tokenizado os depósitos do Brasil inteiro.”

    O avanço do Pix no comércio também reforça essa leitura. Segundo o último Global Payments Report,
    o Pix já superou os cartões de crédito em volume transacionado no Brasil. Em 2025, respondeu por 42%
    do volume no e-commerce, ante 40% dos cartões de crédito. Nas lojas físicas, a fatia foi de 34%, contra
    31% do crédito.

    “Estamos vendo começar o que vai ser essa parte de

    e bancarização agêntica também”, diz Bresler. “Em vez de você entrar num marketplace para comparar
    produtos, você poderia fazer isso diretamente no ChatGPT, no Claude ou no Gemini, porque é um lugar
    em que hoje você já entra para pesquisar o que é melhor para você.”

    Como provedora de infraestrutura para o mercado financeiro, a proposta do Iniciador é vender a solução
    para bancos, instituições de pagamento, adquirentes, subadquirentes e plataformas digitais — o mesmo
    público para o qual já oferece serviços ligados ao Open Finance.

    Bresler afirma que a empresa não pretende criar agentes de IA, mas fornecer a camada tecnológica e
    regulatória que permite que esses agentes iniciem pagamentos via Pix.

    A estratégia por trás desse modelo é liberar bancos e instituições financeiras de uma parte considerada
    mais operacional do Open Finance. Segundo Bresler, muitas instituições montaram equipes próprias para
    cumprir as exigências regulatórias, mas boa parte precisava se dedicar apenas à manutenção, às atualizações
    e à integração do sistema.

    Além da tecnologia desenvolvida por trás da nova solução, um dos ativos mais valiosos conquistados
    pela companhia nesses menos de cinco anos de existência foi a carteira de clientes. Entre eles, estão
    Stone, PagBank,

    , CloudWalk, Banco Genial, Wise, Caju, Núclea, Nomad e Vindi.

    “A gente consegue não só cuidar de toda a manutenção recorrente, que é o mais trabalhoso do Open Finance,
    mas também ajudar aquela instituição a habilitar, dentro dos seus produtos, todas as mil e uma possibilidades
    que o Open Finance tem.”

    Com a integração aos agentes de IA, o Iniciador quer levar essa mesma lógica. Em vez de cada banco
    ou fintech construir do zero a conexão entre seus assistentes, o Pix e o Open Finance, a empresa quer
    fornecer toda a infraestrutura, liberando as instituições financeiras da parte técnica para que possam
    focar no desenvolvimento de novos produtos.'
