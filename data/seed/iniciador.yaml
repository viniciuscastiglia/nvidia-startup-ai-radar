  conteudo_texto: 'O Iniciador — uma startup que fornece a infraestrutura tecnológica para companhias
    disponibilizarem o Pix por biometria, o Pix automático e o Pix inteligente — acaba de levantar uma
    rodada de R$ 32 milhões, em mais uma prova do potencial do

    .

    A captação foi liderada pela Valor Capital e teve a participação da big bets, Alter, Actyus e Norte
    Ventures.

    Essa é a segunda rodada do Iniciador, fundada em 2021 por Marcelo Martins, um empreendedor que já
    fundou e vendeu uma startup antes.

    A rodada anterior, logo que a startup foi fundada, foi de R$ 1,2 milhão e feita com especialistas
    do setor, como Edson Santos, e empreendedores como Andres Bilbao, o cofundador do Rappi.

    Martins disse ao

    que vai usar os recursos da rodada para investir mais no produto, melhorando a tecnologia; para contratar
    mais pessoas para sustentar o crescimento projetado; e para reforçar o capital prudencial exigido
    pelo Banco Central.

    O Iniciador tem as licenças de Instituição de Pagamento (IP) e de Iniciador de Pagamentos (ITP). Alguns
    clientes contratam apenas a infraestrutura tecnológica da startup e usam suas próprias licenças para
    operar, mas outros usam as licenças da startup, o que demanda o capital regulatório.

    A infraestrutura do Iniciador faz basicamente a conexão com as APIs do Banco Central e a gestão diária
    dessas conexões. “A conexão inicial é complexa, mas o maior desafio é a operação do dia a dia. Fazer
    isso de uma forma eficiente que garanta a maior conversão possível para os clientes,” disse Martins.

    A startup já atende clientes como iFood, Stone e Nomad. No Pix automático, Martins diz que o Iniciador
    tem um

    de 60% de todas as instituições que oferecem hoje o produto. No Pix por biometria, de 50%.

    Gustavo Bresler, o COO do Iniciador, disse que outro benefício para os clientes é o

    time to market

    . “Nesse momento de início do mercado e de forte competição entre os participantes, é muito importante
    ser rápido para lançar os produtos para ter ganho de market share. E com a gente eles conseguem isso,”
    disse ele.

    As novas funcionalidades do Pix — nas quais o Iniciador atua — têm sido lançadas gradativamente pelo
    Banco Central.

    A primeira delas foi o Pix inteligente, lançado em abril de 2024 e que permite fazer transações automáticas
    entre contas da mesma titularidade. Em fevereiro deste ano, foi a vez do Pix por biometria, que permite
    fazer transações de Pix em ecommerces, por exemplo, sem precisar acessar o banco, usando a biometria.
    Por fim, o Banco Central lançou em junho o Pix automático, que permite fazer transações recorrentes
    com o Pix, como pagar uma assinatura mensal.

    A próxima funcionalidade que o BC deve lançar é o Pix parcelado, que permitirá pagamentos parcelados
    com o Pix, com a cobrança de juros. (Assim que for lançada, o Iniciador deve entrar também nesse produto.)

    O modelo de monetização do Iniciador é vinculado ao sucesso: a receita vem de um valor fixo — alguns
    centavos — por cada transação bem sucedida que ocorrer na plataforma de seus clientes.

    A startup não abre a receita atual, mas diz que cresceu em 4x sua base de clientes desde o início
    do ano. Para frente, o crescimento virá tanto dos clientes atuais, com o crescimento do uso dessas
    opções de pagamento, quanto de novos clientes.

    O Iniciador já tem um

    relevante dos players que operam com esses meios de pagamento hoje, mas o mercado ainda está muito
    no começo. “Essa figura da ITP é algo muito novo no mercado. Muitas instituições ainda não entraram
    nessa modalidade,” disse Martins. “Vamos crescer nessas empresas, que vão adicionar essa modalidade
    e precisam de um

    que forneça a infraestrutura para elas.”

    A rodada de hoje mostra a força que o Open Finance tem ganhado no Brasil, cinco anos depois de ter
    sido anunciado pelo BC. Hoje, o Open Finance do Brasil é o maior do mundo — em escopo e em uso.

    Para se ter uma ideia, no Brasil acontecem mais de 4 bilhões de chamadas de Open Finance por semana;
    no Reino Unido, um dos primeiros mercados a adotar a tecnologia, são 15 bilhões por ano. “E isso é
    muito apoiado pelo Pix, que tem um impacto significativo no mercado e uma adoção por quase toda a
    população bancarizada,” disse Martins.'
