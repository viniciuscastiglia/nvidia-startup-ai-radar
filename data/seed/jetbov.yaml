  conteudo_texto: 'JetBov lança "franquias agtech" para escalar venda de plataforma de gestão pecuária

    Novo sistema de comercialização faz parte de estratégia da empresa de aumentar presença de seus serviços
    ao redor do Brasil

    Italo Bertão Filho

    Quando a agtech JetBov surgiu no mercado, há quase dez anos, a digitalização da pecuária de corte
    – uma das operações mais complexas e tradicionais do agronegócio – ainda era um território praticamente
    inexplorado.

    Atualmente, o cenário é bem diferente. A agtech contabiliza que mais de 10 milhões de cabeças de gado
    passaram pela sua plataforma, que conta com 4 mil propriedades ativas e uma operação que ultrapassou
    o Brasil e está em outros sete países ao redor do mundo.

    Agora, a empresa fundada por Xisto Alves está ampliando suas operações para aumentar a capilaridade
    de seu software com um sistema de franquias, que está em atividade desde o fim do ano passado, mas
    está sendo lançado oficialmente agora, segundo a empresa informou em primeira mão ao AgFeed.

    Já foram lançadas cinco unidades JetBov nas cidades de Boa Vista (RR), Marabá (PA), Marília (SP),
    Maringá (PR) e Vilhena (RO). Outras três franquias devem ser inauguradas ainda no primeiro semestre
    deste ano.

    No sistema, cada franqueado entra com um investimento inicial – que a JetBov prefere não revelar —
    para comercializar os serviços, implantar a plataforma, dar suporte técnico e realizar eventos utilizando
    a marca da agtech.

    O perfil desses franqueados são empresas de consultoria agropecuária. A preferência por esse tipo
    de empresa foi proposital, na avaliação de Xisto Alves, para manter o nível de qualidade dos serviços
    prestados pela JetBov.

    “Somos bem rigorosos na seleção, porque a gente entende que tem que ser consultorias realmente que
    possam levar essa parte mais estratégica para dentro da fazenda. O mais importante no sistema é a
    qualificação, o franqueado tem que atender a esses requisitos”, afirma.

    Além disso, Alves destaca que o interesse das consultorias em participar desse tipo de formatação
    vem acontecendo de forma natural.

    “As empresas de consultoria que têm pessoal e estrutura já tinham uma importância significativa na
    própria gestão de alguns pecuaristas que usavam o sistema JetBov. E algumas delas já usavam o nosso
    sistema para atender aos próprios clientes”, afirma.

    A ideia é que os franqueados tenham retorno com a venda dos serviços, a partir de um percentual da
    assinatura que é paga pelos pecuaristas ao assinarem os produtos da empresa.

    A JetBov tem quatro planos, começando a partir de R$ 99,90 no pacote mais básico. “Enquanto o cliente
    permanece na plataforma, o parceiro também recebe uma parte dessa recorrência”, afirma Alves.

    Como a agtech também está presente em clientes de fora do Brasil, em países como Paraguai, Uruguai,
    Bolívia, Peru, Moçambique, Angola e Portugal, há a possibilidade de internacionalizar o sistema de
    franquias, mas, enquanto a operação está no começo, a JetBov quer concentrar o projeto no Brasil.

    O sistema de franqueados é uma evolução de um programa de parceiros que a JetBov vem implementando
    desde 2021 e que utiliza o modelo de marketing digital de indicação.

    Nesse sistema, os parceiros indicam a utilização da plataforma pelos pecuaristas, e ganham um percentual
    em cima da venda, que é feita pela empresa.

    “A gente começou a perceber que muitos técnicos, muitas pessoas que estão ligadas à pecuária, e de
    alguma forma atendem o produtor vendendo equipamentos, sistema de identificação animal, serviços,
    parte reprodutiva, ou gestão, nos procuravam e se interessavam pela plataforma. porque viam que era
    complementar ao produto que estavam oferecendo”, explica Xisto Alves.

    Hoje são 270 parceiros dentro desse programa. Conforme o projeto foi avançando, a JetBov percebeu
    que havia também uma oportunidade de escalar comercialmente seu produto, a partir de empresas de consultoria
    agropecuária que já estavam utilizando a plataforma.

    “Identificamos que havia uma forma de como a gente poderia criar um sistema, uma rede de parceiros,
    que não seriam somente aqueles que indicam o JetBov, de forma mais pontual, mas que pudessem atuar
    como uma extensão da empresa”, afirma Xisto Alves.

    Para coordenar o projeto, a JetBov contratou recentemente um novo diretor comercial, Josias de Souza.

    A agtech também utilizou parte dos R$ 1,74 milhão que arrecadou entre o fim de 2023 e o começo de
    2024 em uma rodada do tipo crowdfunding na plataforma EqSeed.

    “O objetivo dessa captação era investir nesse modelo de criação de novos canais de distribuição do
    software”, afirma o CEO da JetBov.

    Para este ano, Xisto Alves não projeta a abertura de uma nova rodada de investimentos.

    Desde que foi criada, a JetBov já conseguiu captar cerca de R$ 8,2 milhões no mercado em diferentes
    rodadas de investimento.'
