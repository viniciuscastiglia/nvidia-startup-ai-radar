  titulo: A veterana JetBov entra na era da IA para acompanhar a aceleração da pecuária digital
  url_fonte: https://agfeed.com.br/agtech/a-veterana-jetbov-entra-na-era-da-ia-para-acompanhar-a-aceleracao-da-pecuaria-digital/
  data_publicacao: null
  conteudo_texto: 'A veterana JetBov entra na era da IA para acompanhar a aceleração da pecuária digital

    Há nove anos no mercado, a agtech já atravessou várias fases da digitalização do setor, que demorou
    mais que a agricultura a adotar a tecnologia. Agora, vê o mercado ganhando tração e busca um novo
    fôlego para se manter nessa maratona

    Luiz Fernando Sá

    Xisto Alves, fundador e CEO da JetBov

    Quando Xisto Alves deu os primeiros passos para a criação da JetBov, ainda não se falava em digitalização
    na pecuária. Foram-se nove anos, o quadro já mudou um tanto, mas o segmento ainda tem muito a caminhar
    para se igualar, em nível tecnológico, ao que aconteceu, por exemplo, na agricultura.

    Por isso, mesmo depois de tanto tempo e com mais de 4 mil propriedades rurais ativas e mais de 11
    milhões de cabeças de gado tendo passado pela plataforma da empresa, com clientes no Brasil, Uruguai,
    Paraguai, Bolívia, Peru, Angola, Moçambique e Portugal, o empreendedor ainda considera que comanda
    uma startup.

    “Em função do potencial do setor e considerando o tamanho do mercado, principalmente aqui no Brasil,
    ainda somos sim uma startup”, afirma. “A grande maioria das fazendas está num processo de digitalização,
    não tem um software de gestão, não tem um processo digital de controle”.

    A JetBov é uma das veteranas do ecossistema AgTech no Brasil. Criada em 2015, atravessou várias fases
    e já recebeu mais de R$ 8,2 milhões em rodadas de investimento, desde que passou pelo processo de
    aceleração na Ace Ventures.

    Primeiro, recebeu aportes de investidores anjo, depois de fundos de venture capital, como a SP Ventures,
    e até de clientes que decidiram apostar no negócio. A rodada mais recente aconteceu no ano passado,
    através da plataforma EqSeed.

    Os recursos foram integralmente aplicados em desenvolvimento, segundo Alves. E se mostraram suficientes
    para fazer a empresa superar o chamado “vale da morte” das startups e acompanhar o amadurecimento
    de um mercado que, quando a empresa surgiu, parecia ainda não estar pronto para demandar seus serviços.

    Hoje, o empreendedor acredita que o cenário mudou. “A pecuária está atrás porque começou mais tarde,
    comparado com a agricultura” ele diz. E cita o consultor Maurício Palma Nogueira, sócio da Athena
    Agro, criador do Rally da Pecuária e colunista do

    , para reforçar sua tese de que chegou a hora da pecuária digital.

    “Recentemente, participei de um evento com o Maurício e ele falou: ‘A pecuária está numa aceleração
    maior do que foi na agricultura’. A tendência é que, rapidamente, alcance o mesmo nível de uso de
    tecnologia”, acredita.

    Para Xisto Alves, a aceleração, que permitiu um crescimento de 40% ao ano nesta década, é fruto de
    uma pressão do mercado, que tem exigido dos pecuaristas esforços no sentido de reduzir o tempo dos
    ciclos de cria, recria e engorda, até o momento do abate. E isso só acontecerá com otimização da produção,
    gerando produtividade e rentabilidade através do aumento de arrobas por hectare.

    “A tecnologia é o meio para que os produtores possam melhorar a sua gestão”, diz Alves. “Com as decisões
    baseadas em dados, é possível impactar na lucratividade, na eficiência de produção de carne por hectare”.

    Foi pela busca desses dados que Xisto Alves iniciou a jornada da JetBov, que agora entra na era da
    inteligência artificial. A empresa acaba de lançar um novo aplicativo, o terceiro de sua prateleira,
    com a pretensão de que ele funcione como um “Chat GPT da Pecuária”.

    Segundo Alves, a ideia é que o pecuarista possa utilizá-lo para “conversar” com a ferramenta em busca
    de respostas para questões relacionados ao manejo de seu rebanho e da gestão de sua propriedade.

    Ainda em fase beta, por enquanto o aplicativo JetBov Gestor consegue atuar em três funções. Uma é
    gerar relatórios a partir da plataforma da JetBov. “Ao invés de ter que ir para o computador, basta
    pedir, no próprio celular, para ele gerar, por exemplo, aquele relatório de inventário de animais
    por sexo. O aplicativo traz o gráfico e o produtor pode compartilhar pelo WhatsApp e tudo”, explica.

    A partir dessa análise, o gestor pode solicitar para a IA criar tarefas para quem está no campo, que
    serão recebidas pelo funcionário com acesso ao aplicativo JetBov no pasto.

    A terceira função do aplicativo permite acessar a base de conhecimento acumulada pela JetBov, com
    conhecimento zootécnico ou sobre o próprio software, para ajudar com dúvidas.

    “Mais do que ser uma ferramenta para facilitar o acesso, a gente acredita que a inteligência artificial
    vai ter um papel também de predição de informações”, diz. “Ela monitora tudo que está acontecendo
    e vai apontar problemas antes de eles acontecerem ou oportunidades que possam ser trabalhadas, não
    de maneira reativa, mas de maneira proativa”.

    O novo aplicativo está disponível para clientes da JetBov que são assinantes dos pacotes mais completos
    de serviços da empresa. Alves prevê que ele vai evoluir rapidamente e que os modelos preditivos estarão
    acessíveis até o final de 2025.

    “Nos próximos 12, 18 meses isso vai ser uma realidade”, afirma.

    A JetBov já passou por diferentes fases até chegar à era da IA. Nos primeiros anos, o foco estava
    na coleta de dados e, segundo o próprio Xisto Alves, foi um momento de muito aprendizado até entender
    o rumo correto a dar ao negócio.

    “Passamos por um processo de incubação, com apoio de universidade, aceleradora, tudo. Desse período
    a gente trouxe muita metodologia para entender mais profundamente quais eram as dores do produtor”,
    diz.

    A primeira conclusão foi entender que era importante ter um único foco, que acabou sendo a pecuária
    de corte, “que já é grande o suficiente para a gente atacar exclusivamente e fazer algo que realmente
    seja muito relevante”.

    Depois disso, foi compreender a infinidade de variáveis da atividade. Segundo Alves, “tem tanta coisa
    acontecendo ali que é inviável ter isso de uma maneira confiável e precisa no caderno de campo, e
    também que chegasse rápido no decisor”.

    O primeiro alvo da empresa, entãom foi criar um produto digital que substituísse o caderno de campo,
    permitindo a coleta de informações, e que funcionasse offline. O resultado foi o primeiro aplicativo,
    o JetBov de Campo, lançado em 2016, quando a empresa começou a vender sua plataforma de gestão.

    A partir daí, uma das maiores preocupações da empresa foi integrar à plataforma o crescente número
    de equipamentos geradores de dados que começavam a surgir, de bastões de identificação por rádio-frequência
    a balanças eletrônicas.

    “Hoje já tem mais de 40 modelos diferentes de equipamentos e, sempre que sai um novo, as empresas
    já nos procuram para a gente testar e deixar ele pronto para se comunicar com o aplicativo”, diz.

    Então, segundo Alves, a empresa passou a olhar mais para aspectos gerenciais, econômicos e financeiros
    dentro do ambiente web, permitindo ao pecuaristas desde a importação de uma nota fiscal, quando ele
    compra o insumo, fazendo do controle de estoque ao apuramento do custo de produção por animal.

    “A gente começou a oferecer um nível de decisão muito maior com essas informações, para criar análises
    e personalizar toda a gestão”, conta.

    No ano passado, o segundo aplicativo trouxe essas informações para o universo mobile, com uma interface
    mais visual para gestão de manejo de pasto. Assim, o pecuarista passou a ter dois aplicativos de coleta,
    um para o curral outro para o pasto.

    A aceleração da digitalização na pecuária, de acordo com o empreendedor, está diretamente relacionada
    ao avanço da conectividade no campo. “Hoje isso deixou de ser uma barreira”, afirma.

    “Agora a gente está mais em um momento de ampliação da conectividade para a utilização de novos equipamentos,
    novos sensores, hardwares que vão estar coletando mais dados de produção”.

    O que ainda falta, na visão de Xisto Alves, é a mudança de visão de alguns pecuaristas que, no sei
    entender, “não conheceram melhor o que é fazer uma gestão moderna da pecuária e estão ainda em um
    paradigma mais tradicional, mais extrativista”. Mas, para quem já viveu tantas mudanças, é só uma
    questão de tempo.'
