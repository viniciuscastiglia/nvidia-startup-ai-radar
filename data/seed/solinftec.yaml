    Com famílias de robôs e lógica de iPhone, Solinftec quer "acelerar o tempo" da agricultura

    Os conceitos que estão por trás da nova estratégia da agtech brasileira de maior sucesso internacional
    para os próximos anos e como ela pretende resolver, com novas abordagens, problemas antigos de diferentes
    segmentos do agro

    Luiz Fernando Sá

    O robô Solix e a estação de abastecimento autônoma: a tecnologia já “mora” no campo

    Qual é o tempo do agro? Para um negócio que depende de meses de espera por safras e em que observação
    de tendências e busca de resultados muitas vezes tomam várias safras, entre uma ideia e a constatação
    se ela tem ou não potencial pode tomar anos de uma espera muitas vezes angustiante – e para a qual
    o capital nem sempre é paciente.

    A inovação do agro vive permanentemente esse dilema, que coloca o setor muitas vezes fora dos planos
    dos investidores de risco, habituados com a velocidade das ideações, provas de conceitos e decisões
    dos empreendedores da tecnologia, sobretudo no Vale do Silício.

    Mudar essa lógica está no centro das discussões da liderança da agtech Solinftec, multinacional brasileira
    de tecnologia agrícola e uma das pioneiras globais no lançamento de robôs agrícolas.

    “Hoje em dia, uma nova máquina, um novo químico, uma nova solução, nada na agricultura acontece em
    menos de cinco anos”, afirma ao

    o executivo-chefe global de estratégia da companhia, Léo Carvalho.

    “Nosso objetivo é acelerar o tempo da agricultura”, resume, de forma ambiciosa, os rumos traçados
    para a Solinftec nas recentes reuniões de planejamento realizadas no QG brasileiro da empresa, em
    Araçatuba (SP).

    O que saiu dessas conversas foi não um redirecionamento, mas um aprofundamento da visão da agtech
    liderada por Britaldo Hernandez, hoje posicionada como uma das mais avançadas na robótica voltada
    às operações agrícolas, com seu robô Solix ganhando espaço nas lavouras de Brasil, Estados Unidos
    (onde a empresa também mantém sede e fábrica) e em outros países agrícolas.

    Se com o Solix a companhia tem difundido o conceito de “morar no campo”, graças à capacidade do robô
    de executar tarefas de forma autônoma durante 24 horas por dia, a visão agora é “reaproximar o produtor
    do campo”, transformando seus equipamentos em uma presença digital permanente nas lavouras, com capacidade
    de observação e decisão imediata, como nos tempos em que ele percorria a pé, diariamente, os talhões
    de sua propriedade.

    Nessa visão, o Solix não estará sozinho. O planejamento da Solinftec prevê desenvolvimento e lançamentos
    rápidos de famílias de robôs, capazes de realizar funções de forma superlocalizada, inclusive algumas
    ainda não atendidas por outras máquinas ou equipamentos de automação agrícola.

    Esse movimento deve ser feito em curto prazo e, segundo Carvalho, sem a necessidade de uma transformação
    mais ampla na estrutura produtiva da companhia, hoje com unidades fabris no Brasil, nos EUA, no México
    e na China.

    “Todos os conceitos já estão teoricamente lançados e agora a gente está colocando energia para acelerar
    esse processo”, diz. “Em três anos, no máximo, tudo isso vai ter que estar rodando”.

    Para acelerar o tempo da agricultura e também da indústria, como Carvalho indica, são vários os conceitos
    que estão sendo revistos.

    Ele afirma que, nos últimos três meses, a empresa deu “um passo atrás” para identificar um problema
    que, na sua opinião, limitou a expansão da agricultura de precisão: ela partia da tese de afastar
    o produtor da terra, estimulando-o a tomar decisões a partir de imagens com uma visão espacial de
    sua propriedade.

    “Quando a gente olha uma agricultura mais antiga, sempre via um produtor no campo, sempre via alguém
    mexendo com a terra. Quando se faz esse mesmo cenário hoje em dia, poucas vezes você encontra um produtor
    na terra. E mesmo as máquinas, passam rápido por ela, fazem suas operações, e a gente quase não vê”,
    reflete carvalho.

    “No primeiro momento eles estavam juntos, homem e máquina, mas nós fizemos a retirada dele e o maquinário
    entrou com grande força. Hoje a gente não acha que o produtor vai ficar próximo novamente. A gente
    acha que vão existir tecnologias que vão fazer essa aproximação”.

    Nesse sentido, a Solinftec acredita que é preciso dar outro passo no aperfeiçoamento dessas tecnologias,
    de forma a dar uma real sensação de presença digital do agricultor em campo, mesmo que ele esteja
    bem distante da fazenda.

    De acordo com Carvalho, a atual geração de equipamentos de agricultura digital “cria a falsa sensação
    de que, tendo um equipamento em campo, temos informações necessárias para uma tomada de decisão”.

    “O que acontece é que o produtor começou a tomar decisões a partir de informações pontuais ou históricas,
    mas não com uma análise cotidiana, fruto de sua observação diária da sua produção”, continua.

    Carvalho lembra de ter feito, em uma reunião da Solinftec, um comentário que virou uma piada interna.
    “Eu falei assim: ‘nós estamos tomando decisões de snapshot. A gente pega as 10 últimas fotos, dos
    10 últimos anos, analisa e tem uma certa tendência’. E então prossegui: ‘Snapshot aqui é só para turista
    quando vem para o Brasil, que olha, acha bonito 10 colhedoras colhendo uma do lado da outra e tira
    uma foto. Isso está totalmente errado, não é o conceito que a gente precisa utilizar para a agricultura’”.

    Foi aqui que a ideia de “acelerar o tempo da agricultura”. A proposta da Solinftec é ampliar o uso
    de sensores em máquinas presentes o tempo todo no campo para acompanhar mudanças sutis no desenvolvimento
    das lavouras e, a partir dessas informações em tempo real e permanente, mudar a perspectiva das decisões,
    não só dos agricultores, mas até mesmo das indústrias.

    Como se faz essa aceleração? Léo Carvalho discorre com entusiasmo sobre possibilidades e projetos
    internos que demonstram o potencial do conceito. E faz várias analogias para sustentar sua tese.

    Ele compara, por exemplo, a evolução dos robôs agrícolas com os robôs domésticos, como os aspiradores
    autônomos que se tornaram populares nos últimos anos. Segundo Carvalho, os equipamentos domésticos
    foram, aos poucos, ganhando novas funções, como passar panos ou até mesmo, em alguns modelos, ganharam
    pinças para coletar objetos que estavam em seu trajeto.

    Isso deve acontecer, de acordo com ele, com os robôs agrícolas. Mas só até um certo ponto. Hoje, equipamentos
    como o próprio Solix já são capazes de monitorar as lavouras, fazendo o scout de pragas e pulverizar
    herbicidas de forma localizada, por exemplo.

    “Temos três versões de robô, mas a agricultura como um todo não para por aí. Ela precisa ter outros
    tipos de soluções. E se você começar a empacotar todas as soluções dentro do mesmo robô, ele começa
    a perder um pouco a característica”, diz.

    Assim, a Solinftec acredita que o caminho está no desenvolvimento de diferentes robôs, dentro de uma
    mesma família, com funções complementares e capazes de solucionar problemas atuais de eficiência nas
    operações agrícolas.

    Ele cita, por exemplo, a questão da irrigação em um cenário de escassez hídrica. O uso de pivôs, com
    a dispersão de água sobre grandes áreas em determinados momentos, poderia ser substituído pela irrigação
    localizada por equipamentos que, ao percorrerem um talhão, perceberiam a situação de estresse hídrico
    de uma planta em germinação, indicariam a necessidade de água naquele ponto.

    Os exemplos vão se sucedendo. Carvalho diz que essa mesma lógica poderia ser usada na solução de problemas
    que demandam muitas horas de mão de obra nem sempre eficiente no plantio de eucaliptos ou na identificação
    de soqueiras arrancadas e replantio imediato de canaviais ou.

    “Se a gente tivesse um robô que, além de fazer as funções normais, fizesse o plantio ou o replantio
    de onde tirou a soqueira, de forma barata, eu evitaria o preparo de solo, que é exatamente o que o
    pessoal faz. Ou seja, eu consigo antecipar e reduzir drasticamente a linha do tempo”, explica.

    E geraria economias importantes. Segundo Carvalho, o custo do preparo de solo em uma área representa
    o resultado de cerca de duas safras e meia dessa área. “Se a cana tem um ciclo de cinco safras, ou
    seja, tem dois anos e meio ali para se pagar e apenas dois anos e meio para se lucrar”, analisa.

    “Ou seja, podemos trazer mais um produto para dentro da nossa demanda. Mas provavelmente não é o mesmo
    robô. E aí começam as disseminações do que a gente entende que vão existir, uma família de robôs”.

    Outra possibilidade que entusiasma Carvalho é a introdução dos robôs e seus sensores em processos
    de desenvolvimento de processos agrícolas, atuando como observadores em provas de conceito, ou aos
    produtores que desejam testar um novo produto, em um sistema que ele chama de “teste e erro”.

    “Por que o Vale do Silício é uma potência em termos de tecnologia?”, questiona. E ele mesmo responde:
    “Porque eles têm uma facilidade, primeiro, de captar dinheiro e, segundo, de testar, errar e voltar
    várias vezes. A gente não consegue fazer isso na agricultura”.

    O que a Solinftec tem proposto, inclusive em trabalhos em conjunto com indústrias de insumos como
    Corteva e Syngenta, é o uso dos robôs para monitorar, em espaços curtos de tempo, a ação real de produtos
    aplicados no campo.

    “Quando eu dou a possibilidade para um produtor de soja fazer algumas pequenas aplicações no campo
    e daqui a dois, três dias, passar nesses mesmos lugares e analisar, ver se foi efetivo, ao invés de
    esperar uma safra estamos mudando o tempo da agricultura. Você coloca elementos para que ele tome
    a decisão de forma constante e não de snapshot”.

    Com a indústria de insumos, a ideia é semelhante, incorporando os protocolos de desenvolvimento nos
    robôs e, a partir de informações coletadas pelos sensores, ajudando a acelerar processos.

    “Eu posso dar a elas a fenotipagem, indicar que determinada planta é mais resistente ao calor ou tem
    uma raiz melhor, porque eu estou lá no campo. Nano que vem, com a quantidade de robô que está planejado
    nas vendas, eu vou ter mais imagens, mais informação do que qualquer química no mundo”, diz.

    A Solinftec acredita que a transformação que propõe já está em curso e, como diz Carvalho, “mudando
    a agricultura de alguma maneira”.

    A companhia não acredita em enxames de robôs operando em lavouras, mas na presença de vários robôs,
    cada um capaz de resolver vários problemas.

    “O que a gente está conseguindo fazer é nós estamos nos tornando o centralizador de vários problemas
    com diferentes tipos de robôs”, diz.

    Para ele, a empresa está bem posicionada porque conseguiu superar duas das três etapas importantes
    no processo de aceleração que se propõe a fazer. A primeira é a que chama de manutenção, que é a capacidade
    de desenvolver e colocar no campo produtos associando tecnologias de software e hardware.

    O segundo momento, bastante relevante para a Solinftec, é a questão da autonomia total, de forma a
    permitir que seus produtos “morem no campo”, trabalhando de forma permanente.

    Passo importante para superar esse obstáculo foi o lançamento, tanto na última edição da Agrishow,
    no Brasil, como da Farm Progess, nos Estados Unidos – as duas feiras de tecnologia agrícola mais relevantes
    nos dois principais países agrícolas do mundo – de seu modelo de estação autônoma de abastecimento.

    A terceira etapa é justamente a do desenvolvimento de novos sensores capazes de solucionar problemas
    específicos e, assim, fazer surgirem novos integrantes para suas famílias de robôs. Ele cita, por
    exemplo, que a empresa já possui câmeras térmicas e equipamentos que mensuram a emissão de gases pelas
    plantas.

    Com isso, diz ele, é possível identificar que a planta está passando por estresse antes mesmo de isso
    ser identificado por outros tecnologia. “Aí eu consigo fazer toda a parte de fenotipagem, saber o
    que está acontecendo, saber se tem algum fungo, algum tipo de dificuldade”, explica.

    “Então, são sensores que a gente consegue colocar nas máquinas, o que está fazendo com que a gente
    consiga passar essa nova camada de geração da agricultura. E aí, a escala dos robôs vai mudando também
    de tamanho à medida que você vai agregando funções”.

    Lógica do iPhone

    Hoje a Solinftec já tem protótipos de robôs com porte semelhante ao de máquinas agrícolas. E, com
    a nova visão, incorpora o desafio de diversificar sua linha de produção, sem que isso represente um
    obstáculo para sua estratégia.

    No modelo atual, segundo carvalho, a companhia tem condições de produzir até cinco diferentes versões
    de robôs em suas instalações. Cada fábrica pode produzir até 800 unidades por ano. E a orientação
    é se manter assim.

    O plano, a princípio, não é transformar a Solinftec, que se define como uma empresa de tecnologia,
    em uma montadora de máquinas.

    “A gente vai continuar criando sensores para acoplar nessas máquinas ou criar outras versões, porque
    a gente está constantemente nesse processo”.

    A ideia é que as fábricas próprias se dediquem a produzir os modelos mais recentes, terceirizando
    a produção de equipamentos já devidamente testados e adotados pelo mercado.

    “Se eu pego meu produto hoje, que já é comercial, eu não tenho problema nenhum de juntar esse pacote,
    dar na mão de alguém e deixar alguém fabricar isso para mim”, diz Carvalho.

    Assim, o licenciamento da produção dos robôs deve ser o caminho adotado em um futuro breve pela Solinftec.
    “Uma empresa de tecnologia que se dedica a virar uma montadora, de alguma maneira, vai perder velocidade”.

    O modelo que serve de inspiração para a empresa – cujo CEO, Britaldo Hernandez, é muitas vezes comparado
    internamente a um Steve Jobs do mundo agtech – é o da Apple e seu iPhone, que a cada ano lança uma
    nova versão, incorporando atualizações e novas funcionalidades.

    “Não necessariamente a gente vai entrar nesse caminho de sempre criar novos produtos, mas eu vou criar
    novas soluções dentro do mesmo produto”, resume Carvalho.

    “Isso me dá uma flexibilidade de licenciar a produção para uma montadora. É claro, falando em velocidade,
    eu sempre vou fazer a pré-série, a série, as primeiras vendas para atingir o mercado. Eu sempre vou
    fazer, porque eu tenho um controle na minha mão e eu preciso melhorar meu produto rápido, que é um
    grande diferencial nosso”.

    Carvalho lembra que acelerar o tempo já faz parte da cultura da empresa. Segundo ele, o primeiro robô
    da Solinftec tornou-se um produto comercial há apenas três anos. Hoje, já há cinco diferentes versões
    dele. ”Não existe montadora nenhuma no mundo que consiga fazer o que a gente está tentando fazer.
    É uma lógica de iPhone mesmo”.

