    Solinftec atinge maioridade com R$ 1,3 bilhão captados e de olho em recursos externos

    Com operações e prioridade de crescimento nos Estados Unidos, companhia aposta no dólar em queda e
    nas taxas menores do mercado norte-americano

    A Solinftec, empresa de soluções de inteligência artificial e tecnologias agrícolas, chega à maioridade
    em 2025 no Brasil com planos ousados de crescimento. Após captar R$ 1,3 bilhão em rodadas de investimentos
    e com Certificados de Recebíveis do Agronegócio (CRAs) desde 2016, a companhia olha agora o mercado
    externo de capitais para sustentar seu plano de atuação no exterior.

    Com os juros caminhando para 15% ao ano por aqui e o dinheiro escasso, a Solinftec aposta no dólar
    em queda e nas taxas menores do mercado norte-americano para dar suporte aos planos de expansão nos
    Estados Unidos.

    Fundada em Araçatuba, no interior de São Paulo, a agtech tem uma base no estado americano de Indiana
    e operações crescentes naquele país e elegeu o mercado dos EUA como uma das prioridades de crescimento.

    “Com o dinheiro bastante caro e escasso no Brasil, as operações no exterior ajudam muito na cesta
    de moedas e na possibilidade de investimentos. Uma linha externa é bastante possível de captação e,
    entre os desafios, está ter uma forte participação nos Estados Unidos”, disse Denis Arroyo, vice-presidente
    global da Solinftec, em entrevista a jornalistas nesta terça-feira, 4 de fevereiro.

    O mais recente aporte veio da YvY Capital, fundo de investimento liderado pelo ex-ministro Paulo Guedes
    e pelo ex-presidente do BNDES, Gustavo Montezano, focado na transição para uma economia verde, em
    segurança alimentar sustentável, transição energética e economia de baixo carbono.

    Na rodada, fechada em novembro passado, a Solinftec captou R$ 300 milhões, dos quais R$ 250 milhões
    já foram recebidos, com o restante previsto para o primeiro quadrimestre deste ano.

    A receita recorrente acumulada da companhia - os contratos de operação são de cinco anos - cresceu
    20% em 2024, para R$ 370 milhões, e deve avançar o mesmo porcentual em 2025, para até R$ 450 milhões.
    A carteira acumulada de contratos deve superar R$ 2,5 bilhões este ano, de acordo com projeções da
    Solinftec.

    Criada há 18 anos por pesquisadores cubanos que vieram ao Brasil para a área de cana-de-açúcar e que
    migraram para a indústria, a Solinftec passou a desenvolver computadores de bordo, inteligência artificial
    para máquinas e tratores, soluções de rastreabilidade para produtores. Recentemente, lançou o robô
    autônomo Solix para aplicações nas lavouras

    Presente em 11 países e com soluções para 13 milhões de hectares, a Solinftec tem 60 mil equipamentos
    online. Segundo o diretor de operações da Solinftec, Emerson Crepaldi, 90% do mercado de cana-de-açúcar
    tem soluções da companhia, que chega a 74% no de citros e 20% no de grãos e fibras.

    “Nossa meta no setor de cana é vender novas soluções para clientes já estruturados e crescer dentro
    da base criada”, afirmou o executivo.

    No mercado de grãos e fibras, a companhia monitorou mais de 3 milhões de hectares em 2024. Considerando
    safra e safrinha, a Solinftec já cobre cerca de 8% da área cultivada no Brasil, além de monitorar
    mais de 14 mil máquinas de diversas marcas e 7 mil unidades climáticas em campo.

    A grande aposta da companhia é o Solix. Com 150 unidades espalhadas pelo mundo, principalmente no
    Brasil, o equipamento já deixou de ser tratado como protótipo e a meta da Soilinftec é ter escala
    para chegar a 300 unidades em 2025 e a 700 equipamentos operando em 2026.

    A máquina autônoma integra a plataforma robótica que coleta dados sobre a lavoura e promove aplicações
    localizadas de herbicidas, por exemplo. A companhia aponta a redução de 90% no uso de herbicidas em
    soja e milho e de 65% nas lavouras de cana, 70% a menos do uso de água e um crescimento de 10% a 15%
    na produtividade de grãos.

    Com um investimento de R$ 370 mil, preço de um trator de 80 cavalos, e um incremento de R$ 6 a R$
    7 mil por mês para atualizações, o Solix é tratado pela empresa como um solução de baixo custo e financiável,
    com linhas de 6% a 11% ao ano e com carência de um ano para pagar, de acordo com Crepaldi.

    “A principal receita da Solinftec são as soluções de monitoramento, mas o Solix é um produto novo
    e começa a se tornar carro-chefe na representatividade da empresa”, afirmou o executivo.'
