  conteudo_texto: 'no seu e-mail

    Agrorobótica dispara "raios laser da Nasa" para analisar o solo e gerar créditos de carbono

    Startup paulista, que tem empresa de Marcos Molina e Olavo Setubal Jr. como sócia, utiliza tecnologia
    usada em Marte pela agência espacial americana e acumula gigantes do agro em sua carteira de clientes

    Italo Bertão Filho

    Pesquisadora analisa amostra de solo na plataforma AgLibs, desenvolvida pela Agrorobótica

    Há pouco mais de uma década, em 2012, o robô Curiosity, da agência espacial norte-americana Nasa,
    começou a matar a curiosidade dos humanos sobre o que existe em Marte.

    Com disparos de raio laser, o equipamento analisou os minerais presentes em rochas no planeta vizinho
    à Terra – com resultados até melhores do que os obtidos por aqui.

    Nos últimos anos, uma startup brasileira, a green fintech Agrorobótica, está aplicando a mesma tecnologia
    utilizada pela Nasa para avaliar a quantidade de carbono no campo.

    Com essa abordagem, a empresa garante que é possível mensurar as condições da terra, introduzir técnicas
    agrícolas mais sustentáveis, melhorar a produtividade e, ao final do processo, gerar créditos de carbono
    que foi estocado no território.

    Não à toa, a Agrorobótica chamou a atenção de gigantes como

    e OCP , para citar apenas alguns de seus clientes e parceiros, e agora se prepara para colher sua
    primeira “safra de carbono”.

    O principal foco da Agrorobótica são as multinacionais. A proposta é que essas empresas contratem
    a startup para medir a pegada de carbono de suas propriedades, adotem boas práticas sustentáveis e,
    posteriormente, emitam créditos de carbono com o suporte da Agrorobótica, que seria a emissora dos
    créditos.

    Os lucros obtidos com a comercialização desses créditos seriam divididos entre as companhias e a startup
    em contratos longos, de 20 anos de duração. “É que cada ponto de análise de carbono é válido por 20
    anos”, afirma Fábio Angelis, CEO da startup.

    A empresa foi criada em 2015 por Angelis, que trabalhava como executivo da companhia de insumos Syngenta
    e descobriu a técnica utilizada pela Nasa – Laser Induced Breakdown Spectroscopy – em uma visita de
    campo.

    Em uma apresentação do Simpósio Nacional de Instrumentação Agropecuária (Siagro), da Embrapa Instrumentação,
    de São Carlos, no interior de São Paulo, conheceu o trabalho desenvolvido pela pesquisadora Débora
    Milori, que trabalha com essa técnica há mais de 20 anos e é utilizada também para detectar mercúrio
    em alimentos.

    Angelis ficou impressionado com as possibilidades que a tecnologia poderia trazer e resolveu empreender
    – inicialmente, em paralelo com sua atuação na companhia de insumos.

    “Eu falei: ‘Preciso investir nesse negócio, porque tem um mercado gigante para trabalhar com isso’”,
    afirma.

    Com recursos próprios, Angelis se juntou à Aida Magalhães, que era pesquisadora da Embrapa e futuramente
    passou a ser sócia e CTO da Agrorobótica, fechou contratos de cooperação técnica com a empresa de
    inovação do governo e passou boa parte da década passada trabalhando no desenvolvimento de uma plataforma
    capaz de avaliar o solo com a utilização de raios laser.

    “Todo mundo falava que não dava certo fazer o que nós queríamos com a tecnologia, porque era muito
    inovadora”, recorda o fundador da Agrorobótica.

    Durante anos, a startup operou com recursos próprios de Angelis até que, em 2019, recebeu um aporte
    feito pela firma de investimentos NT@agro, que tem como acionistas

    , fundador e presidente do conselho de administração da Marfrig, e Olavo Setubal Jr., um dos herdeiros
    do banco Itaú, e Antonio Maciel Neto, ex-CEO de empresas como Ford,

    , Caoa/Hyundai e Grupo Itamarati.

    Angelis prefere não revelar o valor do aporte. De acordo com o site da NT@agro, 22,5% do capital social
    da Agrorobótica ficou com a empresa de investimentos.

    Dessa forma, a startup conseguiu acelerar seu processo de criação da plataforma, batizada de AgLibs,
    lançada em parceria com a Embrapa em 2023.

    Todo o processo começa com a avaliação dos dados da propriedade. A Agrorobótica verifica se a fazenda
    está em conformidade socioambiental, utilizando dados do Cadastro Ambiental Rural (CAR), mapeia o
    território para a marcação dos pontos onde o solo vai ser coletado, e vai a campo para pegar as amostras,
    cuja localização já está georreferenciada.

    As amostras, segundo Angelis, seguem então para o laboratório fotônico da Agrorobótica, instalado
    em São Carlos, no interior de São Paulo, no formato de “pastilhas”, que são inseridas na plataforma
    AgLibs.

    Com apenas um disparo de raio laser, a ferramenta analisa 23 parâmetros dessas “pastilhas” avaliando
    fatores como textura, densidade do solo, nível de PH e macronutrientes.

    A diferença entre esse processo da Agrorobótica e um convencional, feito por laboratórios químicos,
    está no tempo de análise, segundo Angelis.

    “Em 20 segundos, nós fazemos o que um laboratório químico convencional, pode demorar até 20 dias para
    fazer”, afirma o fundador da Agrorobótica, que diz conseguir fazer até 1,2 mil análises de solo. “Isso
    nos dá um poder analítico muito grande.”

    Feita a análise, a Agrorobótica dá orientações agronômicas para a inserção de agricultura regenerativa
    no campo, que envolve possibilidades como a adoção de plantio direto, fertilizantes orgânicos, bioinsumos
    e piqueteamento para o gado.

    “Quando você mede o estoque de carbono de um pasto degradado, ele tem 50 toneladas de carbono por
    hectare. Quando você coloca agricultura regenerativa, ao longo de 10 anos, você pode chegar a mais
    de 100 toneladas, porque aumenta a quantidade de carbono no solo”, afirma Angelis.

    Ao longo do tempo, a Agrorobótica retorna às propriedades para verificar se houve mudanças no solo
    para verificar novamente os dados na plataforma e poder compará-los.

    A startup planeja transformar essas informações em créditos de carbono para comercialização no mercado
    voluntário, respaldada por um nome de peso: a Verra, uma das maiores certificadoras de créditos de
    carbono do mundo, que já aprovou a tecnologia para esse fim. Essa chancela é fundamental para viabilizar
    a emissão dos créditos.

    Hoje presente em 18 estados do Brasil em propriedades de culturas como soja, milho, café, citrus algodão,
    a Agrorobótica ainda não gerou créditos de carbono para seus clientes, mas Angelis pretende iniciar
    esse processo nos próximos anos.

    A startup vai receber uma porcentagem do valor negociado em cada transação de créditos de carbono.
    “A maior parte do recurso fica para o agricultor, porque o conceito do crédito carbono é ele usar
    esse recurso para adotar as boas práticas agrícolas”, afirma Angelis.

    Essa é uma das fontes de receita da startup, que também ganha com a venda de serviços de avaliação
    do solo e com a implantação dos projetos de carbono.

    Com a tecnologia já avançada, Angelis diz que gostaria de abrir uma nova rodada de investimentos entre
    este ano e 2026 para expandir o negócio.

    “Nós temos que expandir a tecnologia para todo o território nacional. Hoje, a gente só tem um centro
    em São Carlos, mas criamos um negócio que é como se fosse um McDonalds. Precisamos de, no mínimo,
    um centro em cada Estado”, afirma o fundador da Agrorobótica. “Mas precisamos de recurso para isso.”

    Análise de solo,

    Antonio Maciel Neto,

    Créditos de carbono,

    Olavo Setubal Jr.,'
