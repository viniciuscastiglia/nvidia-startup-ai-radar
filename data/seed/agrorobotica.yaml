    , dedicado a aplicações de IA alinhadas com vocações estratégicas da economia brasileira – neste caso,
    o agro. Os recursos para o aporte vieram por dois caminhos: o novo fundo flagship da gestora e o BB
    Impacto I, o CVC do

    Banco do Brasil

    gerido pela própria

    .

    Com o investimento, o plano da agtech é expandir a penetração no mercado de sua plataforma AGLIBS,
    tecnologia patenteada pela

    em parceria com a

    e que combina IA com espectroscopia a laser para fazer a análise do solo.

    Além disso, a entrada do CVC do

    Banco do Brasil

    no deal também tem uma função importante: com capilaridade junto ao agronegócio nacional, o banco
    pode ampliar a adoção da plataforma AGLIBS junto a produtores rurais que já são clientes da instituição.

    Fundada em 2015 e incubada na

    nasceu da pesquisa aplicada em espectroscopia e física do solo, que adapta tecnologias originalmente
    utilizadas pela Nasa em suas sondas de exploração em Marte.

    Utilizando raios laser, em combinação com uma IA treinada para entregar análises completas até 60
    centímetros de profundidade, a tecnologia da agtech entrega recomendações agronômicas imediatas sobre
    fertilização e manejo do solo.

    Pela plataforma da agtech, todo o processo é feito em 20 segundos – um salto gigante em relação ao
    modelo tradicional, em que as amostras são enviadas a um laboratório, e o resultado leva até 20 dias
    para sair. “Na prática, o produtor reduz desperdício de insumos, melhora a produtividade por hectare
    e vê resultado já no ciclo seguinte”, destacou a agtech, em nota.

    Além disso, segundo destaca a

    , a mesma infraestrutura de dados que orienta o manejo do solo também mensura, reporta e certifica
    o carbono presente nele, gerando produtividade e receita adicional via créditos de carbono.

    “A Agrorobótica resolve um problema direto de rentabilidade do produtor e, ao mesmo tempo, cria a
    infraestrutura para uma nova economia baseada no carbono do solo”, afirma Lívia Brando, Sócia e Diretora
    de Investimentos da

    . “É exatamente o tipo de solução que buscamos: tecnologia proprietária, impacto climático mensurável
    e um modelo de negócio escalável ancorado em eficiência econômica.”

    “Com a nossa tecnologia, o produtor preserva e produz e ainda é remunerado por isso. Esse investimento
    é um reconhecimento de que é possível construir um negócio lucrativo e, ao mesmo tempo, contribuir
    diretamente para as metas climáticas”, completa Fábio Angelis, fundador e CEO da

    .

    O movimento chega em um momento favorável. O Brasil tem meta de recuperar 40 milhões de hectares de
    pastagens degradadas na próxima década, e a política industrial do país prioriza IA aplicada à indústria
    como eixo de competitividade. Para a

    , o caminho é se tornar uma das principais infraestruturas de dados e carbono para o agronegócio nacional,
    com certificação internacional para inserção no mercado global de créditos.'
