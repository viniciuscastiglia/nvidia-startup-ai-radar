  nota: |-
    MATURIDADE BAIXA apesar de AI-native forte: os documentos falam em "modelos preditivos",
    "algoritmos" e "tecnologia proprietária", mas não citam uma linha de infraestrutura — nada de
    self-hosting, quantização, serving ou avaliação. O eixo 2 mede profundidade de INFRAESTRUTURA;
    "usamos modelos preditivos" é uso de IA, que é o eixo 1. Quadrante esperado: sweet-spot.

    CONFIANÇA ALTA: três tipos de documento (site, notícia, blog) e a notícia é de 04/2026,
    dentro da janela de 24 meses da regra 3.

    AS TRÊS DORES PROIBIDAS SÃO FALSOS POSITIVOS DO CASADOR DE SUBSTRING, e é por isso que
    estão nomeadas em vez de omitidas:
      · `observabilidade` dispara em "monitoramento contínuo" e "employee health dashboards" —
        monitoramento de PACIENTE, não observabilidade de sistema de IA;
      · `dependencia_fornecedor` dispara em "integração com parceiros da cadeia assistencial" —
        o gatilho é "integração com", e aqui o complemento é um parceiro clínico, não uma API;
      · `privacidade` não tem nenhum gatilho no texto (nem "lgpd", nem "dados sensíveis", nem
        "prontuário"); se sair, saiu do nada.

    AS AMBÍGUAS SÃO AMBÍGUAS DE VERDADE, e registrá-las assim é mais honesto que forçar um lado:
    "atuando em tempo real" é equipe clínica, não latência de inferência, mas "analisá-los com
    velocidade faz uma diferença enorme em saúde" chega perto; "aplica governança real" é
    governança de saúde populacional; "Validação e próximos passos" é cabeçalho de seção.
