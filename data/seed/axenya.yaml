- tipo: noticia
  titulo: Após captar US$ 12M, Axenya avança em tecnologia e mira 500 mil vidas em 2026
  url_fonte: https://startups.com.br/negocios/apos-captar-us-12m-axenya-avanca-em-tecnologia-e-mira-500-mil-vidas-em-2026/
  data_publicacao: '2026-04-10'
  conteudo_texto: |-
    Após captar US$ 12M, Axenya avança em tecnologia e mira 500 mil vidas em 2026
    Startup de saúde corporativa aposta em IA e modelos preditivos para reduzir sinistralidade, economizar custos e escalar a base de clientes
    Gabriela Del Carmen
    Copiar Link?
    Mariano García-Valiño, fundador e CEO da Axenya | Crédito: Divulgação
    entrou em uma nova fase de crescimento. Após captar US$ 12 milhões em 2025, a startup de saúde corporativa acelera o desenvolvimento tecnológico e a expansão comercial com uma meta ambiciosa: quintuplicar sua base para 500 mil vidas sob gestão e atingir R$ 16 milhões em faturamento ao longo de 2026.
    Fundada em 2020, a companhia desenvolveu um sistema de gestão contínua da saúde dos colaboradores baseado em modelos preditivos. Com tecnologia proprietária orientada por dados e inteligência artificial, a plataforma cruza informações clínicas, históricas e comportamentais para identificar a propensão a doenças crônicas antes que elas evoluam e passem a pressionar os custos dos planos de saúde.
    “A habilidade de capturar dados de forma remota e analisá-los com velocidade faz uma diferença enorme em saúde”, afirma Mariano García-Valiño, fundador e CEO da
    . Segundo o executivo, a startup já gerou R$ 13 milhões em economia para empresas clientes, com uma redução de 76% na sinistralidade ao antecipar potenciais condições de saúde.
    Esse avanço acontece em um contexto de pressão crescente sobre os custos corporativos. Dados da Associação Brasileira de Recursos Humanos mostram que, em 2025, 28% das empresas registraram aumentos superiores a 20% nos gastos com planos de saúde – mais que o triplo dos 8% observados em 2020. No período, apenas 15% conseguiram manter reajustes abaixo de 5%.
    Para Mariano, as doenças crônicas estão no centro desse problema. “Elas respondem por 85% dos custos de saúde e, por evoluírem sem sintomas evidentes, acabam chegando tarde ao sistema. A informação para tratar o paciente existe, mas não está acessível no momento certo”, diz.
    atende mais de 200 empresas, conectando organizações, colaboradores e operadoras em um único ambiente. O crescimento da base, segundo o CEO, também retroalimenta o negócio: quanto maior o volume de dados, mais precisos se tornam os modelos preditivos.
    Modelo de negócio
    O desenho atual da operação levou cerca de três anos para ser estruturado. Atualmente, a
    combina uma taxa fixa de uso da plataforma com uma taxa de sucesso atrelada à redução da sinistralidade dos clientes.
    A proposta, segundo Mariano, é inverter a lógica tradicional do mercado. “Grande parte das corretoras cobra um percentual sobre o valor total gasto com o plano de saúde”, diz. Nesse modelo, quanto maior o custo do plano, maior também a remuneração da corretora – o que desincentiva a redução dessas despesas. “Aqui, nossa remuneração cresce quando o cliente gasta menos”, afirma.
    Embora atenda empresas de diferentes portes, o modelo tende a gerar mais impacto em populações acima de mil vidas, onde a base estatística é mais robusta e os ganhos são mais evidentes.
    Validação e próximos passos
    A rodada de US$ 12 milhões, anunciada em agosto de 2025 e liderada por
    , acelerou a estratégia de crescimento da startup. Os recursos foram direcionados à evolução da plataforma, ao aprimoramento dos modelos de dados e à expansão da operação comercial. A estratégia incluiu a integração com parceiros da cadeia assistencial e expansão da atuação junto a empresa
