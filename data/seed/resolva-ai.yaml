  titulo: 'Resolva AI: agente de IA liga para call centers a mando do consumidor'
  url_fonte: https://www.mobiletime.com.br/noticias/19/05/2025/resolva-ai/
  data_publicacao: null
  conteudo_texto: 'Resolva AI: agente de IA liga para call centers a mando do consumidor

    Fernando Paiva | 19/05/25 19:31

    Depois da onda nos últimos anos de robôs de conversação criados por empresas para atender seus clientes,
    agora acontece o inverso. São os consumidores que vão utilizar

    agentes de inteligência artificial

    para ligar a seu mando para os call centers das empresas e resolver seus problemas. Essa é a proposta
    da startup brasileira Resolva AI. Ela criou um agente de IA, o Rê, que liga e conversa com atendentes
    de call center para resolver problemas a pedido dos consumidores.

    Seu foco inicial é o setor de telecomunicações – mais especificamente as grandes operadoras Claro,
    Oi, TIM e Vivo. Em apenas quatro meses, o Rê conseguiu resolver 5 mil solicitações, e está com taxa
    de resolução de 87%. Dentro de quatro meses, a empresa espera atuar com outros setores, como aviação
    civil, bancário/financeiro, utilities etc. E um detalhe importante: o serviço é gratuito para o consumidor
    final.

    “Escolhemos começar por telecom porque tem muitos tíquetes diariamente e de assuntos diversos, desde
    cobrança indevida e recuperação de crédito, até problema de sinal. Trabalhar essa variedade de assuntos
    é importante para validar a

    solução”, justifica Vicente Camillo, CEO e cofundador da Resolva AI, em conversa com Mobile Time.

    Como funciona a Resolva AI?

    A jornada do consumidor começa pelo

    site da Resolva AI

    , aonde ele se identifica fornecendo alguns dados pessoais necessários para que o agente atue a seu
    mando, como nome completo, CPF, data de nascimento, email e telefone. Também é preciso aceitar os
    termos do serviço e declarar que todos os dados cadastrados são verídicos.

    O passo seguinte é informar a operadora e confirmar o número telefônico para o qual deseja atendimento.
    O agente pergunta se o cliente já tentou contato com a operadora para tratar do assunto – em caso
    positivo, é solicitado o número de protocolo. Depois, o consumidor informa como contratou o serviço
    e qual é o problema que deseja resolver com a operadora. O agente apresenta uma lista de opções mais
    comuns, como troca de plano, cobrança indevida ou cancelamento de linha, mas também é possível escrever
    livremente o caso.

    Depois, o agente se encarrega de ligar para o call center da operadora. Ele se identifica como um
    representante do consumidor em questão e confirma todos os dados solicitados. O Rê consegue passar
    pelas URAs, aguardar ouvindo música e, claro, falar efetivamente com um atendente humano.

    “Uma das maiores dificuldades foi o agente entender que a musiquinha era parte da ligação. Outras
    dificuldades que enfrentamos foi digitar o menu numérico da URA e manter o contexto em conversas mais
    longas, com mais de 10 minutos de duração. A manutenção do contexto implica em o agente não esquecer
    o que falou 10 minutos atrás”, relata Camillo.

    Vicente Camillo, CEO e cofundador do Resolva AI (Crédito: Elias Aftim)

    A ligação para o call center é gravada pela Resolva AI e disponibilizada depois para o consumidor,
    pelo site do serviço, junto com um resumo do que foi feito. Se a operadora não resolver o problema,
    o Resolva AI se encarrega de abrir uma reclamação em nome do cliente no portal Consumidor.gov, entregando
    a documentação completa sobre o caso. O Resolva AI segue acompanhando o assunto e, se necessário,
    pode até elaborar uma pré-petição para o consumidor levar à Justiça.

    A Resolva AI construiu uma solução que combina diversos LLMs, incluindo de Anthropic, Meta e OpenAI,
    assim como diferentes ferramentas de text to speech e speech to text, de fornecedores como Google
    e ElevenLabs. Também foram adotadas técnicas de fine tuning para aprimorar a qualidade do agente.
    Um banco de dados proprietário está sendo construído para diminuir a necessidade de consulta aos modelos
    externos de LLM.

    “Pegamos várias bases públicas de problemas que envolvem consumidores e fizemos a qualificação, segregando
    por assunto, empresa e mercado. Trabalhamos com fine tuning e RAG. Hoje temos base vetorizada grande
    e agora temos dados proprietários com reinforcement learning, o que reduz a necessidade de chamar
    o modelo toda hora. Chamamos somente em situações específicas, não na abertura de todo e qualquer
    tíquete”, explica.

    A monetização da Resolva AI vem através da oferta da sua solução para empresas, no atendimento aos
    seus clientes. Ou seja, no futuro, possivelmente um problema será resolvido com agentes da Resolva
    AI nas duas pontas: representando o consumidor e a empresa.

    A primeira aplicação da solução para empresas está acontecendo no setor de cobranças com o grupo Liftcred.
    O agente atua em canais de áudio, como WhatsApp e telefone, tanto no recebimento de um contato quanto
    na realização de ligações para renegociação de dívidas. Ele valida se está falando com a pessoa certa,
    consulta o CRM e depois faz uma proposta para pagamento da dívida. Caso o cliente não aceite a oferta
    inicial, o agente faz contas em tempo real e pode ajustar a proposta, dentro de parâmetros pré-estabelecidos.
    Toda a conversa acontece em linguagem natural. No fim, é enviado um link para pagamento dentro do
    que foi acordado.

    As taxas de conversão, que eram de 3% a 4% com atendentes humanos, agora estão em torno de 8%, e Camillo
    acredita que seja possível chegar perto de 15%.

    A Resolva AI cobra em cima do sucesso. Quanto mais resolve, mais recebe. E o custo é até 70% mais
    barato do que seria com uma PA tradicional de call center, afirma o executivo.

    Super Bots Experience

