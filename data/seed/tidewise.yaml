  conteudo_texto: 'Deeptech carioca de barcos autônomos inicia operação na Bélgica

    TideWise planeja acelerar o crescimento na Europa com nova rodada de investimentos aberta, além de
    ampliar frota no Brasil



    USV Tupan é a embarcação autônoma carro-chefe da TideWise | Foto: Divulgação

    , deeptech de embarcações autônomas com sede no Rio de Janeiro, está mirando o mercado internacional
    para crescer. A startup, que atualmente desenvolve soluções para os segmentos de defesa e offshore,
    deu início à sua operação na Bélgica e enxerga o país como uma porta de entrada para o continente
    europeu.

    Fundada em 2019 pelo engenheiro naval Rafael Coelho (CEO) e o especialista em robótica e engenheiro
    de software Sylvain Joyeux (CTO), que é francês, a

    atua no desenvolvimento de ecossistemas marítimos autônomos e não tripulados, os chamados Uncrewed
    Surface Vehicles (USVs).

    O carro-chefe da startup é o USV Tupan, primeira embarcação desse tipo registrada e autorizada para
    operação no Brasil pela Marinha. O barco possui um software próprio da

    e é comandado à distância a partir do Centro de Operações Remotas (ROC) desenvolvido pela empresa.

    A entrada no mercado europeu acontece em um momento de expansão da companhia, que vem mantendo uma
    trajetória de praticamente dobrar o faturamento a cada ano desde 2023. Para 2026, a expectativa é
    manter esse ritmo. Com a internacionalização, a ideia é acelerar ainda mais esse crescimento.

    Segundo Rafael Coelho, CEO e cofundador da

    , a startup já tem um primeiro contrato na Bélgica, onde também abriu um escritório, e pretende usar
    o país como base para avançar em outros mercados da região, como Alemanha e França.

    “A Bélgica é o hub para a Europa, que para nós que somos brasileiros é muito pequena, né? Depois da
    Europa, o objetivo é o Oriente Médio e também a Malásia e a Austrália. Estamos avaliando os dois mercados
    e já estivemos nos dois para mapear oportunidades. Uma das formas de entrar nesses mercados pode ser
    por meio da aquisição de empresas locais”, afirma o fundador.

    Para avançar nesses planos, a startup está com uma rodada de investimentos aberta. Além de financiar
    a escalada na Bélgica, o objetivo da captação é também ampliar a frota de embarcações no Brasil, mercado
    onde a

    já atendeu a grandes empresas do setor de energia, como

    , além da própria Marinha.

    deve chegar a cerca de R$ 30 milhões de faturamento em 2026, com a receita já contratada, e encerrar
    o ano com aproximadamente 63 funcionários – acima da estimativa inicial para 2026.

    Mercado em expansão

    Dados da consultoria Fortune Business Insights mostram que o mercado global de embarcações autônomas
    movimentou US$ 5,2 bilhões em 2022 e pode chegar a US$ 9,9 bilhões em 2030, um crescimento de 90%.
    Esse cenário se soma a uma indústria de apoio marítimo também em expansão, explica Rafael.

    “A indústria de apoio marítimo está crescendo muito e a frota de embarcações de apoio não está acompanhando,
    no mundo. Há muito tempo que não se constroem navios novos. Então vai começar um desequilíbrio entre
    a oferta e a demanda, que vai puxar o preço das embarcações para cima. É por isso que empresas como
    Petrobras e Shell investem na gente para desenvolver tecnologias capazes de operar em águas profundas.
    É muito mais rápido fazer uma embarcação de pequeno porte, até 24 metros, e também muito mais barato”,
    explica o CEO da

    .

    Para as companhias que atuam no segmento offshore, as embarcações autônomas representam uma economia
    de 30% a 40%, estima Rafael. Segundo ele, um USV de cerca de 19 metros pode substituir uma embarcação
    de aproximadamente 60 metros, o que resulta em economia de combustível, além da própria tripulação.
    Outra vantagem é a redução na emissão de carbono, contribuindo para as metas de sustentabilidade das
    companhias.

    Para além de energia e defesa, a empresa vê oportunidades em novos mercados. Uma delas é a logística
    marítima, combinando embarcações autônomas e drones para transportar cargas de uma embarcação maior
    até plataformas ou outros pontos sem que o navio precise interromper sua operação. A ideia é atender
    desde o transporte de pequenas encomendas até o envio de peças críticas para instalações offshore,
    por exemplo.

    também pretende avançar na transição energética de sua própria frota. A empresa avalia um projeto
    para desenvolver propulsão híbrida a etanol, em uma adaptação da tecnologia ao mercado brasileiro.
    “O resto do mundo está indo para amônia, hidrogênio, mas a gente está no Brasil e, no Brasil, o etanol
    é o melhor caminho para redução de carbono”, aponta Rafael.

    Desde a sua fundação, a

    já levantou cerca de R$ 15 milhões em rodadas de investimento. Entre elas, um

    aporte de R$ 10 milhões

    , por meio do fundo MultiCorp 2, que conta com

    Embraer, BB Seguros, Baterias Moura e AgeRio

    como cotistas.'
