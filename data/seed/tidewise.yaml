  conteudo_texto: 'Tidewise capta R$ 10M com seus robôs autônomos para a indústria marítima

    Startup desenvolve, integra e opera sistemas robóticos inteligentes para solucionar demandas da indústria
    naval

    Gabriela Del Carmen



    Tidewise (Foto: Divulgação)

    , empresa carioca que oferece

    soluções de tecnologia para o mercado de serviços navais

    , acaba de anunciar que recebeu um aporte de R$ 10 milhões. O investimento foi liderado pela gestora

    , por meio de seu fundo MultiCorp 2, que conta com

    Embraer, BB Seguros, Baterias Moura e AgeRio

    como investidores.

    Fundada por Rafael Coelho e Sylvain Joyeux, a

    desenvolve, integra e opera sistemas robóticos inteligentes para solucionar demandas da indústria
    naval nos contextos fluvial, portuário ou marítimo. Com a missão de acelerar a transição para uma
    indústria mais segura e sustentável, alinhando tecnologia ao aumento da segurança e à redução dos
    custos e impactos ambientais, a empresa começou a operar em 2020 e, desde então, prestou serviços
    para corporações como

    Repsol Sinopec Brasil

    , e para a companhia de distribuição elétrica

    , na Bélgica.

    “Deeptechs costumam ter dificuldade para captar com fundos de venture capital no Brasil, e a Tidewise
    é uma empresa que tem necessidade de capital maior do que uma startup 100% digital, porque constrói
    hardwares”, afirma Rafael. Segundo o executivo, a startup ainda não estava com uma rodada de investimentos
    aberta, mas avançou nas conversas com a MSW pela oportunidade de negócio e parceria com os cotistas
    do fundo. “A Embraer nos abordou em um momento em que ainda estávamos nos organizando para captar.
    Vimos que era uma ótima oportunidade não só pelo dinheiro, mas pelo smart money envolvido”, pontua.

    A sinergia com os investidores do MultiCorp 2 é, justamente, um dos critérios para a

    avaliar a possibilidade de investimento em uma startup. “A proposta da Tidewise está muito alinhada
    com a Embraer e Baterias Moura. A empresa também terá o apoio do BB Seguros na parte de seguros para
    as embarcações e, por estar no Rio de Janeiro, contará com o suporte da AgeRio na região. Essas sinergias
    são interessantes para ajudar a impulsionar o negócio”, observa Richard Zeiger, sócio da

    .

    O executivo destaca outros fatores que atraíram os investidores. “O mercado de soluções autônomas
    para serviços marítimos ainda é incipiente, mas está crescendo e se transformando por causa da inovação.
    Além disso, a Tidewise possui um time de primeira linha, que vieram dessa indústria e estão preparados
    para endereçar as necessidades do mercado”, explica. O fundo MSW MultiCorp 2 foi lançado em meados
    de 2022

    para investir R$ 100 milhões em negócios de inovação nos próximos 5 anos

    . Apenas em 2023, o veículo já aportou recursos na

    , além da

    .

    Potencial de mercado

    Com mais de R$ 30 milhões investidos em pesquisa e desenvolvimento de novos produtos e serviços, a

    criou a primeira embarcação não tripulada a ser registrada na Marinha do Brasil, o USV Tupan, e pode
    servir a diversos mercados como portuário, energia offshore e logística em geral. A startup contribui
    para a redução do impacto ambiental ao consumir 98% a menos de combustível do que a operação convencional.

    Com os recursos captados, a companhia pretende aumentar sua capacidade industrial, escalar a frota
    e estruturar um time de operações para atender toda a costa do Brasil, expandindo para além do Rio
    de Janeiro. “No próximo ano, já estaremos operando em toda a costa brasileira e atuando no mercado
    de defesa, que tem crescido muito. Além disso, vamos começar a fazer provas de conceito (POCs) na
    América do Sul, embora o foco seja acelerar a operação brasileira e fechar contratos de longo prazo
    com os clientes já estabelecidos”, diz Rafael.

    A startup se consolida em um momento estratégico no país.

    De acordo com o Ministério de Minas e Energia

    , o  mercado nacional de energia eólica possui mais de 26 gigawatts (GW) de capacidade instalada,
    em mais de 900 parques eólicos distribuídos pelo país. Isso representa mais de R$ 200 bilhões investidos
    na última década. Considerando apenas o mercado de eólicas offshore (que demandará serviços de empresas
    como a TideWise), o Brasil reúne mais de 80 projetos anunciados, que somam mais de 200 GW de capacidade
    instalada prevista.'
