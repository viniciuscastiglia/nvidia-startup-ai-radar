  conteudo_texto: 'Deep tech Automni levanta R$ 5,5 mi com seus robôs inteligentes

    Startup transforma paleteiras e empilhadeiras em robôs móveis autônomos que funcionam por inteligência
    artificial

    Gabriela Del Carmen



    , deep tech que desenvolve soluções logísticas com robôs e sistemas inteligentes para empresas, captou
    R$ 5,5 milhões em um coinvestimento entre a gestora

    , por meio do fundo MultiCorp 2, e da empresa de locação de equipamentos

    .

    Fundada em 2014, a startup transforma paleteiras e empilhadeiras comuns em robôs móveis autônomos
    que funcionam por inteligência artificial. A solução pode ser integrada aos sistemas de gerenciamento
    de armazém (WMS) e de gestão empresarial (ERP) para prover mais eficiência e segurança às operações.
    Com clientes como

    Nestlé, Danone, Unilever e DHL

    , a companhia oferece um sistema integrado para centros de distribuição e fábricas que manuseiam os
    materiais por meio dos veículos e robôs autônomos.

    Segundo André Abrami, fundador da

    , a startup não tem concorrentes diretos no Brasil, e apenas uns 4 rivais a nível global. “Nosso diferencial
    é ser um provedor de logística. Trazemos o serviço como um todo para o cliente e os robôs fazem parte
    dessa solução completa. Os concorrentes são simplesmente provedores de robô e os clientes precisam
    ter um integrador ou um conhecimento profundo para conseguir automatizar o processo”, afirma o executivo,
    em entrevista ao

    .

    A expectativa é usar o dinheiro do aporte para se consolidar como referência no mercado de veículos
    autônomos para logística interna no Brasil. O plano é aprimorar produto, tecnologia e operação, além
    de estruturar o time comercial e escalar as vendas. A equipe, hoje de 30 pessoas, deve crescer cerca
    de 30% até o fim do ano. Sem abrir números específicos, André revela que a startup deve dobrar o faturamento
    em 2023.

    tem sede em São Paulo e, por enquanto, está focada em atender a região Sudeste. No entanto, isso não
    significa que ela não irá se expandir para outra região caso surjam clientes ou projetos grandes.
    André afirma que, inclusive, já há conversas para internacionalizar o negócio e levá-lo aos Estados
    Unidos – algo que deve acontecer no médio prazo.

    Em pé: André Abrami e Henrique Nery, co-fundadores da Automni.

    Agachados: Moises Swirski, sócio-fundador da MSW, e Luis Felipe Savoy, CEO da Viaduto (Foto: Divulgação)

    De mãos dadas com os investidores

    O aporte na deeptech é o primeiro feito pelo

    fundo MultiCorp 2, da

    . A gestora especializada em Corporate Venture Capital anunciou o veículo em junho de 2022 com R$
    100 milhões para impulsionar negócios de inovação nos próximos 5 anos. O fundo tem como investidoras
    as empresas

    Moura Baterias, BB Seguros, Embraer e AgeRio

    .

    O foco do MultiCorp 2 são empresas que estejam captando rounds seed e série A e tenham sinergia com
    o perfil dos investidores, principalmente negócios de base tecnológica com soluções para os mercados
    de energia e seguros. No caso da

    , a solução foi atraente por combinar logística interna com veículos elétricos e desenvolvimento de
    veículos de transporte com funcionamento autônomo, verticais que fazem parte dos ecossistemas de inovação
    aberta da

    .

    “A Embraer é uma empresa global de mobilidade e logística, com inteligência artificial e automação.
    Há grandes possibilidades de smart capital com a

    . Além disso, os equipamentos da startup estão relacionados com mobilidade elétrica e baterias, que
    fazem parte da tese da

    ”, explica Moises Swirski, sócio-fundador da

    .

    A rodada foi acompanhada pela Viaduto, empresa da

    especializada em soluções logísticas de movimentação de cargas. “Nossa curiosidade de conhecer a

    veio do próprio mercado, que começou a falar bem sobre ela. Há 8 anos, a indústria 4.0 tinha raríssimas
    soluções de veículos autônomos robotizados. Até hoje, poucas empresas conseguem de fato implantar
    e manter esses serviços”, diz Luis Felipe Savoy, CEO da

    .

    O fundador da

    ressalta a importância do smart money dos investidores. “A

    tem contato com várias startups e pode oferecer insights sobre o que está ou não dando certo nas empresas
    do portfólio. Ela tem contato com outros fundos e pode nos ajudar a captar futuras rodadas, além de
    proporcionar uma forte sinergia com os cotistas

    . Já a

    é nossa parceira comercial, tem uma estrutura forte de estoque, manutenção e serve como um canal de
    captação para novos clientes”, diz André.

    Segundo André, o sucesso da captação está atrelado, entre outros motivos, ao relacionamento de longo
    prazo com os investidores. “Está bem difícil captar nesse momento, principalmente sem relacionamento
    prévio e alto grau de confiança. Outros grandes fundos não mostraram interesse na rodada. No caso
    da

    , já estávamos em contato há pelo menos 1 ano, o que foi fundamental”, conclui.'
