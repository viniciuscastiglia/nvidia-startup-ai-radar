  conteudo_texto: 'Liqi lança stablecoin em reais “com pedigree”

    Liqi tem como investidores Itaú, Pátria e Galápagos e acredita que respaldo ajudará a conquistar empresas
    com primeiros casos de uso



    Daniel Coquieri, fundador da Liqi | Foto: Divulgação

    A fintech de ativos digitais

    entrou na onda das stablecoins e colocou no mercado a sua própria moeda, a BRLD. Atrelada ao real,
    a moeda tem lastro em títulos do Tesouro Direto, e não estará listada em nenhuma plataforma. Sua aplicação
    inicial será direcionada ao público corporativo. Os dois primeiros casos de uso são tesouraria e gestão
    de caixa e o suporte a operações tokenizadas.

    De acordo com Daniel Coquieri, fundador da

    , o plano é avaliar novas aplicações da moeda a partir do segundo semestre. A BRLD foi construída
    com base na BRLT, uma stablecoin desenvolvida há quatro anos pela

    para uso interno em suas operações de tokenização.

    O mercado de stablecoins vem ganhando atenção principalmente depois do Genius Act do governo dos EUA.
    Com a regulação, as moedas digitais ganharam legitimidade e passaram a ser avaliadas de outra forma
    pelo mercado financeiro.

    Em 2025, o movimento global de stablecoins chegou a US$ 300 bilhões, segundo estudo da

    . A maior parte desse montante circulou em moedas atreladas ao dólar, o que exige conversões constantes
    e adiciona custos e complexidade ao processo.

    O Brasil já tem stablecoins em real como BRZ (

    ), BRL1 (

    ), BRLV (

    ) e a

    ). Mas, na avaliação de Daniel, faltava uma opção “com pedigree”. O fundador se refere ao fato de
    a

    ter como investidores nomes como o banco

    , as gestoras

    . “Não é a stablecoin do Daniel, E isso é muito importante”, pontua.

    Segundo ele, partiu dos próprios investidores a provocação para colocar a stablecoin no mercado. O
    pedido veio em uma reunião de conselho realizada no fim de 2025. “Tem muita coisa que faz sentido.
    Temos um ecossistema. E os sócios também podem se beneficiar”, avalia. O fundador diz acreditar em
    um cenário em que várias moedas vão existir. Cada uma voltada a aplicações diferentes do mercado.

    Casos de uso

    No caso da BRLD, os usos iniciais estão ligados a demandas corporativas. O primeiro é a gestão de
    tesouraria, que oferece às empresas uma opção de gestão de caixa de curto prazo com rendimento de
    95% do CDI e negociação a qualquer momento (24/7). As operações não pagam IOF porque estão vinculadas
    a títulos do Tesouro com prazo superior a 30 dias. Mas estão sujeitas a tributação de IR como qualquer
    outras.

    Daniel cita como exemplo a revendedora de carros usados Kavak, que muitas vezes “dorme” com dinheiro
    de negociações parado no caixa porque os recebimentos acontecem fora do expediente bancário. Com a
    BRLD, esses recursos não precisam ficar parados.

    O produto está disponível para as 75 empresas que já têm relacionamento ativo com a

    e pode ser acessado por outras empresas que se cadastrarem no site da companhia e forem aprovadas
    no processo de avaliação.

    Na outra aplicação, a BRLD entra como a estrutura atrelada a contratos feitos na blockchain.  na blockchain.
    A vantagem aqui é usar os recursos de

    , como e execução automática, e o conceito de “dinheiro carimbado”, já que os recursos podem ser atrelados
    apenas a uma transação específica. Um uso possível é de plataformas de crowdfunding.

    De acordo com Daniel, o escritório de advocacia

    na estruturação jurídica da BRLD. O mercado de stableconis ainda não tem regras específicas no Brasil,
    mas caminha para uma regulação.

    Em novembro do ano passado o Banco Central estabeleceu

    regras para a autorização e a prestação de serviços de ativos virtuais

    , e criou as sociedades prestadoras de serviços de ativos virtuais (SPSVAs). Além disso, regulamentou
    quais atividades ou operações com ativos virtuais se inserem no mercado de câmbio e quais situações
    estão sujeitas à regulamentação de capitais internacionais. Os assuntos estão disciplinados nas resoluções
    BCB: 519, 520 e 521.

    O fundador avalia a regulação como um movimento positivo porque traz segurança ao mercado para adoção
    das moedas.

    Futuro é stablecoin

    Para Daniel, a stablecoin pode ser tornar o principal negócio da

    nos próximos anos por se tratar de uma necessidade fundamental das empresas, que é o dinheiro. “Há
    cinco anos eu não via as stablecoins com o potencial que vejo hoje. Até um tempo atrás elas eram muito
    uma inovação. Agora, viraram uma infraestrutura real que o mercado está usando” defende.

    Nascida em 2021, a

    fechou 2025 com uma receita de R$ 10 milhões. Para 2026, o plano é mais que dobrar de tamanho, chegando
    a R$ 25 milhões.

    O avanço virá das emissões de tokens de grandes clientes como o

    , que a

    começou a fazer no fim do ano passado, e também da movimentação da BRLD. A expectativa é que o volume
    de recursos transacionados em 2026 dê um salto exponencial. De um acumulado de R$ 1 bilhão nos últimos
    quatro anos, o plano é chegar a R$ 5 bilhões este ano.

    Até o fim do ano, a

    espera receber do Banco Central a licença de Sociedade de Crédito Direto (SCD), o que permitirá que,
    a partir de 2027, ela incorpore algumas operações que hoje são feitas com outras empresas e melhore
    ainda mais seus resultados.

    Com quase 40 funcionários, a companhia ainda tem recursos em caixa da rodada de R$ 12 milhões feita
    com o

    em 2024 e está próxima de atingir o breakeven. Com o desempenho promissor, o plano é fazer uma nova
    captação para financiar seus planos de expansão.

    O objetivo é levantar US$ 10 milhões, de preferência tendo um fundo estrangeiro liderando. “Queremos
    dolarizar o captable”, explica. Segundo ele,

    já se comprometeram a participar da captação, o que deve tornar o processo menos complexo. Além dos
    R$ 12 milhões do

    levantou R$ 27,5 milhões com o

    e mais R$ 14,5 milhões com

    , somando R$ 54 milhões levantados até agora.'
- tipo: noticia
  titulo: DeFi acelera no mercado brasileiro e se aproxima de R$ 1 bi tokenizado via TIDC
  url_fonte: https://braziljournal.com/brands/defi-acelera-no-mercado-brasileiro-e-se-aproxima-de-r-1-bi-tokenizado-via-tidc/
  data_publicacao: null
  conteudo_texto: 'A adoção de tecnologias originalmente desenvolvidas no ecossistema de finanças descentralizadas
    (DeFi) deixou de ser um experimento e está passando a integrar, de forma estruturada e regulada, o
    mercado de capitais brasileiro.

    Para quem não conhece, o DeFi é um conjunto de serviços financeiros baseados em

    , que funcionam sem intermediários tradicionais, como bancos ou corretoras

    Um dos principais vetores desse movimento é o

    Token de Investimento em Direitos Creditórios (TIDC)

    protocolo proprietário da Liqi

    – uma empresa de infraestrutura

    para o mercado de capitais regulado – que vem sendo utilizado por importantes instituições financeiras
    tradicionais para estruturar e gerenciar operações de crédito com maior eficiência, transparência
    e automação.

    Nesse contexto, a Liqi vem se consolidando como uma das principais infraestruturas

    aplicadas ao mercado de capitais regulado no Brasil, segundo Daniel Coquieri, o CEO da companhia.

    Apenas no último trimestre, a companhia alcançou a marca de US$ 100 milhões emitidos na rede XDC Network,
    uma

    projetada especialmente para aplicações empresariais e financeiras.

    Esse resultado foi impulsionado por quatro grandes operações institucionais. No acumulado do ano,
    o volume de ativos estruturados e tokenizados com apoio do TIDC se aproxima de R$ 1 bilhão, sinalizando
    uma adoção em escala por parte do mercado tradicional.

    O avanço não se limita ao volume financeiro, segundo o CEO.

    As operações recentes envolveram instituições financeiras e gestoras de grande porte, como Banco Itaú
    BBA, Banco BV, Banco ABC e a gestora Milenio.

    Para Coquieri, isso evidencia que a tecnologia

    já deixou de ser periférica e passou a integrar o core operacional de estruturas tradicionais de crédito,
    securitização e gestão de recebíveis.

    A lógica por trás do TIDC é inspirada nos mesmos princípios que tornaram protocolos DeFi, como AAVE,
    amplamente utilizados no exterior. Entre eles estão a automação via

    , transparência operacional, rastreabilidade de ativos e redução de fricções.

    Segundo o CEO, a diferença no caso brasileiro está na adaptação desses fundamentos a um ambiente totalmente
    regulado, compatível com as exigências da CVM, da legislação de securitização e das práticas do mercado
    de capitais.

    Na prática, o protocolo TIDC tem capacidade de processar altos volumes de operação com consistência.
    Sendo um aliado de gestores e estruturas de capital com recebíveis pulverizados (CCBs, INSS, FGTS,
    Consignados, etc.) que precisam saber de forma rápida o resultado e a posição da estrutura.

    As estruturas de TIDC da Liqi processam carteiras com mais de 10 milhões de recebíveis diariamente,
    garantindo que todos visualizem no dia indicadores e movimentação financeira, evitando que problemas
    de inadimplência, liquidação e aquisição sejam percebidos apenas no final do mês.

    O resultado, segundo Coquieri, é uma infraestrutura que combina a robustez do arcabouço regulatório
    tradicional com a eficiência tecnológica dos sistemas descentralizados.

    O CEO também diz que o volume financeiro é um reflexo direto da maturidade desse modelo.

    “O que chama a atenção não é apenas o valor movimentado, mas o fato de que essas operações já fazem
    parte da rotina de grandes instituições. A tecnologia DeFi está chegando ao mercado tradicional brasileiro
    por meio do TIDC, de forma silenciosa, regulada e escalável,” disse.

    A atuação da Liqi funciona como uma infraestrutura tecnológica, fornecendo a camada

    que sustenta essas operações, sem alterar a lógica jurídica ou regulatória que rege o mercado de capitais.

    Para o CEO, as operações recentes estruturadas por meio do TIDC reforçam a percepção de que a tokenização
    e os protocolos inspirados em DeFi já são uma realidade operacional no mercado de capitais brasileiro.

    As instituições que trabalham com Liqi utilizam o protocolo como base tecnológica para organizar,
    automatizar e acompanhar estruturas de crédito e securitização em ambiente totalmente regulado.

    Nessas operações, o TIDC atuou como a camada de

    e da estrutura, permitindo a automatização de regras de elegibilidade de ativos, controle de garantias,
    gestão de fluxos de pagamento e monitoramento contínuo de indicadores como subordinação e covenants.

    Segundo o CEO, a utilização de

    e do registro em blockchain trouxe maior transparência, rastreabilidade e eficiência operacional,
    além de reduzir fricções típicas de processos manuais e sistemas fragmentados.

    Para Coquieri, a adoção por diferentes perfis de instituições reforça que o TIDC não atende a um caso
    isolado: ele vem sendo utilizado como infraestrutura recorrente para escalar operações de crédito,
    ampliar a capacidade de originação e fortalecer a governança das estruturas, mantendo plena aderência
    às exigências regulatórias do mercado de capitais brasileiro.

    Esse movimento também sinaliza que a

    começa a cumprir um papel semelhante ao da internet no sistema financeiro: uma infraestrutura invisível,
    essencial para eficiência, mas integrada de forma natural às engrenagens do mercado tradicional.

    Além disso, diz o CEO, o crescimento do TIDC aponta para uma mudança estrutural na forma como o crédito
    é organizado, monitorado e distribuído no Brasil.

    Ao incorporar tecnologias

    de maneira regulada, o mercado avança para um modelo mais eficiente, auditável e integrado, sem abrir
    mão da segurança jurídica.

    Em paralelo a esse avanço operacional, a

    Liqi se prepara para um novo ciclo de crescimento

    .

    A companhia planeja realizar, ao longo de 2026, uma nova rodada de investimento de aproximadamente
    US$ 10 milhões, com o objetivo de acelerar a expansão do TIDC, ampliar sua infraestrutura tecnológica
    e fortalecer sua atuação junto a bancos, gestoras e demais participantes do mercado de capitais.

    A rodada ocorre em um momento de validação do modelo, após a consolidação do protocolo em operações
    de grande porte e em escala institucional.

    Para a Liqi, o momento consolida uma tese defendida desde sua fundação: a de que a blockchain não
    substituiria o mercado tradicional, mas se tornaria sua infraestrutura de base, sustentando novas
    formas de estruturar, escalar e operar o mercado de capitais brasileiro.'
