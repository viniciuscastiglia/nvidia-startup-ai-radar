  conteudo_texto: 'A Teachy — uma startup brasileira que está usando IA para ajudar os professores nas
    aulas — acaba de levantar R$ 40 milhões com duas gestoras americanas de referência.

    A Série A foi liderada pela Goodwater – que tem US$ 4 bilhões em ativos e já investiu no Spotify e
    Twitter – e teve a participação da Reach Capital, um VC focado em educação que foi um dos primeiros
    cheques do Duolingo.

    A missão da Teachy é nobre.

    A startup quer ajudar os professores a preparar as aulas, criar exercícios e avaliar os alunos com
    ferramentas de inteligência artificial — liberando um tempo precioso.

    A Teachy diz que um professor gasta em média 20 horas semanais trabalhando fora da escola, principalmente
    com a preparação do material que será apresentado aos alunos. Com sua ferramenta, ela promete reduzir
    esse tempo para 3 horas por semana.

    “Usamos o melhor conteúdo que tem no mundo inteiro. Com nossa plataforma, um professor no interior
    do Amazonas vai conseguir ter a mesma qualidade de ensino de uma escola de Palo Alto, da Finlândia
    ou de Singapura,” Pedro Siciliano, um dos fundadores, disse ao

    Segundo ele, a plataforma da Teachy ajuda na criação das aulas com a construção do plano de ensino,
    dos slides, das listas de exercícios, das provas e dos projetos. O professor também consegue corrigir
    os exercícios automaticamente, além de criar planos de ensino personalizados para cada aluno.

    “Temos mais de 60 ferramentas de IA específicas para a educação. É um leque completo para o professor.”

    Para criar um plano de aula, por exemplo, basta o professor preencher um formulário com o assunto
    que pretende abordar, o estilo de aula que quer dar, e informações adicionais sobre como a aula vai
    ser ministrada.

    “A partir desses materiais iniciais é possível usar ferramentas para criar uma lista de exercícios,
    projetos, resumos. E cada professor pode escolher a metodologia em que acredita. Pode ser uma aula
    expositiva, mas pode ser também com a metodologia de sala de aula invertida,” disse Pedro.

    A Teachy opera no modelo

    . O usuário não paga nada para se cadastrar e usar a plataforma, mas tem uma limitação de seis consultas
    por semana. Se quiser usar mais do que isso, a assinatura custa R$ 39,90 por mês.

    A plataforma já tem mais de 1 milhão de professores cadastrados, dos quais 300 mil são ativos (usaram
    a plataforma pelo menos uma vez no mês). A Teachy começou no Brasil, mas já é global. Metade dos usuários
    ativos são de outros países, com uma predominância para a América Latina e Sudeste Asiático.

    “Mais de 1 mil professores da Indonésia entram na plataforma todo dia,” disse o fundador. “Temos 50
    mil professores do México também, e temos quase isso na Colômbia.”

    A Teachy ainda está só arranhando a superfície de seu mercado endereçável. Segundo Pedro, existem
    2,3 milhões de professores no Brasil e cerca de 90 milhões no mundo. “E acreditamos em ajudar as pessoas
    a ensinar qualquer coisa, o que nos leva a centenas de milhões de ‘teaching creators’ que podemos
    ajudar a ensinar.”

    O empreendedor decidiu criar a Teachy porque sempre foi apaixonado pela educação. Enquanto cursava
    engenharia na IME, no Rio de Janeiro, Pedro foi professor particular e deu aula em cursinhos populares.

    Depois de formado, foi trabalhar na Mckinsey, onde ficou por três anos antes de entrar na Descomplica
    como head de expansão e M&A. Em seguida, foi fazer seu MBA em Stanford, onde começou a construir a
    ideia da Teachy.

    O outro fundador – e o CTO da empresa – é Fabio Baldissera, que já fundou outras três startups e tem
    mais de 10 anos de experiência com IA.

    Segundo Pedro, um dos diferenciais da Teachy são os dados proprietários que alimentam seus modelos
    de IA, incluindo questões do ENEM e de outras provas semelhantes de outros países do mundo.

    A IA também se alimenta de dados imputados pelos próprios professores, que podem contribuir com informações
    sobre suas áreas de conhecimento.

    “Com esses dados, conseguimos criar um conteúdo muito mais relevante para os professores e que não
    tenham erros, que é algo fundamental no nosso negócio,” disse ele. “Como somos específicos para isso,
    a qualidade do nosso conteúdo é muito melhor do que a de um ChatGPT.”

    Com os recursos da rodada, a Teachy vai investir em contratar mais profissionais de tecnologia e em
    expandir uma de suas principais apostas de receita: fechar pacotes com escolas, que assinam a plataforma
    para todos os seus professores.

    “Nosso discurso para as escolas é que a plataforma gera um ganho na qualidade de vida dos professores,
    porque eles têm que trabalhar menos fora da sala de aula, e também traz um impacto grande no

    do ensino, o que gera mais matrículas,” disse.

    Pedro não abre o número de escolas que já assinam a plataforma neste modelo, mas diz que são “centenas.”'
