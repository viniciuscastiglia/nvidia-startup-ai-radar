    Teachy capta R$ 8 mi para ajudar professores usando tecnologia de IA

    Nascida há menos de 1 ano, edtech faz pré-seed considerável e quer chegar a 10 mil professores na
    plataforma até o fim de 2024



    Pedro Siciliano e Fábio Baldissera, fundadores da Teachy

    Professores gastam cerca de metade do tempo deles fora de sala de aula preparando aulas e corrigindo
    provas. São tarefas periódicas e repetitivas que, no momento em que tanto de se fala de inteligência
    artificial, poderiam ser facilitadas. E é exatamente isso que a

    quer fazer.

    Nascida em outubro do ano passado a edtech se propõe a reduzir em 80% esse tempo oferecendo correção
    automática de provas, gabaritos comentados, planos de aula, criação de listas e materiais complementares
    como vídeos, gráficos e artigos. Os conteúdos estão voltados aos ensinos fundamental e médio. “O professor
    tem acesso a partes disso por meio de diferentes ferramentas. Pode pesquisar conteúdos no

    e montar na mão. Mas se quiser tudo em um lugar só, de forma otimizado com auxílio de IA, é com a

    ”, diz Pedro Siciliano, que fundou a companhia junto com Fábio Baldissera (ex-

    Pré-seed de responsa

    Para tornar essa proposta uma realidade, a edtech levantou uma rodada pré-seed considerável: R$ 8
    milhões. A captação foi liderada pelo fundo argentino

    e teve participação do americano

    . Entraram também alguns investidores-anjo bem conhecidos e nomes de grandes empresas brasileiras.

    Segundo Pedro, os recursos captados serão usados no desenvolvimento do produto e na criação de modelos
    de IA proprietários da companhia. “É o momento de criar os Googles que vão desenvolver tecnologia
    de ponta no Brasil”, crava Pedro. Essa busca por independência e por fomentar a criação de tecnologia

    Made in Brazil

    está expressa na composição do time fundador da

    : 80% da equipe é de profissionais técnicos, ou o que Pedro chama de “IME Máfia”, em uma referência
    à sua

    Instituto Militar de Engenharia

    . O time tem hoje 14 pessoas, sendo 10 em tempo integral e 4 em meio período.

    A escolha dos fundos que colocaram dinheiro na companhia também é um reflexo dessa ambição. Tanto

    têm forte ligação com a universidade de

    , a grande referência mundial quando o assunto é inteligência artificial e onde Pedro está cursando
    seu MBA. A

    também é investidora do

    . “Eu já sabia que ia usar inteligência artificial antes do começo da onda”, garante Pedro. Para ele,
    o hype tem um saldo positivo. “Tem o contra de ter muita gente querendo construir coisas que não vao
    funcionar. E tudo bem. Acontece. Mas o número de soluções incríveis que vão tornar a vida mais fácil
    é enorme e vai mudar o mundo do software. As empresas que não usam IA vão sumir”, diz.

    História e planos

    O projeto da

    começou a se concretizar quando Pedro entrou no MBA em

    no ano passado. Mas a história é um pouco mais longa. “A educação mudou a minha vida”, conta ele,
    que viu a mãe lutar contra um câncer por 9 anos e foi estudar no

    para ajudar em casa.

    Nessa época, ele montou um cursinho preparatório para vestibulares e foi onde percebeu a dor dos professores
    fora de sala de aula. Curiosidade. Das centenas de pessoas que passaram pelo cursinho, algumas trabalham
    na

    hoje. Saindo do

    , Pedro foi para a

    e depois para o

    , de onde partiu para

    e, agora, para empreender.

    A estratégia da

    é ganhar escala vendendo para escolas. Atualmente 4 são clientes da plataforma. Mas, como o objetivo
    é ser uma ferramenta democrática, ela está disponível também para contratação individual pelos professores
    em um modelo

    – com limitações de recursos e volume de uso na versão gratuita.

    O plano Premium custa R$ 19,90 por mês. Com ele é possível usar todos os recursos de forma ilimitada.
    Neste patamar, Pedro diz acreditar que será possível impactar também os professores do ensino público.
    Atualmente com 500 usuários, o objetivo é chegar a 10 mil até o fim do ano que vem. “E pegar uma rodada
    seed mais cedo [do que os 18 meses que normalmente costumam separar as captações]”, diz Pedro.

    Apesar de ter sido criada de olho nos 2 milhões de docentes brasileiros, a

    tem ambições globais. Começando pela América Latina. “O Alex Busse [sócio da

    responsável pelo aporte] confia muito em como a IA vai mudar a educação na região”, diz Pedro. Na
    América Latina, são 7 milhões de professores.'
