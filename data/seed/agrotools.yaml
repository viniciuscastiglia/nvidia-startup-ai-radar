  titulo: Depois de sondar a América, Agrotools ajusta a bússola da expansão e pensa até na África
  url_fonte: https://agfeed.com.br/agtech/depois-de-sondar-a-america-agrotools-ajusta-a-bussola-da-expansao-e-pensa-ate-na-africa/
  data_publicacao: null
  conteudo_texto: 'Depois de sondar a América, Agrotools ajusta a bússola da expansão e pensa até na África

    “Só há inovação onde há necessidade”, diz Sérgio Rocha, CEO da agtech. No Brasil, empresa lança, em
    parceria com o Imaflora, ferramenta que promete trazer mais credibilidade ao CAR

    Sérgio Rocha, fundador e CEO da Agrotools

    Em 2023, quando a Agrotools anunciou o início da sua expansão para a América do Norte, mais especificamente
    para os Estados Unidos, o CEO e fundador da agtech brasileira, Sérgio Rocha, colocou na bagagem as
    mais sofisticadas ferramentas e soluções tecnológicas desenvolvidas pela companhia para apresentar
    aos potenciais clientes.

    Mesmo já tendo atendido empresas da terra do tio Sam em projetos pontuais, a avaliação prévia era
    de que o setor demandaria ferramentas sofisticadas para implementar no campo.

    Mas ele admite hoje que estava enganado. Após os primeiros contatos, Rocha percebeu que as demandas
    do agronegócio norte-americano eram bem mais simples que as demandas brasileiras.

    "Para a nossa surpresa, verificamos que os mercados mais desenvolvidos não tinham avançado em tecnologia
    tanto quanto o Brasil”.

    A razão para isso, segundo ele, é bastante simples: necessidade. “Por conta dos seguros, subsídios
    e características da produção por lá, a tecnologia acabou ficando em segundo plano e o motor da criatividade
    é a dor de um problema. Só há inovação onde há necessidade", analisa.

    Em se tratando de desafios e necessidades, o mercado brasileiro é um prato cheio para o desenvolvimento
    de novas tecnologias. Não à toa, a Agrotools é detentora de um dos maiores bancos de dados do agronegócio
    do mundo e atende clientes como McDonalds, Nestlé, Itaú, Bradesco, Rabobank e o Banco Nacional de
    Desenvolvimento Econômico e Social (BNDES).

    Para Rocha, o crescimento acelerado do agronegócio brasileiro nos últimos anos fez com que as oportunidades
    de desenvolvimento de novas tecnologias avançassem de forma mais rápida se comparado aos demais mercados,
    justamente por conta dos desafios de estrutura, legislação e segurança de dados.

    No entanto, alguns segmentos como logística e armazenagem, por exemplo, avançaram a passos mais lentos,
    desafiando o setor a encontrar caminhos e ferramentas para equilibrar a balança em prol da eficiência.

    Foi assim, que a Agrotools, em parceria com o Instituto de Manejo Florestal e Agrícola (Imaflora),
    desenvolveu uma ferramenta que utiliza a inteligência artificial para analisar e categorizar os registros
    do Cadastro Ambiental Rural (CAR).

    Batizada de ScoreCAR, a tecnologia cruza dados de diversas plataformas para checar a confiabilidade
    das informações registradas nos cadastros que ainda não foram validados pelas Secretarias Municipas
    de Agricultura.

    A partir da análise, o sistema avalia a confiabilidade do CAR com base em 10 critérios e os classifica
    em um ranking com cinco pontuações diferentes.

    “Com isso é possível identificar os CAR que estão regulares e aqueles vulneráveis, que apresentam
    alguma inconsistência no histórico de dados e consequentemente um risco no cumprimento da legislação
    ambiental", explica o diretor de produtos da Agrotools, Breno Felix.

    Segundo Felix, o grande gargalo do CAR é a demora no tempo de validação do documento, depois que os
    dados são registrados. Com isso, milhões de produtores que estão na fila de espera têm dificuldades
    para obter financiamento e linhas de crédito, já que o CAR é pré-requisito para acessar tais recursos.

    Com a ferramenta, os cadastros que estão na fila receberão uma pontuação, o que permitirá aos produtores
    que tenham notas baixas, corrigir as inconsistências apontadas.

    Felix explica que o ScoreCAR contribui para reduzir outro risco apontado pelo mercado: uma vez que
    os dados do cadastro são autodeclarados, há espaço para fraudes e erros.

    Assim, o ScoreCAR utiliza diferentes softwares que se comunicam entre si, além de machine learning
    algoritmos de reconhecimento territorial e inteligência artificial, fazendo o cruzamento de dados
    que permite compor uma linha do tempo de cada documento, identificando inconsistências e conflitos
    de dados.

    “O sistema chega como uma resposta aos questionamentos cada vez maiores do mercado internacional quanto
    à confiabilidade dos dados e é mais um item de segurança para a agenda ESG do Brasil", pondera.

    A expansão da Agrotools para as Américas do Norte e do Sul veio após uma rodada de captação de US$
    20 milhões para a expansão das operações fora do Brasil. Atualmente a empresa está presente nos Estados
    Unidos, Paraguai e Argentina, mas o radar de oportunidades está sempre ligado.

    Assim, Rocha revela que a companhia está de olho em novos mercados, especialmente na Europa e na África.
    Neste último, Rocha enxerga certas semelhanças com os desafios do agronegócio no Brasil.

    “É um mercado complexo, com grande potencial e que assim como o Brasil, esbarra em uma grande quantidade
    de dados ainda pouco organizados. Talvez seja possível testar soluções que já utilizamos com sucesso
    por aqui", pondera.

    O empreendedor explica que, por enquanto, não há nenhum projeto efetivo de expansão, apenas avaliações.
    Rocha revela que em 2025 novos lançamentos virão, sem dar mais detalhes.

    A companhia não divulga previsão de crescimento para os próximos anos e ainda não fechou os dados
    para 2024, mas em 2023 alcançou um lifetime value - LTV (o volume investido pelos clientes durante
    o contrato) de R$ 338 milhões, volume 125% superior ao LTV de 2022, que foi de R$ 150 milhões.

    Ainda em 2023, segundo Rocha, a companhia registrou um aumento de 80% no faturamento mensal com receitas
    recorrentes em comparação a 2022.'
