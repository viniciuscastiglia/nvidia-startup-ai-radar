- tipo: noticia
  titulo: Agrotools, a 'big data do campo', planeja M&As e internacionalização
  url_fonte: https://braziljournal.com/agrotools-a-big-data-do-campo-planeja-mas-e-internacionalizacao/
  data_publicacao: null
  conteudo_texto: 'A Agrotools — uma startup focada em soluções de analytics e big data para o agronegócio
    — acaba de levantar R$ 85 milhões para perseguir uma estratégia de M&A e internacionalização.

    Os recursos vieram de investidores como Horácio Lafer Piva, da Klabin; Henry James Salomon, da BrProp;
    além do fundo Inovabra, do Bradesco.

    Há dois anos, a startup já havia levantado R$ 15 milhões junto ao fundo KPTL e aos empresários Pedro
    Paulo Campos, Paulo Haegler, Fatima Marques e Olivier Murguet.

    Somando as duas rodadas, os fundadores abriram mão de 20% do capital.

    A Agrotools não tem o perfil clássico de uma startup: ela foi fundada há mais de 15 anos por Sérgio
    Rocha, um ex-trader de commodities que viu a oportunidade de levar dados para um setor ainda pouco
    digitalizado.

    “O que fazemos é conectar Lucas do Rio Verde com a Faria Lima,” o fundador disse ao

    Brazil Journal.

    A Agrotools sempre gerou caixa, e só decidiu fazer a rodada para acelerar sua expansão no Brasil e
    no exterior — em parte por meio da aquisição de concorrentes.

    Segundo Sergio, a Agrotools já fechou a compra de uma plataforma internacional que será anunciada
    em breve e que auxilia o produtor “a ser visto de uma maneira mais individualizada, e não na média.”

    “A plataforma disponibiliza dados individualizados do produtor que garantem condições especiais para
    ele, por exemplo, na hora de tomar um empréstimo,” disse o fundador.

    Hoje, a Agrotools opera em três linhas de negócios.

    A primeira é o que a empresa chama de um ‘BI territorial’, basicamente uma inteligência de dados que
    ajuda os clientes a ter visibilidade de como e onde comprar commodities no Brasil. “É um produto para
    tradings, frigoríficos, indústrias,” disse Sergio.

    O segundo é semelhante ao primeiro, mas com um caso de uso oposto: usa os dados para dar inteligência
    sobre as melhores regiões para vender insumos como fertilizantes e tratores. Esse produto também é
    usado por bancos e cooperativas de crédito para analisar se vale a pena ou não financiar um produtor.

    O terceiro produto é uma solução para atender às demandas ESG. Basicamente, a ferramenta permite que
    o cliente analise se seus fornecedores estão alinhados com suas políticas de sustentabilidade.

    A inteligência usada por essas três ferramentas vem de dados geográficos colhidos por satélites.

    “A primeira coisa que fazemos é criar uma geo-id (uma espécie de identidade geográfica) das fazendas.
    Já temos 4,5 milhões dessas geo-ids cadastradas,” disse Sergio. “Depois, essa identidade serve como
    base para analisarmos essas áreas e cruzarmos com dados públicos de satélites e com dados que a gente
    vai construindo.”

    Se um produtor deu sua produção como garantia, por exemplo, a solução da Agrotools consegue usar esses
    dados e seu algoritmo para acompanhar se a produção está indo bem.

    A empresa vende essas soluções num modelo de assinaturas para mais de 200 clientes, incluindo gigantes
    como a Cargill, Nestlé e Itaú. A empresa faturou R$ 130 milhões no ano passado, o dobro do ano anterior.'
