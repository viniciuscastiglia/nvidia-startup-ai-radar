  conteudo_texto: 'Agrotools prova que startups e governo podem trabalhar juntos

    Agtech investe em base operacional em Brasília para impulsionar inovação e sustentabilidade do setor
    agro na região



    Para contribuir com a transformação do agronegócio digital e impulsionar inovação, a

    , startup focada em soluções de analytics e big data para o agronegócio, anuncia uma nova base operacional
    e comercial em Brasília. A movimentação faz parte da estratégia que marca a entrada da agtech no mercado
    governamental para impulsionar a transformação no agro digital, especialmente no Centro-Oeste.

    Fundada em 2007 por Sergio Rocha, um ex-trader de commodities que viu a oportunidade de levar dados
    a um setor até então pouco digitalizado, a

    sempre atendeu a iniciativa privada, oferecendo uma plataforma digital voltada às corporações agro,
    com soluções de gestão de risco, análises remotas, entre outras.

    No entanto, de acordo com Sergio, sempre houve uma cobrança para que a agtech também tivesse uma linguagem
    Gov. Em conversa com o

    , o CEO comentou que a

    se preparou para este novo “aproach” pelos últimos três anos com uma base de especialistas e algumas
    contratações de profissionais com experiência no cliente público.

    Para representar o setor de vendas e relações governamentais em Brasília, por exemplo, a companhia
    nomeou Sérgio Oliveira para ser responsável pelo desenvolvimento de relacionamento e novos negócios
    da startup. O executivo acumula experiência de mais de 20 anos em tecnologia, finance banking e varejo,
    e já passou por empresas como

    , referências globais em inovação e tecnologias data-driven.

    “A interação direta com autoridades governamentais e a participação ativa em discussões sobre o desenvolvimento
    do agronegócio possibilitam a oportunidade de contribuir para a formulação de políticas que impulsionam
    a inovação e o crescimento sustentável do setor. A partir de agora, vamos traduzir os dados e inteligência
    que as corporações já utilizam para o governo e bancos estatais”, afirma o CEO da

    .

    Sergio Rocha, fundador e CEO da Agrotools (Foto: Divulgação)

    Pioneirismo no setor

    A agtech já atua junto a

    órgãos governamentais, como o BNDES

    e MAPA, no desenvolvimento de uma calculadora de emissão de carbono na pecuária. Nesse projeto, a
    ela é responsável pela inserção de dados pelos usuários, geração de relatórios de desempenho ambiental
    e pelos processos associados de certificação e validação externa dos dados registrados na calculadora.

    Em outra iniciativa, com o Estado do Mato Grosso, a

    fornece uma plataforma digital para reinserção de produtores rurais com bloqueios socioambientais
    no mercado formal por meio do Programa de Reinserção e Monitoramento (PREM), do Instituto Mato-Grossense
    da Carne (IMAC).

    “Hoje as entidades governamentais necessitam de soluções para gargalos existentes no setor. Estabelecer
    uma operação em Brasília é um passo para nos aproximarmos cada vez mais do governo e de bancos estatais
    para colaborar com o desenvolvimento do mercado agropecuário brasileiro com tecnologia e dados em
    grande escala”, acrescenta Sergio.

    Nova rodada?

    Depois de captar, em 2022, R$ 100 milhões em uma estratégia focada em M&As e internacionalização para
    a América Latina, — com investidores como Horácio Lafer Piva, da Klabin e o fundo Inovabra, do Bradesco
    — a

    não pretende fazer uma nova captação em 2024.

    Vale lembrar que em seus mais de 15 anos, a startup sempre gerou caixa com dinheiro próprio, e só
    decidiu fazer a rodada para acelerar sua expansão no Brasil e no exterior — em parte por meio da aquisição
    de concorrentes. Um ano depois da captação, a startup adquiriu a

    , plataforma argentina de inteligência para produtores rurais.

    “Não estamos em busca de novos investimentos, a não ser que seja necessário para reforçar o caixa
    para eventuais novas aquisições. Olhamos M&A como estratégia para aquisição de carteira ou tecnologia.
    Em como crescer além do orgânico”, enfatiza o CEO.'
